<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="MEFCO Watch — live football scores, national teams, competitions, news and statistics.">
<title>MEFCO Watch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#050607;
  --bg2:#080b0e;
  --panel:#0b0f12;
  --panel2:#10151a;
  --panel3:#151b21;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#f7f8f5;
  --muted:#89939b;
  --soft:#b7c0c5;
  --green:#b7ff2a;
  --green2:#76d900;
  --cyan:#63e6ff;
  --red:#ff5364;
  --amber:#ffd166;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 25px 80px rgba(0,0,0,.45);
  --shadow2:0 12px 40px rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--text);
  font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(183,255,42,.08),transparent 23rem),
    radial-gradient(circle at 96% 12%,rgba(99,230,255,.055),transparent 27rem),
    linear-gradient(180deg,#080a0c 0,#050607 55%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.025;
  background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px);
}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.app{min-height:100vh}

/* HEADER / BROADCAST NAV */
header{
  position:sticky;top:0;z-index:30;min-height:76px;padding:11px 30px;
  display:flex;align-items:center;gap:24px;
  background:rgba(5,6,7,.78);border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
}
header:before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--green),var(--cyan),transparent);opacity:.65}
.logo{
  position:relative;display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:5px 0;
  border:0;background:none;color:#fff;font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:900;letter-spacing:-1.2px;text-transform:uppercase;
}
.logo:before{content:"";width:9px;height:27px;background:var(--green);transform:skewX(-15deg);box-shadow:0 0 20px rgba(183,255,42,.45)}
.logo span{color:var(--green)}
nav{display:flex;align-items:center;justify-content:center;gap:5px;flex:1}
nav button,.ghost{
  position:relative;border:1px solid transparent;background:transparent;color:#7f898f;padding:10px 13px;border-radius:11px;
  font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;transition:.22s ease;
}
nav button:after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:var(--green);transform:scaleX(0);transform-origin:center;transition:.22s}
nav button:hover,.ghost:hover{color:#fff;background:rgba(255,255,255,.045);border-color:var(--line)}
nav button.active{color:#fff;background:rgba(183,255,42,.075);border-color:rgba(183,255,42,.16)}
nav button.active:after{transform:scaleX(1)}
.head-right{display:flex;align-items:center;gap:8px}
.notif{position:relative;overflow:hidden;border:1px solid var(--line2);background:#0b0f12;color:#e8eeeb;padding:9px 12px;border-radius:11px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.55px;transition:.2s;isolation:isolate;box-sizing:border-box}
.notif:before{content:"";position:absolute;left:4px;top:4px;bottom:4px;width:58%;background:linear-gradient(90deg,rgba(183,255,42,.18) 0%,rgba(183,255,42,.28) 68%,rgba(183,255,42,.1) 100%);clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);-webkit-clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);z-index:-1;pointer-events:none}
.notif:hover{border-color:rgba(183,255,42,.5);box-shadow:0 0 25px rgba(183,255,42,.1)}

/* TICKER */
.ticker{height:38px;display:flex;align-items:center;overflow:hidden;background:#090c0e;border-bottom:1px solid var(--line);box-shadow:0 10px 35px rgba(0,0,0,.2)}
.ticker:before{content:"LIVE FEED";height:100%;display:flex;align-items:center;padding:0 15px;background:var(--green);color:#050607;font-size:10px;font-weight:1000;letter-spacing:1px;position:relative;z-index:2}
.ticker-track{white-space:nowrap;animation:scroll 40s linear infinite;padding-left:25px;color:#a4adb2;font-size:10px;font-weight:700;letter-spacing:.2px}
.ticker b{color:var(--green);font-weight:1000}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* PAGE */
main{width:min(1560px,100%);margin:auto;padding:36px 30px 90px}
.page{display:none;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both}.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* UNIVERSAL CARDS */
.card,.hero-main{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));box-shadow:var(--shadow2);
}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 28%,transparent 72%,rgba(255,255,255,.018));opacity:.7}
.card:hover{border-color:rgba(255,255,255,.15);box-shadow:0 18px 60px rgba(0,0,0,.42);transform:translateY(-2px)}
.card{transition:border-color .22s,box-shadow .22s,transform .22s}
.section{margin-top:42px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}
.section-head h2,h2{font-family:"Barlow Condensed",sans-serif;font-size:32px;line-height:.95;letter-spacing:-.5px;text-transform:uppercase}
.section-head p,.muted{color:var(--muted);font-size:12px;margin-top:7px}
.eyebrow{color:var(--green);font-size:10px;font-weight:1000;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px}
.date{color:#748087;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.empty{border:1px dashed rgba(255,255,255,.13);border-radius:18px;padding:40px;text-align:center;color:#707a80;background:rgba(255,255,255,.015)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.65fr);gap:16px;margin-bottom:32px}
.hero-main{min-height:390px;padding:42px;display:flex;flex-direction:column;justify-content:flex-end;background:
  radial-gradient(circle at 78% 18%,rgba(183,255,42,.19),transparent 22%),
  radial-gradient(circle at 90% 90%,rgba(99,230,255,.10),transparent 28%),
  linear-gradient(135deg,#151c20 0,#090c0f 68%);}
.hero-main:before{content:"01";position:absolute;right:-10px;top:-45px;font-family:"Barlow Condensed";font-size:280px;font-weight:900;line-height:1;color:rgba(255,255,255,.025);font-style:italic}
.hero-main:after{content:"";position:absolute;width:380px;height:380px;right:8%;top:8%;border:1px solid rgba(183,255,42,.12);border-radius:50%;box-shadow:0 0 0 30px rgba(183,255,42,.012),0 0 0 60px rgba(183,255,42,.008);pointer-events:none}
.hero-main h1{position:relative;z-index:1;max-width:820px;font-family:"Barlow Condensed";font-size:clamp(54px,6vw,94px);line-height:.84;letter-spacing:-2.8px;text-transform:uppercase;font-weight:900}
.hero-main p{position:relative;z-index:1;max-width:650px;color:#aeb8bc;font-size:14px;line-height:1.65;margin-top:20px}
.hero-side{padding:26px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(155deg,#11171b,#090c0f)}
.hero-side h3{font-family:"Barlow Condensed";font-size:30px;line-height:.95;text-transform:uppercase;margin-bottom:18px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-stat{padding:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:14px}.mini-stat strong{display:block;font-family:"Barlow Condensed";font-size:30px;line-height:1}.mini-stat span{display:block;margin-top:5px;color:#7f8a90;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* BUTTONS */
.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid var(--line2);background:rgba(255,255,255,.045);color:#eef2ef;padding:11px 15px;border-radius:11px;font-size:10px;font-weight:900;letter-spacing:.65px;text-transform:uppercase;transition:.2s;position:relative;z-index:2}
.btn:hover{border-color:rgba(183,255,42,.45);background:rgba(183,255,42,.08);transform:translateY(-1px)}
.btn.primary{color:#071000;background:var(--green);border-color:var(--green);box-shadow:0 8px 30px rgba(183,255,42,.16)}.btn.primary:hover{background:#c9ff5d;box-shadow:0 10px 40px rgba(183,255,42,.26)}
.btn.danger{color:#fff;background:rgba(255,83,100,.12);border-color:rgba(255,83,100,.35)}.btn.small{padding:8px 10px;font-size:9px}.btn:disabled{opacity:.45;cursor:not-allowed}

/* MATCH CARDS */
.match-card{padding:0;background:linear-gradient(160deg,#11171b,#090c0e)}
.match-card:after{content:"";position:absolute;inset:auto 0 0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0;transition:.2s}.match-card:hover:after,.match-card.live:after{opacity:1}
.match-top{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)}
.competition-label{font-size:9px;color:#7f8a90;font-weight:900;text-transform:uppercase;letter-spacing:.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.status{font-size:9px;color:#7f8a90;font-weight:900;letter-spacing:.6px}.live-dot{color:var(--red);font-size:9px;font-weight:1000;letter-spacing:.7px;animation:pulse 1.6s infinite}.live-dot:before{content:"";display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:5px;box-shadow:0 0 10px rgba(255,83,100,.7)}
@keyframes pulse{50%{opacity:.45}}
.teams{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:24px 16px}.team{text-align:center;font-family:"Barlow Condensed";font-size:21px;font-weight:700;line-height:1.05;text-transform:uppercase}.team img{width:48px;height:48px;object-fit:contain;margin:0 auto 9px;filter:drop-shadow(0 7px 13px rgba(0,0,0,.4))}.score{font-family:"Barlow Condensed";font-size:34px;font-weight:900;text-align:center;letter-spacing:-1px}.teams>div:nth-child(2) .status{text-align:center;margin-top:3px}.match-bottom{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-top:1px solid var(--line);background:rgba(0,0,0,.13)}

/* NEWS */
.news-card{min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,#13191d,#090c0e)}
.news-card .news-image{height:155px;overflow:hidden;background:linear-gradient(135deg,#151b1f,#080a0c)}.news-card .news-image img{width:100%;height:100%;object-fit:cover;transition:.5s}.news-card:hover .news-image img{transform:scale(1.055)}
.news-body{padding:18px}.news-body h3{font-family:"Barlow Condensed";font-size:25px;line-height:.98;text-transform:uppercase;margin:8px 0}.news-body p{font-size:12px;line-height:1.55;color:#929da3}.news-card .btn{margin-top:13px}

/* TABLES */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.12)}.table{width:100%;border-collapse:collapse;min-width:600px}.table th{padding:12px 13px;color:#667279;font-size:9px;letter-spacing:1px;text-transform:uppercase;text-align:left;background:#0a0e11;border-bottom:1px solid var(--line)}.table td{padding:13px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11px;color:#d8dedf}.table tr:hover td{background:rgba(183,255,42,.025)}.table tr:last-child td{border-bottom:0}

/* COMPETITIONS */
.competition-card{min-height:230px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(circle at 90% 15%,rgba(183,255,42,.11),transparent 24%),linear-gradient(145deg,#141a1e,#090c0f)}
.competition-card:before{content:"COMP";position:absolute;right:-10px;bottom:-35px;font-family:"Barlow Condensed";font-size:120px;font-weight:900;font-style:italic;color:rgba(255,255,255,.025)}
.competition-card h3{font-family:"Barlow Condensed";font-size:34px;line-height:.9;text-transform:uppercase;max-width:80%}.competition-card p{color:#7e898f;font-size:11px;margin-top:8px}.competition-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px;padding:6px 9px;color:#89949a;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.7px}

/* PLAYER PROFILE — HERO-FIRST, IMAGE-DRIVEN */
.player-header{
  min-height:430px;padding:0;display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);align-items:stretch;
  background:
    radial-gradient(circle at 12% 45%,rgba(183,255,42,.18),transparent 24%),
    linear-gradient(115deg,#151b1f,#080b0e 70%);
  border-color:rgba(255,255,255,.11);
}
.player-header:after{content:"PLAYER";position:absolute;right:-25px;bottom:-62px;font-family:"Barlow Condensed";font-style:italic;font-size:180px;font-weight:900;color:rgba(255,255,255,.028);pointer-events:none}
.player-avatar{
  min-height:430px;display:flex;align-items:end;justify-content:center;position:relative;overflow:hidden;
  font-family:"Barlow Condensed";font-size:180px;font-weight:900;color:rgba(255,255,255,.15);
  background:radial-gradient(circle at 50% 42%,rgba(183,255,42,.16),transparent 31%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25));
}
.player-avatar:before{content:"";position:absolute;bottom:-120px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(183,255,42,.15);box-shadow:0 0 0 35px rgba(183,255,42,.02),0 0 0 70px rgba(183,255,42,.012)}
.player-avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));padding:20px 30px 0}
.player-avatar.has-photo{font-size:0;background:linear-gradient(180deg,rgba(183,255,42,.08),rgba(0,0,0,.25))}.player-avatar.has-photo .player-initial{display:none}.player-initial{position:relative;z-index:1}
.player-avatar.has-photo:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.45));z-index:3;pointer-events:none}
.profile-meta{position:relative;z-index:4;align-self:center;padding:48px 48px 48px 25px}.profile-meta .eyebrow{font-size:11px}.profile-meta h1{font-family:"Barlow Condensed";font-size:clamp(58px,7vw,105px);font-weight:900;line-height:.78;letter-spacing:-2px;text-transform:uppercase;max-width:760px}.profile-meta p{margin-top:18px;color:#aab4b8;font-size:13px}.profile-meta:before{content:"";position:absolute;left:0;top:52px;width:4px;height:110px;background:var(--green);box-shadow:0 0 25px rgba(183,255,42,.3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.kpi{padding:17px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-10px;bottom:-20px;width:60px;height:60px;border-radius:50%;background:rgba(183,255,42,.05)}.kpi strong{display:block;font-family:"Barlow Condensed";font-size:31px;line-height:.9}.kpi span{display:block;margin-top:6px;color:#747f85;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* TEAM PROFILE */
.team-header{padding:30px;display:flex;align-items:center;gap:25px;background:radial-gradient(circle at 15% 50%,rgba(183,255,42,.12),transparent 25%),linear-gradient(135deg,#141a1e,#090c0f)}
.team-header img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 15px 22px rgba(0,0,0,.45))}.team-header h1{font-family:"Barlow Condensed";font-size:65px;line-height:.85;text-transform:uppercase}.team-header p{margin-top:10px;color:#8e999e;font-size:12px}

/* MATCH CENTRE */
.match-hero{padding:28px;background:radial-gradient(circle at 50% 0,rgba(183,255,42,.11),transparent 35%),linear-gradient(145deg,#151b1f,#080b0e)}
.match-hero .teams{padding:35px 25px}.match-hero .team{font-size:28px}.match-hero .team img{width:75px;height:75px}.match-hero .score{font-size:64px}.timeline,.log{display:flex;flex-direction:column;gap:8px}.log-item{padding:12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px;color:#b7c0c5;font-size:11px}

/* FORMS / ADMIN */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:flex;flex-direction:column;gap:7px;color:#818c92;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}.input,.select,textarea{width:100%;border:1px solid var(--line2);outline:0;background:#090d10;color:#edf2ef;border-radius:11px;padding:11px 12px;font-size:11px}.input:focus,.select:focus,textarea:focus{border-color:rgba(183,255,42,.55);box-shadow:0 0 0 3px rgba(183,255,42,.07)}

/* SEARCH */
.search-results{display:grid;gap:8px}.search-result{padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);transition:.2s}.search-result:hover{border-color:rgba(183,255,42,.25);background:rgba(183,255,42,.035);transform:translateX(3px)}

/* FOOTER / UTILITY */
.db-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffbd45;margin-right:7px;box-shadow:0 0 10px rgba(255,189,69,.35)}.db-dot.ok{background:var(--green);box-shadow:0 0 12px rgba(183,255,42,.55)}
.hide{display:none!important}.toast{position:fixed;right:22px;bottom:22px;z-index:100;padding:13px 16px;border:1px solid var(--line2);border-radius:13px;background:rgba(10,13,15,.94);box-shadow:var(--shadow);color:#edf2ef;font-size:11px;font-weight:800;backdrop-filter:blur(18px)}

/* IMAGE SAFETY */
.news-card img,.team-header img,.team img,.player-avatar img{image-rendering:auto}
img[src=""],img:not([src]){display:none}

/* MATCH EVENT PAINT + RICH MATCH CENTRE */
.mc-event{position:relative;overflow:hidden;min-height:74px;display:grid;grid-template-columns:48px 34px minmax(0,1fr);gap:9px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:13px;background:#080b0e;isolation:isolate;box-sizing:border-box}
.mc-event-slab{position:absolute;top:4px;right:4px;bottom:4px;left:4px;display:block;overflow:hidden;border-radius:9px;background:#070a0c;z-index:0;pointer-events:none;box-sizing:border-box}
.mc-event-paint{position:absolute;top:-8%;right:-8%;bottom:-8%;left:-8%;width:116%;height:116%;display:block;object-fit:cover;object-position:center;opacity:1;filter:saturate(1.35) contrast(1.08);-webkit-clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);z-index:0}
.mc-event-slab:after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,rgba(5,8,10,.42) 0%,rgba(0,0,0,.18) 52%,rgba(0,0,0,.12) 100%);z-index:1;pointer-events:none}
.mc-event-minute{position:relative;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.85);font-family:"Barlow Condensed";font-size:21px;font-weight:900;text-align:center}.mc-event-icon{position:relative;z-index:3}.mc-event-copy{position:relative;z-index:3}.mc-event-copy strong,.mc-event-copy span{ text-shadow:0 1px 7px rgba(0,0,0,.8)}.mc-event-goal .mc-event-icon{background:rgba(183,255,42,.12);box-shadow:0 0 18px rgba(183,255,42,.08)}.mc-event-yellow .mc-event-icon{background:rgba(255,193,7,.15)}.mc-event-red .mc-event-icon{background:rgba(255,83,100,.15)}
.mc-summary{font-size:12px;line-height:1.7;color:#b8c1c5;margin:4px 0}.motm{margin-top:15px;padding:13px;border:1px solid rgba(183,255,42,.15);border-radius:13px;background:rgba(183,255,42,.04);display:grid;grid-template-columns:1fr auto;gap:3px 12px}.motm .eyebrow{grid-column:1/-1}.motm strong{font-family:"Barlow Condensed";font-size:24px;text-transform:uppercase}.motm span{align-self:center;color:var(--green);font-weight:1000}

function normalizePosition(v){let x=String(v||'').trim().toLowerCase().replace(/[._-]+/g,' ').replace(/\s+/g,' ');if(!x)return'unknown';if(/^(gk|goalkeeper|goalie|keeper)$/.test(x))return'gk';if(/^(lb|left back|leftback)$/.test(x))return'lb';if(/^(rb|right back|rightback)$/.test(x))return'rb';if(/^(lwb|left wing back|left wingback)$/.test(x))return'lwb';if(/^(rwb|right wing back|right wingback)$/.test(x))return'rwb';if(/^(lcb|left centre back|left center back)$/.test(x))return'lcb';if(/^(rcb|right centre back|right center back)$/.test(x))return'rcb';if(/^(cb|centre back|center back|central defender|sweeper|sw)$/.test(x))return'cb';if(/^(cdm|dm|defensive midfielder|holding midfielder)$/.test(x))return'cdm';if(/^(lcm|left central midfielder|left centre midfielder)$/.test(x))return'lcm';if(/^(rcm|right central midfielder|right centre midfielder)$/.test(x))return'rcm';if(/^(cm|central midfielder|centre midfielder|center midfielder)$/.test(x))return'cm';if(/^(cam|am|attacking midfielder|central attacking midfielder)$/.test(x))return'cam';if(/^(lm|left midfielder)$/.test(x))return'lm';if(/^(rm|right midfielder)$/.test(x))return'rm';if(/^(lw|lwf|left wing|left winger)$/.test(x))return'lw';if(/^(rw|rwf|right wing|right winger)$/.test(x))return'rw';if(/^(cf|centre forward|center forward|false 9)$/.test(x))return'cf';if(/^(ss|support striker|shadow striker)$/.test(x))return'ss';if(/^(st|striker|forward|fw)$/.test(x))return'st';return'unknown'}

function safeArticleHtml(input){
 const raw=String(input||'');
 if(!raw)return '';
 const doc=new DOMParser().parseFromString(raw,'text/html');
 const allowed=['P','BR','STRONG','B','EM','I','U','S','H2','H3','H4','BLOCKQUOTE','UL','OL','LI','A','IMG','HR','DIV','SPAN'];
 const walk=node=>{
  [...node.childNodes].forEach(child=>{
   if(child.nodeType===1){
    if(!allowed.includes(child.tagName)){const frag=document.createDocumentFragment();while(child.firstChild)frag.appendChild(child.firstChild);child.replaceWith(frag);return walk(node)}
    [...child.attributes].forEach(a=>{if(!['href','src','alt','target','rel','class'].includes(a.name))child.removeAttribute(a.name)});
    if(child.tagName==='A'){const href=child.getAttribute('href')||'';if(!/^https?:\/\//i.test(href)){child.removeAttribute('href')}else{child.setAttribute('target','_blank');child.setAttribute('rel','noopener noreferrer')}}
    if(child.tagName==='IMG'){const src=child.getAttribute('src')||'';if(!/^https?:\/\//i.test(src))child.remove()} else walk(child)
   }
  })
 };
 walk(doc.body);return doc.body.innerHTML;
}

window.switchMatchTab=function(tab){const target=document.getElementById('mc-'+tab);if(!target)return;document.querySelectorAll('.mc-tab').forEach(b=>b.classList.toggle('active',b.dataset.mctab===tab));document.querySelectorAll('.mc-tab-panel').forEach(p=>p.classList.toggle('active',p.id==='mc-'+tab));requestAnimationFrame(()=>target.scrollIntoView({behavior:'smooth',block:'start'}));};
function renderLiveMomentum(m,events){const end=isFinished(m)?90:Math.max(1,Number(m.minute||0)||1),bins=[];for(let i=0;i<=end;i+=5)bins.push({home:0,away:0});const weights={goal:5,shot:1.1,corner:.7,yellow:.1,red:-1,substitution:.2,var:.1,foul:.15};(events||[]).forEach(e=>{const side=String(e.team_id)===String(m.home_team_id)?'home':String(e.team_id)===String(m.away_team_id)?'away':null;if(!side)return;const idx=Math.min(bins.length-1,Math.floor((Number(e.minute)||0)/5)),w=weights[eventType(e)]||0;bins[idx][side]+=w});let h=0,a=0;const pts=bins.map((b,i)=>{h+=b.home;a+=b.away;return[(i/(Math.max(1,bins.length-1)))*100,50-Math.max(-8,Math.min(8,h-a))/8*38]});const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');return`<div class="mc-momentum"><div class="mc-momentum-head"><div><div class="eyebrow">${isLive(m)?'Live event momentum':'Match momentum'}</div><h3>${esc(teamDisplayName(m,'home'))} vs ${esc(teamDisplayName(m,'away'))}</h3></div><div class="mc-momentum-legend"><span><i class="mc-momentum-dot"></i>${esc(teamDisplayName(m,'home'))}</span><span><i class="mc-momentum-dot away"></i>${esc(teamDisplayName(m,'away'))}</span></div></div><div class="mc-momentum-chart"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="${line}" fill="none" stroke="rgba(183,255,42,.9)" stroke-width="1.6" vector-effect="non-scaling-stroke"></path><line x1="0" y1="50" x2="100" y2="50" stroke="rgba(255,255,255,.18)" stroke-dasharray="2 2"></line></svg></div><div class="mc-momentum-note">Event-based momentum from recorded match events. It is not a possession or player-tracking model.</div></div>`}
function renderMatchCommunity(m){const linked=channelForMatch(m),list=comments.filter(c=>String(c.match_id)===String(m.id)).slice().sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));return `<div class="mc-panel-title"><div><div class="eyebrow">Match community</div><h3>Comment on this match</h3></div><span>${list.length} comment${list.length===1?'':'s'}</span></div>${linked.length?`<div class="linked-channels"><span class="eyebrow">Linked channels</span>${linked.map(c=>`<a class="channel-pill" href="${esc(c.url||'#')}" target="_blank" rel="noopener noreferrer">${c.icon_url?`<img src="${esc(c.icon_url)}" alt="">`:''}<span>${esc(c.name)}</span>${c.is_verified?'✓':''}</a>`).join('')}</div>`:''}<div class="comment-composer"><input id="commentName_${esc(m.id)}" class="input" maxlength="40" placeholder="Your name"><textarea id="commentBody_${esc(m.id)}" class="input" maxlength="1000" rows="4" placeholder="Say something about the match…"></textarea><button class="btn primary" onclick="submitMatchComment('${esc(m.id)}')">Send comment</button></div>${list.length?`<div class="comment-list">${list.map(c=>{const ch=channels.find(x=>String(x.id)===String(c.channel_id));return `<article class="match-comment"><div class="comment-author"><strong>${esc(c.author_name||'MEFCO Fan')}</strong>${ch?`<span>${esc(ch.name)}</span>`:''}<time>${esc(formatNewsDate(c))}</time></div><p>${esc(c.body||'')}</p></article>`}).join('')}</div>`:'<div class="mc-empty">Be the first to comment on this match.</div>'}`}
async function submitMatchComment(matchId){const name=(document.getElementById('commentName_'+matchId)?.value||'').trim().slice(0,40),body=(document.getElementById('commentBody_'+matchId)?.value||'').trim().slice(0,1000);if(!body){showToast('Write a comment first');return}try{const row=await supabaseFetch(COMMENTS_URL,{method:'POST',body:JSON.stringify({match_id:matchId,author_name:name||'MEFCO Fan',body,status:'published'})});const item=Array.isArray(row)?row[0]:row;if(item)comments.push(item);showToast('Comment posted');renderMatch()}catch(e){console.error(e);showToast('Could not post comment. Check the community tables/RLS.')}}
function renderMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId)),el=document.getElementById('match-page');if(!m){el.innerHTML='<div class="empty">Match not found.</div>';return}let [a,b]=scoreOf(m),allEvents=[...(m.events||[])].sort((x,y)=>(Number(x.minute||0)-Number(y.minute||0))||(Number(x.stoppage||0)-Number(y.stoppage||0))),events=allEvents.filter(e=>eventType(e)!=='assist'),ht=teamById(m.home_team_id),at=teamById(m.away_team_id),live=isLive(m),finished=isFinished(m),meta=matchMeta(m),status=live?`LIVE • ${Number(m.minute||0)}${m.stoppage?`+${m.stoppage}`:''}'`:finished?'FULL TIME':String(m.status||'SCHEDULED').toUpperCase(),motm=automaticMOTM(m)|| (meta.man_of_match?{p:playerById(meta.man_of_match),r:ratingFor(meta,playerById(meta.man_of_match))}:null);let summary=meta.summary||m.summary||m.commentary||'';el.innerHTML=`<div class="match-centre-shell"><div class="match-centre-bar"><button class="ghost" onclick="navFor('scores')">← Scores</button>${ADMIN_MODE?`<button class="btn" onclick="openMatchEditor('${esc(m.id)}')">Edit match</button>`:''}</div><div class="card mc-hero"><div class="mc-topline"><span class="mc-competition">${esc(competitionNameForMatch(m))}</span><span class="mc-date">${esc(fmtDate(matchDate(m),{weekday:'long',month:'long',day:'numeric',year:'numeric'}))}</span></div><div class="mc-scoreboard"><div class="mc-team">${ht&&teamFlag(ht)?`<img src="${esc(teamFlag(ht))}" alt="">`:''}<div class="mc-team-name">${esc(teamDisplayName(m,'home'))}</div><div class="mc-team-side">Home</div></div><div class="mc-score"><div class="mc-big-score">${finished||live?a+'–'+b:'VS'}</div><span class="mc-status ${live?'live':finished?'done':''}">${esc(status)}</span></div><div class="mc-team">${at&&teamFlag(at)?`<img src="${esc(teamFlag(at))}" alt="">`:''}<div class="mc-team-name">${esc(teamDisplayName(m,'away'))}</div><div class="mc-team-side">Away</div></div></div><div class="mc-meta"><div class="mc-meta-item"><strong>${esc(fmtTime(matchTime(m) lass="mc-panel-title"><div><div class="eyebrow">Events</div><h3>Full timeline</h3></div><span>${events.length} event${events.length===1?'':'s'}</span></div>${events.length?`<div class="mc-event-list">${events.slice().reverse().map(e=>matchEventRow(e,allEvents)).join('')}</div>`:'<div class="mc-empty">No events have been recorded.</div>'}</div></div><div id="mc-lineups" class="mc-tab-panel"><div class="card mc-panel" style="margin-top:14px"><div class="mc-panel-title"><div><div class="eyebrow">Team sheets</div><h3>Starting lineups</h3></div><span>Automatic tactical map</span></div><div class="lineup-visual-grid">${renderLineupPitch(m,'home')}${renderLineupPitch(m,'away')}</div><div class="ratings-grid"><div class="card rating-panel"><h4>${esc(teamDisplayName(m,'home'))} ratings</h4>${renderRatings(m,'home')}</div><div class="card rating-panel"><h4>${esc(teamDisplayName(m,'away'))} ratings</h4>${renderRatings(m,'away')}</div></div></div></div><div id="mc-stats" class="mc-tab-panel"><div class="card mc-panel" style="margin-top:14px"><div class="mc-panel-title"><div><div class="eyebrow">Match statistics</div><h3>${esc(teamDisplayName(m,'home'))} vs ${esc(teamDisplayName(m,'away'))}</h3></div></div>${matchStatsSummary(m,allEvents)}${renderAdvancedMetrics(m,allEvents)}${(isLive(m)||isFinished(m))?renderLiveMomentum(m,allEvents):''}</div></div><div id="mc-community" class="mc-tab-panel"><div class="card mc-panel" style="margin-top:14px">${renderMatchCommunity(m)}</div></div></div>`}

function refreshOtherEventPlayers(){

function refreshDedicatedSubstitution(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 const team=document.getElementById('subTeam'),off=document.getElementById('subOff'),on=document.getElementById('subOn');
 if(!m||!team||!off||!on)return;
 const teamId=team.value;
 const side=String(teamId)===String(m.home_team_id)?'home':String(teamId)===String(m.away_team_id)?'away':'';
 const starters=side?matchLineup(m,side).map(String):[];
 const bench=side?(matchMeta(m).substitutes?.[side]||[]).map(String):[];
 const playerOption=p=>`<option value="${esc(p.id)}">${esc(p.short_name||p.name)} • ${esc(p.position||'')}</option>`;
 off.innerHTML='<option value="">Select starter</option>'+starters.map(id=>playerById(id)).filter(Boolean).map(playerOption).join('');
 on.innerHTML='<option value="">Select substitute</option>'+bench.map(id=>playerById(id)).filter(Boolean).map(playerOption).join('');
}
async function addDedicatedSubstitution(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 const teamId=document.getElementById('subTeam')?.value||'',outId=document.getElementById('subOff')?.value||'',inId=document.getElementById('subOn')?.value||'';
 const minute=Math.max(0,Number(document.getElementById('subMinute')?.value)||Number(m.minute)||0),stoppage=Math.max(0,Number(document.getElementById('subStoppage')?.value)||0);
 if(!teamId||!outId||!inId){showToast('Select the team, player OFF and player ON');return}
 if(String(outId)===String(inId)){showToast('Players OFF and ON must be different');return}
 const side=String(teamId)===String(m.home_team_id)?'home':String(teamId)===String(m.away_team_id)?'away':'';
 if(!side){showToast('Invalid substitution team');return}
 const meta=matchMeta(m),xi=matchLineup(m,side).map(String),bench=(meta.substitutes?.[side]||[]).map(String);
 if(!xi.includes(String(outId))){showToast('The player going OFF is not in the starting XI');return}
 if(!bench.includes(String(inId))){showToast('The player coming ON is not on the named bench');return}
 const off=playerById(outId),on=playerById(inId);if(!off||!on){showToast('Could not find the selected players');return}
 try{
  const detail=`OFF_ID:${off.id}|${off.name||off.short_name||''}`;
  const event=await postEvent({match_id:m.id,minute,stoppage,type:'substitution',player_id:on.id,team_id:teamId,player:on.name||on.short_name||'',team:teamName(teamId,''),detail});
  m.events=m.events||[];m.events.push(event);
  const nextXi=xi.map(id=>String(id)===String(outId)?String(inId):String(id));
  const nextBench=bench.filter(id=>String(id)!==String(inId));nextBench.push(String(outId));
  meta.lineups=meta.lineups||{};meta.lineups[side]=nextXi;
  meta.substitutes=meta.substitutes||{};meta.substitutes[side]=nextBench;
  meta.substitutions=meta.substitutions||[];meta.substitutions.push({minute,stoppage,team_id:teamId,off:String(outId),on:String(inId)});
  await updateMatch(m.id,{metadata:meta});
  refreshDedicatedSubstitution();
  showToast(`${on.name||on.short_name} on for ${off.name||off.short_name}`);
 }catch(e){console.error(e);showToast('Could not save substitution')}
}

async function syncNotificationPrefs(p){const sub=await ensurePushSubscription(false);if(!sub)return;try{await fetch(NOTIFICATION_API+'/api/preferences',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub,...p})})}catch(e){console.warn('MEFCO preference sync unavailable',e)}}
async function ensurePushSubscription(requestPermission=true){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)||!('Notification' in window))return null;
  if(requestPermission&&Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted')return null}
  if(Notification.permission!=='granted')return null;
  try{
    const reg=await navigator.serviceWorker.register('/swnot.js',{scope:'/'});
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      const key=await fetch(NOTIFICATION_API+'/api/vapid-public-key').then(r=>{if(!r.ok)throw new Error('VAPID key unavailable');return r.text()});
      const raw=key.trim();const b64=raw.replace(/-/g,'+').replace(/_/g,'/');const pad='='.repeat((4-b64.length%4)%4);const bin=atob(b64+pad);const arr=Uint8Array.from(bin,c=>c.charCodeAt(0));
      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:arr});
    }
    mefcoNotificationSubscription=sub;
    try{await fetch(NOTIFICATION_API+'/api/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),preferences:notificationPrefs()})})}catch(e){console.warn('MEFCO subscription sync unavailable',e)}
    return sub.toJSON();
  }catch(e){console.warn('MEFCO push setup:',e);return null}
}

function featureCompetitionMatches(c){return matches.filter(m=>String(m.competition_id||'')===String(c?.id||'')||(!m.competition_id&&String(m.competition||'')===String(c?.name||''))||String(m.competition||'')===String(c?.name||''))}
function readMatchLineups(m){return {home:matchLineup(m,'home'),away:matchLineup(m,'away')}}
function numericStat(obj,keys){for(const k of keys){const v=Number(obj?.[k]);if(Number.isFinite(v))return v}return 0}
function matchParticipantIds(m){
 const ids=new Set(readMatchLineups(m).home.concat(readMatchLineups(m).away).map(String));
 for(const e of (m.events||[])){if(e.player_id)ids.add(String(e.player_id));let mm=String(e.detail||'').match(/(?:OFF_ID|OUT_ID):\s*([^|•]+)/i);if(eventType(e)==='substitution'&&mm)ids.add(String(mm[1]).trim())}
 return [...ids].filter(Boolean)
}

function automaticMatchRating(p,m){
 const meta=matchMeta(m)||{},stats=meta.match_stats||{},events=m.events||[];
 const starting=initialLineupIds(m);
 const pid=String(p.id),ev=events.filter(e=>String(e.player_id||'')===pid),wasStarter=starting.has(pid);
 if(!wasStarter&&!ev.length)return null;
 if(!isFinished(m))return null;
 const group=normalizePosition(p.position),isGK=group==='gk';
 let r=6.0;
 const n=(keys)=>numericStat(p,keys), count=t=>ev.filter(e=>eventType(e)===t).length;
 const ps=stats.players?.[pid]||stats.player_stats?.[pid]||meta.player_metrics?.[pid]||meta.match_intelligence?.players?.[pid]||{};
 const stat=(keys)=>{let v=n(keys);if(v)return v;return numericStat(ps,keys)};
 const goals=count('goal'),assists=count('assist'),yellow=count('yellow'),red=count('red');
 r+=goals*1.0+assists*.7;
 r+=stat(['shots_on_target','shotsOnTarget','on_target'])*.25;
 r+=stat(['shots','total_shots','shot_attempts'])*.05;
 r+=stat(['key_passes','keyPasses','chance_created'])*.12;
 r+=stat(['passes_completed','completed_passes','accurate_passes'])*.006;
 r+=stat(['tackles','successful_tackles'])*.12+stat(['interceptions'])*.12+stat(['clearances'])*.04+stat(['blocks','blocked_shots','shots_blocked'])*.07;
 r+=stat(['dribbles_completed','successful_dribbles','take_ons_won'])*.10;
 r+=stat(['fouls_won','foulsWon'])*.05+stat(['recoveries','ball_recoveries'])*.02;
 r-=stat(['fouls_committed','fouls','foulsCommitted'])*.06+stat(['offsides','offside'])*.08;
 r-=yellow*.2+red*.8;
 const saves=stat(['saves','save']),penSaves=stat(['penalty_saves','penaltySaves']);
 if(isGK)r+=saves*.45+penSaves*.7;
 const team=String(p.team_id||''),[hs,as]=scoreOf(m),conceded=team===String(m.home_team_id)?as:team===String(m.away_team_id)?hs:0;
 if(isGK)r-=conceded*.45;else if(group==='def')r-=conceded*.05;
 const minutes=Number(ps.minutes??p.minutes_played??p.minutes??0)||0;
 if(minutes>0&&minutes<30)r-=.25;
 else if(minutes>=75)r+=.1;
 /* Position-aware defensive contribution: keepers and defenders are not judged by attacking volume alone. */
 if(group==='def')r+=stat(['tackles','successful_tackles'])*.04+stat(['interceptions'])*.04+stat(['clearances'])*.025;
 if(group==='mid')r+=stat(['key_passes','keyPasses'])*.04+stat(['passes_completed','completed_passes'])*.002;
 if(group==='fwd')r+=stat(['shots_on_target','shotsOnTarget'])*.08+goals*.1;
 return Math.max(3,Math.min(10,Math.round(r*10)/10));
}
function automaticMOTM(m){
 const ids=matchParticipantIds(m);
 const candidates=ids.map(id=>playerById(id)).filter(Boolean).map(p=>({p,r:automaticMatchRating(p,m)})).filter(x=>x.r!=null);
 candidates.sort((a,b)=>b.r-a.r||String(a.p.name||'').localeCompare(String(b.p.name||'')));
 return candidates[0]||null;
}
function matchResultTimestamp(m){
 const d=matchDate(m),t=String(matchTime(m)||'').trim();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return null;
 const iso=t&&/^\d{1,2}:\d{2}/.test(t)?`${d}T${t.slice(0,8)}`:`${d}T23:59:59`;
 const ts=new Date(iso).getTime();return Number.isFinite(ts)?ts:null;
}
function isCountableLeagueResult(m){
 if(!isFinished(m))return false;
 const score=scoreOf(m);
 if(!score.every(Number.isFinite)||score.some(v=>v<0))return false;
 const ts=matchResultTimestamp(m);
 if(ts!==null&&ts>Date.now()+60000)return false;
 return true;
}
function uniqueCompetitionMatches(ms){
 const seen=new Set(),out=[];
 for(const m of (ms||[]).slice().sort((a,b)=>matchDate(a).localeCompare(matchDate(b))||matchTime(a).localeCompare(matchTime(b))||String(a.id).localeCompare(String(b.id)))){
  const key=String(m.id||'');
  const fixtureKey=[String(m.home_team_id||''),String(m.away_team_id||''),matchDate(m),String(matchTime(m)||'')].join('|');
  const dedupeKey=key||fixtureKey;
  if(seen.has(dedupeKey))continue;
  if(fixtureKey!=='|||'){
   const exact=`fixture:${fixtureKey}`;
   if(seen.has(exact))continue;
   seen.add(exact);
  }
  seen.add(dedupeKey);out.push(m);
 }
 return out;
}
function teamTableForMatches(ms,opts={}){
 const competitionMatches=uniqueCompetitionMatches(ms),map=new Map();
 const ensure=id=>{
  if(!id)return null;const k=String(id);
  if(!map.has(k)){const t=teamById(id);map.set(k,{id,name:t?.name||teamName(id,'Unknown team'),flag:t?teamFlag(t):'',p:0,w:0,d:0,l:0,gf:0,ga:0,gd:0,pts:0,form:[]})}
  return map.get(k)
 };
 /* Add every team appearing anywhere in the competition first. This keeps teams
    with zero completed matches (for example a side whose first fixture is upcoming)
    in the table instead of making them disappear. */
 competitionMatches.forEach(m=>{ensure(m.home_team_id);ensure(m.away_team_id)});
 competitionMatches.filter(m=>isCountableLeagueResult(m)|| (opts.includeLive&&isLive(m))).forEach(m=>{
  const h=ensure(m.home_team_id),a=ensure(m.away_team_id);if(!h||!a)return;
  const [hs,as]=scoreOf(m);h.p++;a.p++;h.gf+=hs;h.ga+=as;a.gf+=as;a.ga+=hs;
  if(hs>as){h.w++;a.l++;h.pts+=3;h.form.push('W');a.form.push('L')}
  else if(as>hs){a.w++;h.l++;a.pts+=0;h.form.push('L');a.form.push('W');a.pts+=3}
  else{h.d++;a.d++;h.pts++;a.pts++;h.form.push('D');a.form.push('D')}
 });
 return [...map.values()].map(x=>({...x,gd:x.gf-x.ga,form:x.form.slice(-5)})).sort((a,b)=>b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||a.name.localeCompare(b.name)).map((x,i)=>({...x,pos:i+1}));
}
function renderAutomaticTable(ms,compact=false){let rows=teamTableForMatches(ms);return `<div class="card mc-panel"><div class="mc-panel-title"><div><div class="eyebrow">League table</div><h3>Automatic standings</h3></div><span>${uniqueCompetitionMatches(ms).filter(isCountableLeagueResult).length} completed</span></div>${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r.pos}</b></td><td><button class="ghost" onclick="openTeam('${esc(r.id)}')">${esc(r.name)}</button></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gd>0?'+':''}${r.gd}</td><td><b>${r.pts}</b></td><td class="table-form"><div class="form-dots">${r.form.map(f=>`<span class="form-dot form-${f}">${f}</span>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="mc-empty">No completed league matches yet.</div>'}</div>`}
function competitionIsLeague(c,ms){const label=String(c?.type||'')+' '+String(c?.name||'');const teams=new Set(ms.flatMap(m=>[m.home_team_id,m.away_team_id].filter(Boolean))).size;return teams>1&&(/league|premier|division|championship/i.test(label)||/league/i.test(String(c?.format||'')))}
function automaticMatchStats(m){const e=m.events||[];let h={shots:0,target:0,corners:0,fouls:0,yellow:0,red:0},a={...h};e.forEach(x=>{let side=String(x.team_id)===String(m.home_team_id)?h:String(x.team_id)===String(m.away_team_id)?a:null;if(!side)return;let t=eventType(x);if(t==='goal'){side.shots++;side.target++}if(t==='shot'){side.shots++;if(x.on_target||x.target)side.target++}if(t==='corner')side.corners++;if(t==='foul')side.fouls++;if(t==='yellow')side.yellow++;if(t==='red')side.red++});return {h,a}}
function automaticRecords(){
 const finished=matches.filter(isFinished),out=[];
 finished.forEach(m=>{let [h,a]=scoreOf(m);if(h+a>0)out.push({label:'Highest-scoring match',value:`${teamDisplayName(m,'home')} ${h}–${a} ${teamDisplayName(m,'away')}`,sub:`${h+a} goals`,n:h+a});});

function renderFeatureDashboard(){let finished=matches.filter(isFinished),leaders=collectPlayerStats().sort((a,b)=>b.goals-a.goals||b.assists-a.assists).slice(0,5),records=automaticRecords();return `<div class="section"><div class="section-head"><div><div class="eyebrow">MEFCO dashboard</div><h2>Football at a glance</h2><p>Live information calculated from the loaded MEFCO database.</p></div></div><div class="feature-grid"><div class="card feature-card"><div class="eyebrow">Matches</div><div class="big">${matches.length}</div><span>Loaded fixtures</span></div><div class="card feature-card"><div class="eyebrow">Completed</div><div class="big">${finished.length}</div><span>Results recorded</span></div><div class="card feature-card"><div class="eyebrow">Goals</div><div class="big">${finished.reduce((n,m)=>n+scoreOf(m)[0]+scoreOf(m)[1],0)}</div><span>Across completed matches</span></div><div class="card feature-card"><div class="eyebrow">Top scorer</div><div class="big" style="font-size:20px">${leaders[0]?esc(leaders[0].short_name||leaders[0].name):'—'}</div><span>${leaders[0]?leaders[0].goals+' goals':'No goals recorded'}</span></div></div></div>`}
function enhanceHome(){const el=document.getElementById('home');if(!el||el.querySelector('.feature-expansion'))return;let d=document.createElement('div');d.className='feature-expansion';d.innerHTML=renderFeatureDashboard()+`<div class="section"><div class="section-head"><div><div class="eyebrow">Records</div><h2>Match records</h2></div><button class="ghost" onclick="navFor('stats')">View statistics →</button></div><div class="card feature-card record-list">${automaticRecords().map(r=>`<div class="record-row"><span>${esc(r.label)}</span><b>${esc(r.value)} • ${r.n}</b></div>`).join('')||'<div class="mc-empty">No completed match records yet.</div>'}</div></div>`;el.appendChild(d)}

 let h=recentTeamForm(m.home_team_id),a=recentTeamForm(m.away_team_id),hs=formScore(h),as=formScore(a);
 const teamBox=(side,form,score)=>{let t=teamById(side==='home'?m.home_team_id:m.away_team_id),name=teamDisplayName(m,side);return `<div class="mc-form-team"> <h4>${t&&teamFlag(t)?`<img src="${esc(teamFlag(t))}" alt="">`:''}${esc(name)}</h4><div class="mc-form-sequence">${form.map(x=>`<span class="mc-form-dot ${x.result.toLowerCase()}" title="${esc(x.opp)}: ${x.result}">${x.result}</span>`).join('')||'<span class="muted">No recent results</span>'}</div><div class="mc-form-note">${form.length?`${score}/${form.length*3} form points • ${form.reduce((n,x)=>n+x.gf,0)} scored • ${form.reduce((n,x)=>n+x.ga,0)} conceded`: 'No completed results available.'}</div></div>`};

function renderLiveTableForMatch(m){

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="MEFCO Watch — live football scores, national teams, competitions, news and statistics.">
<title>MEFCO Watch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#050607;
  --bg2:#080b0e;
  --panel:#0b0f12;
  --panel2:#10151a;
  --panel3:#151b21;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#f7f8f5;
  --muted:#89939b;
  --soft:#b7c0c5;
  --green:#b7ff2a;
  --green2:#76d900;
  --cyan:#63e6ff;
  --red:#ff5364;
  --amber:#ffd166;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 25px 80px rgba(0,0,0,.45);
  --shadow2:0 12px 40px rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--text);
  font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(183,255,42,.08),transparent 23rem),
    radial-gradient(circle at 96% 12%,rgba(99,230,255,.055),transparent 27rem),
    linear-gradient(180deg,#080a0c 0,#050607 55%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.025;
  background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.app{min-height:100vh}

/* HEADER */
header{
  position:sticky;
  top:0;
  z-index:30;
  min-height:76px;
  padding:11px 30px;
  display:flex;
  align-items:center;
  gap:24px;
  background:rgba(5,6,7,.78);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(150%);
  -webkit-backdrop-filter:blur(24px) saturate(150%);
}
header:before{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--cyan),transparent);
  opacity:.65;
}
.logo{
  position:relative;
  display:flex;
  align-items:center;
  gap:9px;
  flex:0 0 auto;
  padding:5px 0;
  border:0;
  background:none;
  color:#fff;
  font-family:"Barlow Condensed",sans-serif;
  font-size:31px;
  font-weight:900;
  letter-spacing:-1.2px;
  text-transform:uppercase;
}
.logo:before{
  content:"";
  width:9px;
  height:27px;
  background:var(--green);
  transform:skewX(-15deg);
  box-shadow:0 0 20px rgba(183,255,42,.45);
}
.logo span{color:var(--green)}
nav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  flex:1;
}
nav button,.ghost{
  position:relative;
  border:1px solid transparent;
  background:transparent;
  color:#7f898f;
  padding:10px 13px;
  border-radius:11px;
  font-size:11px;
  font-weight:800;
  letter-spacing:.7px;
  text-transform:uppercase;
  transition:.22s ease;
}
nav button:after{
  content:"";
  position:absolute;
  left:12px;
  right:12px;
  bottom:4px;
  height:2px;
  background:var(--green);
  transform:scaleX(0);
  transform-origin:center;
  transition:.22s;
}
nav button:hover,.ghost:hover{
  color:#fff;
  background:rgba(255,255,255,.045);
  border-color:var(--line);
}
nav button.active{
  color:#fff;
  background:rgba(183,255,42,.075);
  border-color:rgba(183,255,42,.16);
}
nav button.active:after{transform:scaleX(1)}
.head-right{
  display:flex;
  align-items:center;
  gap:8px;
}
.notif{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line2);
  background:#0b0f12;
  color:#e8eeeb;
  padding:9px 12px;
  border-radius:11px;
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.55px;
  transition:.2s;
  isolation:isolate;
}
.notif:before{
  content:"";
  position:absolute;
  left:4px;
  top:4px;
  bottom:4px;
  width:58%;
  background:linear-gradient(90deg,rgba(183,255,42,.18),rgba(183,255,42,.28),rgba(183,255,42,.1));
  clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);
  z-index:-1;
  pointer-events:none;
}
.notif:hover{
  border-color:rgba(183,255,42,.5);
  box-shadow:0 0 25px rgba(183,255,42,.1);
}

/* TICKER */
.ticker{
  height:38px;
  display:flex;
  align-items:center;
  overflow:hidden;
  background:#090c0e;
  border-bottom:1px solid var(--line);
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}
.ticker:before{
  content:"LIVE FEED";
  height:100%;
  display:flex;
  align-items:center;
  padding:0 15px;
  background:var(--green);
  color:#050607;
  font-size:10px;
  font-weight:1000;
  letter-spacing:1px;
  position:relative;
  z-index:2;
}
.ticker-track{
  white-space:nowrap;
  animation:scroll 40s linear infinite;
  padding-left:25px;
  color:#a4adb2;
  font-size:10px;
  font-weight:700;
  letter-spacing:.2px;
}
.ticker b{color:var(--green);font-weight:1000}
@keyframes scroll{
  from{transform:translateX(100%)}
  to{transform:translateX(-100%)}
}

/* PAGE */
main{
  width:min(1560px,100%);
  margin:auto;
  padding:36px 30px 90px;
}
.page{
  display:none;
  animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;
}
.page.active{display:block}
@keyframes pageIn{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

/* UNIVERSAL CARDS */
.card,.hero-main{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));
  box-shadow:var(--shadow2);
}
.card:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 28%,transparent 72%,rgba(255,255,255,.018));
  opacity:.7;
}
.card:hover{
  border-color:rgba(255,255,255,.15);
  box-shadow:0 18px 60px rgba(0,0,0,.42);
  transform:translateY(-2px);
}
.card{
  transition:border-color .22s,box-shadow .22s,transform .22s;
}
.section{margin-top:42px}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:16px;
}
.section-head h2,h2{
  font-family:"Barlow Condensed",sans-serif;
  font-size:32px;
  line-height:.95;
  letter-spacing:-.5px;
  text-transform:uppercase;
}
.section-head p,.muted{
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}
.eyebrow{
  color:var(--green);
  font-size:10px;
  font-weight:1000;
  letter-spacing:1.8px;
  text-transform:uppercase;
  margin-bottom:8px;
}
.date{
  color:#748087;
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.8px;
}
.empty{
  border:1px dashed rgba(255,255,255,.13);
  border-radius:18px;
  padding:40px;
  text-align:center;
  color:#707a80;
  background:rgba(255,255,255,.015);
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px;
}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* HERO */
.hero{
  display:grid;
  grid-template-columns:minmax(0,1.65fr) minmax(320px,.65fr);
  gap:16px;
  margin-bottom:32px;
}
.hero-main{
  min-height:390px;
  padding:42px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  background:
    radial-gradient(circle at 78% 18%,rgba(183,255,42,.19),transparent 22%),
    radial-gradient(circle at 90% 90%,rgba(99,230,255,.10),transparent 28%),
    linear-gradient(135deg,#151c20 0,#090c0f 68%);
}
.hero-main:before{
  content:"01";
  position:absolute;
  right:-10px;
  top:-45px;
  font-family:"Barlow Condensed";
  font-size:280px;
  font-weight:900;
  line-height:1;
  color:rgba(255,255,255,.025);
  font-style:italic;
}
.hero-main:after{
  content:"";
  position:absolute;
  width:380px;
  height:380px;
  right:8%;
  top:8%;
  border:1px solid rgba(183,255,42,.12);
  border-radius:50%;
  box-shadow:0 0 0 30px rgba(183,255,42,.012),0 0 0 60px rgba(183,255,42,.008);
  pointer-events:none;
}
.hero-main h1{
  position:relative;
  z-index:1;
  max-width:820px;
  font-family:"Barlow Condensed";
  font-size:clamp(54px,6vw,94px);
  line-height:.84;
  letter-spacing:-2.8px;
  text-transform:uppercase;
  font-weight:900;
}
.hero-main p{
  position:relative;
  z-index:1;
  max-width:650px;
  color:#aeb8bc;
  font-size:14px;
  line-height:1.65;
  margin-top:20px;
}
.hero-side{
  padding:26px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:linear-gradient(155deg,#11171b,#090c0f);
}
.hero-side h3{
  font-family:"Barlow Condensed";
  font-size:30px;
  line-height:.95;
  text-transform:uppercase;
  margin-bottom:18px;
}
.mini-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.mini-stat{
  padding:16px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  border-radius:14px;
}
.mini-stat strong{
  display:block;
  font-family:"Barlow Condensed";
  font-size:30px;
  line-height:1;
}
.mini-stat span{
  display:block;
  margin-top:5px;
  color:#7f8a90;
  font-size:9px;
  font-weight:900;
  letter-spacing:1px;
  text-transform:uppercase;
}

/* BUTTONS */
.actions{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
.btn{
  border:1px solid var(--line2);
  background:rgba(255,255,255,.045);
  color:#eef2ef;
  padding:11px 15px;
  border-radius:11px;
  font-size:10px;
  font-weight:900;
  letter-spacing:.65px;
  text-transform:uppercase;
  transition:.2s;
  position:relative;
  z-index:2;
}
.btn:hover{
  border-color:rgba(183,255,42,.45);
  background:rgba(183,255,42,.08);
  transform:translateY(-1px);
}
.btn.primary{
  color:#071000;
  background:var(--green);
  border-color:var(--green);
  box-shadow:0 8px 30px rgba(183,255,42,.16);
}
.btn.primary:hover{
  background:#c9ff5d;
  box-shadow:0 10px 40px rgba(183,255,42,.26);
}
.btn.danger{
  color:#fff;
  background:rgba(255,83,100,.12);
  border-color:rgba(255,83,100,.35);
}
.btn.small{
  padding:8px 10px;
  font-size:9px;
}
.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* MATCH CARDS */
.match-card{
  padding:0;
  background:linear-gradient(160deg,#11171b,#090c0e);
}
.match-card:after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:0;
  transition:.2s;
}
.match-card:hover:after,.match-card.live:after{opacity:1}
.match-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 17px 10px;
  color:#7e898f;
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.match-status.live{
  color:var(--green);
  display:flex;
  align-items:center;
  gap:6px;
}
.match-status.live:before{
  content:"";
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 10px var(--green);
  animation:pulse 1.5s infinite;
}
@keyframes pulse{
  0%,100%{opacity:1}
  50%{opacity:.35}
}
.match-body{
  padding:12px 22px 22px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:15px;
  align-items:center;
}
.team-side{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.team-side.away{
  justify-content:flex-end;
  text-align:right;
}
.team-side img{
  width:42px;
  height:42px;
  object-fit:contain;
}
.team-name{
  font-family:"Barlow Condensed";
  font-size:21px;
  line-height:.95;
  text-transform:uppercase;
  font-weight:800;
}
.score{
  font-family:"Barlow Condensed";
  font-size:38px;
  line-height:1;
  font-weight:900;
  white-space:nowrap;
}
.match-bottom{
  border-top:1px solid var(--line);
  padding:11px 17px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#6f797e;
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.65px;
}

/* FORMS */
.form-dots{
  display:flex;
  gap:4px;
}
.form-dot{
  width:19px;
  height:19px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:1000;
}
.form-W{background:rgba(183,255,42,.18);color:var(--green)}
.form-D{background:rgba(255,209,102,.15);color:var(--amber)}
.form-L{background:rgba(255,83,100,.15);color:var(--red)}

/* TABLE */
.table-wrap{
  overflow-x:auto;
  border:1px solid var(--line);
  border-radius:15px;
}
.table{
  width:100%;
  border-collapse:collapse;
  min-width:640px;
}
.table th{
  padding:11px 13px;
  text-align:left;
  color:#737e84;
  background:rgba(255,255,255,.025);
  border-bottom:1px solid var(--line);
  font-size:9px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
}
.table td{
  padding:12px 13px;
  border-bottom:1px solid rgba(255,255,255,.05);
  font-size:11px;
  color:#c5cccf;
}
.table tr:last-child td{border-bottom:0}
.table-form{
  min-width:100px;
}
.form-dots{
  display:flex;
  gap:4px;
}

/* INPUTS */
input,select,textarea{
  width:100%;
  border:1px solid var(--line2);
  background:#090d10;
  color:#f5f7f5;
  border-radius:12px;
  padding:11px 13px;
  outline:none;
  transition:.2s;
}
input:focus,select:focus,textarea:focus{
  border-color:rgba(183,255,42,.55);
  box-shadow:0 0 0 3px rgba(183,255,42,.07);
}
textarea{
  min-height:120px;
  resize:vertical;
}
label{
  display:block;
  color:#8e999e;
  font-size:10px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
  margin-bottom:7px;
}
.form-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:13px;
}
.form-grid.three{
  grid-template-columns:repeat(3,minmax(0,1fr));
}
.field{
  min-width:0;
}

/* NOTIFICATIONS */
.notify-panel{
  position:relative;
  margin-top:20px;
  padding:22px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));
}
.notify-panel-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:18px;
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
}
.notify-panel-title{
  font-family:"Barlow Condensed";
  font-size:25px;
  line-height:1;
  text-transform:uppercase;
}
.notify-panel-sub{
  margin-top:7px;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
}
.notify-follow-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
  margin-top:16px;
}
.notify-pref{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:42px;
  margin:0;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:rgba(255,255,255,.025);
  color:#b9c1c5;
  font-size:9px;
  letter-spacing:.55px;
}
.notify-pref input{
  width:15px;
  height:15px;
  flex:0 0 15px;
  accent-color:var(--green);
  box-shadow:none;
}
.notify-follow-list{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
  margin-top:14px;
}
.notify-follow-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  min-width:0;
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:12px;
  background:rgba(255,255,255,.02);
}
.notify-follow-item strong{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:10px;
}
.follow-btn.following{
  color:var(--green);
  border-color:rgba(183,255,42,.28);
  background:rgba(183,255,42,.06);
}

/* MATCH CENTRE */
.mc-panel{
  margin-top:16px;
  padding:20px;
}
.mc-panel-title{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:15px;
}
.mc-panel-title h3{
  font-family:"Barlow Condensed";
  font-size:25px;
  line-height:.95;
  text-transform:uppercase;
}
.mc-panel-title>span{
  color:#727d82;
  font-size:9px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.7px;
}
.mc-form-compare{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.mc-form-team,.mc-rating-team{
  min-width:0;
  padding:16px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.02);
}
.mc-form-team h4,.mc-rating-team h4{
  font-family:"Barlow Condensed";
  font-size:20px;
  text-transform:uppercase;
  margin-bottom:11px;
}
.mc-form-sequence{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.mc-form-dot{
  width:25px;
  height:25px;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  font-weight:1000;
}
.mc-form-dot.w{background:rgba(183,255,42,.17);color:var(--green)}
.mc-form-dot.d{background:rgba(255,209,102,.14);color:var(--amber)}
.mc-form-dot.l{background:rgba(255,83,100,.14);color:var(--red)}
.mc-form-note{
  margin-top:10px;
  color:#768187;
  font-size:10px;
  line-height:1.5;
}
.mc-prediction-note{
  color:#69747a;
  font-size:10px;
  line-height:1.55;
}
.mc-live-badge{
  color:var(--green)!important;
}
.mc-rating-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.055);
}
.mc-rating-row:last-child{border-bottom:0}
.mc-rating-player{
  min-width:0;
}
.mc-rating-player strong{
  display:block;
  font-size:11px;
}
.mc-rating-player small{
  display:block;
  margin-top:3px;
  color:#69747a;
  font-size:8px;
  text-transform:uppercase;
}
.mc-rating-value{

<main>

<section class="page" id="home-page"></section>

<section class="page" id="news-page"></section>
<section class="page" id="competitions-page"></section>
<section class="page" id="stats-page"></section>
<section class="page" id="search-page"></section>
<section class="page" id="admin-page"></section>
<section class="page" id="match-page"></section>
<section class="page" id="team-page"></section>
<section class="page" id="player-page"></section>
<section class="page" id="competition-page"></section>
<section class="page" id="community-page"></section>

</main>
</div>

<script>
"use strict";

/* ---------- CONFIG ---------- */

const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";

const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";

const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";
const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";

const COMMUNITY_POSTS_URL=SUPABASE_URL+"/rest/v1/community_posts";

/* ---------- STATE ---------- */

let matches=[];
let teams=[];
let players=[];
let competitions=[];
let news=[];
let communityPosts=[];

let selectedMatchId=null;
let selectedTeamId=null;
let selectedPlayerId=null;
let selectedCompetitionId=null;

let currentPage="home";
let refreshTimer=null;
let mefcoNotificationSubscription=null;

const MEFCO_NOTIFICATION_PREFS_KEY="mefco_notification_preferences_v2";
const MEFCO_FOLLOWS_KEY="mefco_notification_follows_v2";

/* ---------- UTILS ---------- */

function esc(v){
  return String(v??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function safeLower(v){
  return String(v??"").toLowerCase();
}

function showToast(message){
  let old=document.querySelector(".mefco-toast");
  if(old)old.remove();

  const el=document.createElement("div");
  el.className="mefco-toast";
  el.textContent=String(message||"");
  el.style.cssText=[
    "position:fixed",
    "left:50%",
    "bottom:24px",
    "transform:translateX(-50%)",
    "z-index:9999",
    "padding:12px 16px",
    "border:1px solid rgba(255,255,255,.14)",
    "border-radius:12px",
    "background:#10151a",
    "color:#fff",
    "font:700 11px DM Sans,system-ui,sans-serif",
    "box-shadow:0 15px 45px rgba(0,0,0,.45)",
    "max-width:min(92vw,520px)",
    "text-align:center"
  ].join(";");

  document.body.appendChild(el);
  setTimeout(()=>el.remove(),3200);
}

function mefcoReadJSON(key,fallback){
  try{
    const value=JSON.parse(localStorage.getItem(key)||"null");
    return value??fallback;
  }catch{
    return fallback;
  }
}

function mefcoWriteJSON(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
  }catch{}
}

function notificationPrefs(){
  return {
    match_events:true,
    team_events:true,
    player_events:true,
    mefco_news:true,
    community:true,
    ...mefcoReadJSON(MEFCO_NOTIFICATION_PREFS_KEY,{})
  };
}

function notificationFollows(){
  return mefcoReadJSON(MEFCO_FOLLOWS_KEY,{
    match:[],
    team:[],
    player:[]
  });
}

function saveNotificationFollows(value){
  mefcoWriteJSON(MEFCO_FOLLOWS_KEY,value);
}

function isFollowing(type,id){
  return (notificationFollows()[type]||[])
    .map(String)
    .includes(String(id));
}

/* ---------- SUPABASE ---------- */

async function supabaseFetch(url,options={}){
  const headers=new Headers(options.headers||{});
  headers.set("apikey",SUPABASE_KEY);
  headers.set("Authorization","Bearer "+SUPABASE_KEY);
  headers.set("Accept","application/json");

  if(options.body&&!headers.has("Content-Type")){
    headers.set("Content-Type","application/json");
  }

  const response=await fetch(url,{
    ...options,
    headers
  });

  if(!response.ok){
    const text=await response.text();
    throw new Error(text||("HTTP "+response.status));
  }

  if(response.status===204)return null;

  const text=await response.text();
  if(!text)return null;

  try{
    return JSON.parse(text);
  }catch{
    return text;
  }
}

/* ---------- DATA ---------- */

async function loadData(){
  const [m,t,p,c,n]=await Promise.allSettled([
    supabaseFetch(MATCHES_URL+"?select=*"),
    supabaseFetch(TEAMS_URL+"?select=*"),
    supabaseFetch(PLAYERS_URL+"?select=*"),
    supabaseFetch(COMPETITIONS_URL+"?select=*"),
    supabaseFetch(NEWS_URL+"?select=*")
  ]);

  matches=m.status==="fulfilled"&&Array.isArray(m.value)?m.value:[];
  teams=t.status==="fulfilled"&&Array.isArray(t.value)?t.value:[];
  players=p.status==="fulfilled"&&Array.isArray(p.value)?p.value:[];
  competitions=c.status==="fulfilled"&&Array.isArray(c.value)?c.value:[];
  news=n.status==="fulfilled"&&Array.isArray(n.value)?n.value:[];

  await loadCommunityPosts();
  await loadMatchEvents();

  renderAll();
}

async function loadMatchEvents(){
  if(!matches.length)return;

  try{
    const ids=matches.map(m=>String(m.id)).filter(Boolean);
    if(!ids.length)return;

    const query=ids.map(encodeURIComponent).join(",");
    const rows=await supabaseFetch(
      EVENTS_URL+"?select=*&match_id=in.("+query+")&order=minute.asc,created_at.asc"
    );

    if(!Array.isArray(rows))return;

    const byMatch=new Map();

    rows.forEach(event=>{
      const key=String(event.match_id);
      if(!byMatch.has(key))byMatch.set(key,[]);
      byMatch.get(key).push(event);
    });

    matches.forEach(match=>{
      match.events=byMatch.get(String(match.id))||[];
    });
  }catch(error){
    console.warn("MEFCO events load unavailable:",error);
    matches.forEach(match=>{
      if(!Array.isArray(match.events))match.events=[];
    });
  }
}

/*
  Community is optional. The main MEFCO Watch application must not break
  when the table has not been created/exposed in Supabase.
*/
let communityUnavailable=false;

async function loadCommunityPosts(){
  if(communityUnavailable){
    communityPosts=[];
    return;
  }

  try{
    const rows=await supabaseFetch(
      COMMUNITY_POSTS_URL+"?select=*&order=created_at.desc"
    );

    communityPosts=Array.isArray(rows)?rows:[];
  }catch(error){
    const message=String(error?.message||"");

    if(
      /PGRST205|Could not find the table|404/i.test(message)
    ){
      communityUnavailable=true;
      communityPosts=[];
      return;
    }

    console.warn("Community posts unavailable:",error);
    communityPosts=[];
  }
}

function startAutoRefresh(){
  if(refreshTimer)clearInterval(refreshTimer);
  refreshTimer=null;
}

/* ---------- NOTIFICATIONS ---------- */

async function ensurePushSubscription(requestPermission=true){
  if(
    !("serviceWorker" in navigator)||
    !("PushManager" in window)||
    !("Notification" in window)
  )return null;

  if(
    requestPermission &&
    Notification.permission!=="granted"
  ){
    const permission=await Notification.requestPermission();
    if(permission!=="granted")return null;
  }

  if(Notification.permission!=="granted")return null;

  try{
    const registration=await navigator.serviceWorker.register(
      "/MEFCOWatch/swnot.js",
      {scope:"/MEFCOWatch/"}
    );

    await navigator.serviceWorker.ready;

    let subscription=await registration.pushManager.getSubscription();

    if(!subscription){
      const response=await fetch(
        NOTIFICATION_API+"/api/vapid-public-key"
      );

      if(!response.ok){
        throw new Error("Could not get VAPID public key");
      }

      const data=await response.json();
      const publicKey=String(data.publicKey||"").trim();

      if(!publicKey){
        throw new Error("VAPID public key missing");
      }

      const b64=publicKey
        .replace(/-/g,"+")
        .replace(/_/g,"/");

      const pad="=".repeat(
        (4-b64.length%4)%4
      );

      const bin=atob(b64+pad);
      const arr=Uint8Array.from(
        bin,
        character=>character.charCodeAt(0)
      );

      subscription=await registration.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:arr
      });
    }

    mefcoNotificationSubscription=subscription;

    const result=await fetch(
      NOTIFICATION_API+"/api/subscribe",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          subscription:subscription.toJSON(),
          preferences:notificationPrefs()
        })
      }
    );

    if(!result.ok){
      throw new Error(
        "Worker rejected subscription: "+
        await result.text()
      );
    }

    return subscription.toJSON();

  }catch(error){
    console.error(
      "MEFCO notification setup failed:",
      error
    );
    showToast("Notification setup failed.");
    return null;
  }
}

async function enableNotifications(){
  const subscription=await ensurePushSubscription(true);

  if(subscription){
    const button=document.getElementById("notificationButton");
    if(button){
      button.textContent="Notifications enabled";
    }

    showToast("Notifications enabled");
  }
}

async function syncNotificationFollow(type,id,follow){
  const subscription=await ensurePushSubscription(true);
  if(!subscription)return;

  try{
    await fetch(
      NOTIFICATION_API+"/api/follow",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          subscription,
          follow_type:type,
          target_id:String(id),
          follow
        })
      }
    );
  }catch(error){
    console.warn(
      "MEFCO follow sync unavailable",
      error
    );
  }
}

async function syncNotificationPrefs(prefs){
  const subscription=await ensurePushSubscription(false);
  if(!subscription)return;

  try{
    await fetch(
      NOTIFICATION_API+"/api/preferences",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          subscription,
          ...prefs
        })
      }
    );
  }catch(error){
    console.warn(
      "MEFCO preference sync unavailable",
      error
    );
  }
}

async function followTarget(type,id){
  const follows=notificationFollows();

  follows[type]=Array.from(
    new Set([
      ...(follows[type]||[]).map(String),
      String(id)
    ])
  );

  saveNotificationFollows(follows);

  await syncNotificationFollow(
    type,
    id,
    true
  );

  scheduleRender();
  showToast("Followed");
}

function unfollowTarget(type,id){
  const follows=notificationFollows();

  follows[type]=(follows[type]||[])
    .map(String)
    .filter(value=>value!==String(id));

  saveNotificationFollows(follows);

  syncNotificationFollow(
    type,
    id,
    false
  );

  scheduleRender();
  showToast("Unfollowed");
}

function followButton(type,id,label=""){
  const following=isFollowing(type,id);

  return `
    <button
      class="btn small follow-btn ${following?"following":""}"
      onclick="toggleNotificationFollow('${esc(type)}','${esc(id)}')"
    >
      ${following?"✓ Following":"＋ Follow"}${label?" "+esc(label):""}
    </button>
  `;
}

function toggleNotificationFollow(type,id){
  if(!["match","team","player"].includes(type))return;

  if(isFollowing(type,id)){
    unfollowTarget(type,id);
  }else{
    followTarget(type,id);
  }
}

/*
  The Worker already knows how to deliver a push.
  The HTML only needs to tell it which event happened and who it concerns.
*/
async function notifyMatchEvent(match,event){
  try{
    if(!match||!event)return;

    const type=normalizeEventType(event);

    const player=event.player_id
      ?playerById(event.player_id)
      :null;

    const team=event.team_id
      ?teamById(event.team_id)
      :null;

    const playerName=
      event.player||
      player?.short_name||
      player?.name||
      "";

    const teamNameValue=
      event.team||
      team?.name||
      teamDisplayName(
        match,
        String(event.team_id)===String(match.away_team_id)
          ?"away"
          :"home"
      );

    const minute=event.minute!==undefined &&
      event.minute!==null &&
      String(event.minute)!==""
      ?String(event.minute)+"'"
      :"";

    let title="";
    let bodyLines=[];

    if(type==="goal"){
      title="Goal!";
      bodyLines.push(
        playerName||"Goal"
      );

      if(teamNameValue){
        bodyLines.push(
          [teamNameValue,minute]
            .filter(Boolean)
            .join(" • ")
        );
      }

      const assistId=
        event.assist_player_id||
        event.assist_id||
        extractAssistId(event.detail);

      const assistPlayer=assistId
        ?playerById(assistId)
        :null;

      const assistName=
        event.assist_player||
        assistPlayer?.short_name||
        assistPlayer?.name||
        extractAssistName(event.detail);

      if(assistName){
        bodyLines.push(
          "Assist: "+assistName
        );
      }

    }else if(type==="assist"){
      title="Assist!";
      bodyLines.push(
        playerName||"Player"
      );

      if(teamNameValue){
        bodyLines.push(
          [teamNameValue,minute]
            .filter(Boolean)
            .join(" • ")
        );
      }

      const scorerId=
        event.scorer_player_id||
        event.scorer_id||
        extractScorerId(event.detail);

      const scorer=scorerId
        ?playerById(scorerId)
        :null;

      const scorerName=
        event.scorer_player||
        scorer?.short_name||
        scorer?.name||
        extractScorerName(event.detail);

      if(scorerName){
        bodyLines.push(
          "For: "+scorerName
        );
      }

    }else if(type==="yellow"){
      title="Yellow card";
      bodyLines.push(
        playerName||"Player"
      );

      if(teamNameValue){
        bodyLines.push(
          [teamNameValue,minute]
            .filter(Boolean)
            .join(" • ")
        );
      }

    }else if(type==="red"){
      title="Red card";
      bodyLines.push(
        playerName||"Player"
      );

      if(teamNameValue){
        bodyLines.push(
          [teamNameValue,minute]
            .filter(Boolean)
            .join(" • ")
        );
      }

    }else if(type==="substitution"){
      title="Substitution";
      bodyLines.push(
        playerName||"Player"
      );

      if(teamNameValue){
        bodyLines.push(
          [teamNameValue,minute]
            .filter(Boolean)
            .join(" • ")
        );
      }

      const offId=extractOffId(event.detail);
      const offPlayer=offId
        ?playerById(offId)
        :null;

      const offName=
        extractOffName(event.detail)||
        offPlayer?.short_name||
        offPlayer?.name||
        "";

      if(offName){
        bodyLines.push(
          "Off: "+offName
        );
      }

    }else{
      return;
    }

    const subscription=await ensurePushSubscription(false);
    if(!subscription)return;

    await fetch(
      NOTIFICATION_API+"/api/notify",
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          match_id:String(match.id),
          team_id:event.team_id
            ?String(event.team_id)
            :null,
          player_id:event.player_id
            ?String(event.player_id)
            :null,
          event_type:type,
          title,
          body:bodyLines.filter(Boolean).join("\n"),
          url:"/MEFCOWatch/?match="+encodeURIComponent(match.id),
          tag:"mefco-match-"+String(match.id)+"-"+type
        })
      }
    );
  }catch(error){
    console.warn(
      "MEFCO event notification failed:",
      error
    );
  }
}

/* ---------- EVENT HELPERS ---------- */

function normalizeEventType(event){
  const value=safeLower(
    event?.type||
    event?.event_type||
    event?.kind||
    ""
  ).replace(/[\s_-]+/g,"");

  if(value==="goal"||value==="goals")return"goal";
  if(value==="assist"||value==="assists")return"assist";
  if(value==="yellow"||value==="yellowcard")return"yellow";
  if(value==="red"||value==="redcard")return"red";
  if(value==="substitution"||value==="sub")return"substitution";

  return value;
}

function extractDetailValue(detail,patterns){
  const text=String(detail||"");

  for(const pattern of patterns){
    const match=text.match(pattern);
    if(match&&match[1]){
      return String(match[1]).trim();
    }
  }

  return "";
}

function extractAssistId(detail){
  return extractDetailValue(detail,[
    /ASSIST_ID:\s*([^|•]+)/i,
    /ASSISTID:\s*([^|•]+)/i
  ]);
}

function extractAssistName(detail){
  return extractDetailValue(detail,[
    /ASSIST:\s*([^|•]+)/i
  ]);
}

function extractScorerId(detail){
  return extractDetailValue(detail,[
    /SCORER_ID:\s*([^|•]+)/i,
    /GOAL_ID:\s*([^|•]+)/i
  ]);
}

function extractScorerName(detail){
  return extractDetailValue(detail,[
    /SCORER:\s*([^|•]+)/i
  ]);
}

function extractOffId(detail){
  return extractDetailValue(detail,[
    /OFF_ID:\s*([^|•]+)/i,
    /OUT_ID:\s*([^|•]+)/i
  ]);
}

function extractOffName(detail){
  return extractDetailValue(detail,[
    /OFF_ID:\s*[^|•]+\|([^|•]+)/i,
    /OUT_ID:\s*[^|•]+\|([^|•]+)/i
  ]);
}

/* ---------- DATA HELPERS ---------- */

function teamById(id){
  return teams.find(
    team=>String(team.id)===String(id)
  )||null;
}

function playerById(id){
  return players.find(
    player=>String(player.id)===String(id)
  )||null;
}

function competitionById(id){
  return competitions.find(
    competition=>String(competition.id)===String(id)
  )||null;
}

function teamName(id,fallback="Unknown team"){
  return teamById(id)?.name||fallback;
}

function teamFlag(team){
  return team?.flag_url||
    team?.logo_url||
    team?.image_url||
    "";
}

function teamDisplayName(match,side){
  const id=side==="home"
    ?match?.home_team_id
    :match?.away_team_id;

  const team=teamById(id);

  return team?.name||
    (side==="home"
      ?match?.home_team
      :match?.away_team)||
    "Unknown";
}

function matchDate(match){
  return String(
    match?.date||
    match?.match_date||
    ""
  );
}

function matchTime(match){
  return String(
    match?.time||
    match?.match_time||
    ""
  );
}

function scoreOf(match){
  const home=Number(
    match?.home_score ??
    match?.score_home ??
    0
  );

  const away=Number(
    match?.away_score ??
    match?.score_away ??
    0
  );

  return [
    Number.isFinite(home)?home:0,
    Number.isFinite(away)?away:0
  ];
}

function matchStatus(match){
  return safeLower(
    match?.status||
    match?.state||
    ""
  );
}

function isLive(match){
  const status=matchStatus(match);
  return [
    "live",
    "in_play",
    "inplay",
    "playing"
  ].includes(status);
}

function isFinished(match){
  const status=matchStatus(match);
  return [
    "finished",
    "complete",
    "completed",
    "ft",
    "full_time"
  ].includes(status);
}

function isScheduled(match){
  return !isLive(match)&&!isFinished(match);
}

function fmtDate(value,options){
  if(!value)return"";
  const date=new Date(value+"T00:00:00");

  if(Number.isNaN(date.getTime()))return String(value);

  return new Intl.DateTimeFormat(
    "en-US",
    options||{
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  ).format(date);
}

function eventType(event){
  return normalizeEventType(event);
}

function matchMeta(match){
  const metadata=match?.metadata;

  if(!metadata)return{};

  if(typeof metadata==="string"){
    try{
      return JSON.parse(metadata)||{};
    }catch{
      return{};
    }
  }

  return metadata;
}

function matchLineup(match,side){
  const meta=matchMeta(match);

  const lineup=
    meta?.lineups?.[side]||
    meta?.lineup?.[side]||
    [];

  return Array.isArray(lineup)
    ?lineup.map(String)
    :[];
}

function normalizePosition(position){
  const value=safeLower(position);

  if(value.includes("goal"))return"gk";
  if(value==="gk")return"gk";
  if(value.includes("def"))return"def";
  if(value.includes("mid"))return"mid";
  if(value.includes("att")||value.includes("for"))return"att";

  return"";
}

function initialLineupIds(match){
  const ids=new Set(
    matchLineup(match,"home")
      .concat(matchLineup(match,"away"))
      .map(String)
  );

  for(const event of match.events||[]){
    if(eventType(event)==="substitution"){
      const offId=extractOffId(event.detail);
      if(offId)ids.add(String(offId));
    }
  }

  return ids;
}

function matchParticipantIds(match){
  const ids=new Set(
    matchLineup(match,"home")
      .concat(matchLineup(match,"away"))
      .map(String)
  );

  for(const event of match.events||[]){
    if(event.player_id){
      ids.add(String(event.player_id));
    }

    const offId=extractOffId(event.detail);

    if(
      eventType(event)==="substitution" &&
      offId
    ){
      ids.add(String(offId));
    }
  }

  return [...ids].filter(Boolean);
}

function numericStat(object,keys){
  for(const key of keys){
    const value=Number(object?.[key]);
    if(Number.isFinite(value))return value;
  }

  return 0;
}

function automaticMatchRating(player,match){
  const meta=matchMeta(match);
  const stats=meta.match_stats||{};
  const events=match.events||[];
  const starting=initialLineupIds(match);
  const pid=String(player.id);

  const ev=events.filter(
    event=>String(event.player_id||"")===pid
  );

  const wasStarter=starting.has(pid);

  if(!wasStarter&&!ev.length)return null;
  if(!isFinished(match))return null;

  const group=normalizePosition(player.position);
  const isGK=group==="gk";

  let rating=6.0;

  const number=(keys)=>numericStat(player,keys);

  const count=type=>
    ev.filter(
      event=>eventType(event)===type
    ).length;

  const playerStats=
    stats.players?.[pid]||
    stats.player_stats?.[pid]||
    meta.player_metrics?.[pid]||
    meta.match_intelligence?.players?.[pid]||
    {};

  const stat=keys=>{
    const direct=number(keys);
    if(direct)return direct;
    return numericStat(playerStats,keys);
  };

  const goals=count("goal");
  const assists=count("assist");
  const yellow=count("yellow");
  const red=count("red");

  rating+=goals*1.0;
  rating+=assists*.7;

  rating+=stat([
    "shots_on_target",
    "shotsOnTarget",
    "on_target"
  ])*.25;

  rating+=stat([
    "shots",
    "total_shots",
    "shot_attempts"
  ])*.05;

  rating+=stat([
    "key_passes",
    "keyPasses",
    "chance_created"
  ])*.12;

  rating+=stat([
    "passes_completed",
    "completed_passes",
    "accurate_passes"
  ])*.006;

  rating+=stat([
    "tackles",
    "successful_tackles"
  ])*.12;

  rating+=stat(["interceptions"])*.12;
  rating+=stat(["clearances"])*.04;

  rating+=stat([
    "blocks",
    "blocked_shots",
    "shots_blocked"
  ])*.07;

  rating+=stat([
    "dribbles_completed",
    "successful_dribbles",
    "take_ons_won"
  ])*.10;

  rating+=stat([
    "fouls_won",
    "foulsWon"
  ])*.05;

  rating+=stat([
    "recoveries",
    "ball_recoveries"
  ])*.02;

  rating-=stat([
    "fouls_committed",
    "foulsCommitted"
  ])*.04;

  rating-=yellow*.25;
  rating-=red*1.8;

  if(isGK){
    rating+=stat([
      "saves",
      "save_count"
    ])*.20;

    rating+=stat([
      "clean_sheets",
      "cleanSheet"
    ])*.7;
  }

  return Math.max(
    1,
    Math.min(
      10,
      Number(rating.toFixed(1))
    )
  );
}

function automaticMOTM(match){
  const participants=matchParticipantIds(match);

  const rated=participants
    .map(id=>playerById(id))
    .filter(Boolean)
    .map(player=>({
      player,
      rating:automaticMatchRating(player,match)
    }))
    .filter(item=>item.rating!=null)
    .sort((a,b)=>b.rating-a.rating);

  if(!rated.length)return null;

  return {
    p:rated[0].player,
    r:rated[0].rating
  };
}

/* ---------- STATS ---------- */

function renderStats(){
  const page=document.getElementById("stats-page");

  const goals=new Map();
  const assists=new Map();

  matches.forEach(match=>{
    (match.events||[]).forEach(event=>{
      const type=eventType(event);

      if(type==="goal"&&event.player_id){
        const id=String(event.player_id);
        goals.set(
          id,
          (goals.get(id)||0)+1
        );
      }

      if(type==="assist"&&event.player_id){
        const id=String(event.player_id);
        assists.set(
          id,
          (assists.get(id)||0)+1
        );
      }
    });
  });

  const goalRows=[...goals.entries()]
    .map(([id,value])=>({
      player:playerById(id),
      value
    }))
    .filter(x=>x.player)
    .sort((a,b)=>b.value-a.value)
    .slice(0,10);

  const assistRows=[...assists.entries()]
    .map(([id,value])=>({
      player:playerById(id),
      value
    }))
    .filter(x=>x.player)
    .sort((a,b)=>b.value-a.value)
    .slice(0,10);

  const statTable=(title,rows)=>{
    return `
      <div class="card" style="padding:20px">
        <div class="eyebrow">${esc(title)}</div>

        ${
          rows.length
            ? rows.map((row,index)=>`
              <button
                class="notify-follow-item"
                style="width:100%;margin-bottom:7px;text-align:left"
                onclick="openPlayer('${esc(row.player.id)}')"
              >
                <strong>
                  ${index+1}. ${esc(row.player.short_name||row.player.name)}
                </strong>
                <span style="
                  color:var(--green);
                  font-family:'Barlow Condensed';
                  font-size:18px;
                  font-weight:900
                ">
                  ${row.value}
                </span>
              </button>
            `).join("")
            : `<div class="empty">No recorded data.</div>`
        }
      </div>
    `;
  };

  page.innerHTML=`
    <div class="section-head">
      <div>
        <div class="eyebrow">Numbers</div>
        <h2>Stats</h2>
        <p>Recorded goals and assists from MEFCO match events.</p>
      </div>
    </div>

    <div class="grid two">
      ${statTable("Goals",goalRows)}
      ${statTable("Assists",assistRows)}
    </div>
  `;
}

function runSearch(query){
  const q=String(query||"").trim().toLowerCase();
  const results=document.getElementById("searchResults");

  if(!results)return;

  if(!q){
    results.innerHTML=`<div class="empty">Start typing to search.</div>`;
    return;
  }

  const output=[];

  players
    .filter(player=>
      safeLower(player.name).includes(q)||
      safeLower(player.short_name).includes(q)
    )
    .slice(0,10)
    .forEach(player=>{
      output.push(`
        <button
          class="search-result"
          onclick="openPlayer('${esc(player.id)}')"
          style="text-align:left"
        >
          <div class="eyebrow">Player</div>
          <strong>${esc(player.short_name||player.name)}</strong>
        </button>
      `);
    });

  teams
    .filter(team=>
      safeLower(team.name).includes(q)
    )
    .slice(0,10)
    .forEach(team=>{
      output.push(`
        <button
          class="search-result"
          onclick="openTeam('${esc(team.id)}')"
          style="text-align:left"
        >
          <div class="eyebrow">Team</div>
          <strong>${esc(team.name)}</strong>
        </button>
      `);
    });

  competitions
    .filter(competition=>
      safeLower(competition.name).includes(q)
    )
    .slice(0,10)
    .forEach(competition=>{
      output.push(`
        <button
          class="search-result"
          onclick="openCompetition('${esc(competition.id)}')"
          style="text-align:left"
        >
          <div class="eyebrow">Competition</div>
          <strong>${esc(competition.name)}</strong>
        </button>
      `);
    });

  results.innerHTML=output.length
    ?output.join("")
    :`<div class="empty">No results found.</div>`;
}

  page.innerHTML=`

async function submitCommunityPost(){
  if(communityUnavailable){
    showToast("Community posts are unavailable.");
    return;
  }

  const body=document.getElementById("communityBody")?.value?.trim();

  if(!body){
    showToast("Write something first.");
    return;
  }

  try{
    await supabaseFetch(
      COMMUNITY_POSTS_URL,
      {
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "Prefer":"return=representation"
        },
        body:JSON.stringify({
          author_name:"MEFCO Fan",
          body,
          status:"published"
        })
      }
    );

    showToast("Post published.");

    const input=document.getElementById("communityBody");
    if(input)input.value="";

    await loadCommunityPosts();
    renderCommunity();

  }catch(error){
    const message=String(error?.message||"");

    if(
      /PGRST205|Could not find the table|404/i.test(message)
    ){
      communityUnavailable=true;
      showToast("Community posts are not available in Supabase.");
      renderCommunity();
      return;
    }

    console.error(error);
    showToast("Could not publish post.");
  }
}

      parts.push(
        renderFormPreview(match)
      );
    }

    overview.innerHTML=parts

    const ratings=renderFinishedRatings(match);

    page.insertAdjacentHTML(
      "beforeend",
      `<div class="section">${ratings}</div>`
    );
  }
}

async function submitAdminEvent(matchId,type){
  const match=matches.find(
    item=>String(item.id)===String(matchId)
  );

  if(!match)return;

  const minute=Number(
    document.getElementById("eventMinute")?.value||0
  );

  const playerId=
    document.getElementById("eventPlayer")?.value||"";

  const player=playerById(playerId);

  if(!playerId||!player){
    showToast("Select a player.");
    return;
  }

  const teamId=String(player.team_id);
  const team=teamById(teamId);

  const event={
    match_id:match.id,
    minute:Number.isFinite(minute)?minute:0,
    stoppage:0,
    type,
    player_id:player.id,
    team_id:teamId,
    player:player.name||player.short_name||"",
    team:team?.name||"",
    detail:""
  };

  if(type==="goal"){
    const assistId=
      document.getElementById("eventAssist")?.value||"";

    if(assistId){
      const assist=playerById(assistId);

      if(assist){
        event.assist_player_id=assist.id;
        event.assist_player=assist.name||assist.short_name||"";
        event.detail=
          `ASSIST_ID:${assist.id}|${assist.name||assist.short_name||""}`;
      }
    }

    const [homeScore,awayScore]=scoreOf(match);

    if(String(match.home_team_id)===teamId){
      match.home_score=homeScore+1;
    }else if(String(match.away_team_id)===teamId){
      match.away_score=awayScore+1;
    }
  }

  if(type==="substitution"){
    const offId=
      document.getElementById("eventOff")?.value||"";

    if(offId){
      const off=playerById(offId);

      if(off){
        event.detail=
          `OFF_ID:${off.id}|${off.name||off.short_name||""}`;
      }
    }
  }

  try{
    const saved=await postEvent(event);

    match.events=match.events||[];
    match.events.push(saved||event);

    if(type==="goal"){
      await updateMatch(
        match.id,
        {
          home_score:match.home_score,
          away_score:match.away_score
        }
      );
    }

    await notifyMatchEvent(
      match,
      saved||event
    );

    showToast(
      type==="goal"
        ?"Goal recorded"
        :type==="assist"
          ?"Assist recorded"
          :"Event recorded"
    );

    renderMatch();

  }catch(error){
    console.error(error);
    showToast("Could not save event.");
  }
}

async function postEvent(event){
  const rows=await supabaseFetch(
    EVENTS_URL,
    {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },
      body:JSON.stringify(event)
    }
  );

  return Array.isArray(rows)
    ?rows[0]
    :rows;
}

async function updateMatch(id,patch){
  return supabaseFetch(
    MATCHES_URL+"?id=eq."+encodeURIComponent(id),
    {
      method:"PATCH",
      headers:{
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },
      body:JSON.stringify(patch)
    }
  );
}

async function saveScoreOnly(id){
  const match=matches.find(
    item=>String(item.id)===String(id)
  );

  if(!match)return;

  const home=Number(
    document.getElementById("adminHomeScore")?.value
  );

  const away=Number(
    document.getElementById("adminAwayScore")?.value
  );

  if(
    !Number.isFinite(home)||
    !Number.isFinite(away)||
    home<0||
    away<0
  ){
    showToast("Enter valid scores.");
    return;
  }

  try{
    await updateMatch(
      id,
      {
        home_score:Math.floor(home),
        away_score:Math.floor(away)
      }
    );

    match.home_score=Math.floor(home);
    match.away_score=Math.floor(away);

    showToast("Score saved.");
    renderMatch();

  }catch(error){
    console.error(error);
    showToast("Could not save score.");
  }
}

function recentTeamForm(teamId,limit=5){
  return matches
    .filter(match=>
      isFinished(match)&&
      (
        String(match.home_team_id)===String(teamId)||
        String(match.away_team_id)===String(teamId)
      )
    )
    .slice()
    .sort(
      (a,b)=>
        matchDate(b).localeCompare(matchDate(a))||
        matchTime(b).localeCompare(matchTime(a))
    )
    .slice(0,limit)
    .reverse()
    .map(match=>{
      const home=
        String(match.home_team_id)===String(teamId);

      const [homeScore,awayScore]=scoreOf(match);

      const gf=home?homeScore:awayScore;
      const ga=home?awayScore:homeScore;

      return{
        result:
          gf>ga
            ?"W"
            :gf<ga
              ?"L"
              :"D",
        gf,
        ga,
        opp:
          home
            ?teamDisplayName(match,"away")
            :teamDisplayName(match,"home")
      };
    });
}

function formScore(form){
  return form.reduce(
    (total,item)=>
      total+
      (
        item.result==="W"
          ?3
          :item.result==="D"
            ?1
            :0
      ),
    0
  );
}

function uniqueCompetitionMatches(matchList){
  const seen=new Set();
  const output=[];

  for(
    const match of (matchList||[])
      .slice()
      .sort(
        (a,b)=>
          matchDate(a).localeCompare(matchDate(b))||
          matchTime(a).localeCompare(matchTime(b))||
          String(a.id).localeCompare(String(b.id))
      )
  ){
    const key=String(match.id||"");

    if(seen.has(key))continue;

    seen.add(key);
    output.push(match);
  }

  return output;
}

function teamTableForMatches(matchList){
  const competitionMatches=
    uniqueCompetitionMatches(matchList);

  const map=new Map();

  const ensure=id=>{
    if(!id)return null;

    const key=String(id);

    if(!map.has(key)){
      const team=teamById(id);

      map.set(
        key,
        {
          id,
          name:team?.name||teamName(id,"Unknown team"),
          flag:team?teamFlag(team):"",
          p:0,
          w:0,
          d:0,
          l:0,
          gf:0,
          ga:0,
          gd:0,
          pts:0,
          form:[]
        }
      );
    }

    return map.get(key);
  };

  competitionMatches.forEach(match=>{
    ensure(match.home_team_id);
    ensure(match.away_team_id);
  });

  competitionMatches
    .filter(isFinished)
    .forEach(match=>{
      const home=ensure(match.home_team_id);
      const away=ensure(match.away_team_id);

      if(!home||!away)return;

      const [homeScore,awayScore]=scoreOf(match);

      home.p++;
      away.p++;

      home.gf+=homeScore;
      home.ga+=awayScore;

      away.gf+=awayScore;
      away.ga+=homeScore;

      if(homeScore>awayScore){
        home.w++;
        away.l++;
        home.pts+=3;
        home.form.push("W");
        away.form.push("L");
      }else if(awayScore>homeScore){
        away.w++;
        home.l++;
        away.pts+=3;
        away.form.push("W");
        home.form.push("L");
      }else{
        home.d++;
        away.d++;
        home.pts++;
        away.pts++;
        home.form.push("D");
        away.form.push("D");
      }
    });

  return [...map.values()]
    .map(row=>({
      ...row,
      gd:row.gf-row.ga,
      form:row.form.slice(-5)
    }))
    .sort(
      (a,b)=>
        b.pts-a.pts||
        b.gd-a.gd||
        b.gf-a.gf||
        a.name.localeCompare(b.name)
    )
    .map((row,index)=>({
      ...row,
      pos:index+1
    }));
}

function renderFinishedRatings(match){
  const participants=matchParticipantIds(match);
  const teamsOut={
    home:[],
    away:[]
  };

  for(const side of ["home","away"]){
    const teamId=
      side==="home"
        ?match.home_team_id
        :match.away_team_id;

    teamsOut[side]=participants
      .map(id=>playerById(id))
      .filter(player=>
        player&&
        String(player.team_id)===String(teamId)
      )
      .map(player=>({
        p:player,
        r:automaticMatchRating(player,match)
      }))
      .filter(item=>item.r!=null)
      .sort((a,b)=>b.r-a.r);
  }

  const motm=automaticMOTM(match);

  const list=side=>{
    return teamsOut[side]
      .map(item=>`
        <div class="mc-rating-row">
          <div class="mc-rating-player">
            <strong>
              ${esc(item.p.short_name||item.p.name)}
            </strong>
            <small>
              ${esc(item.p.position||"")}
            </small>
          </div>

          <div class="mc-rating-value ${
            item.r>=8
              ?"high"
              :item.r<6
                ?"low"
                :""
          }">
            ${item.r.toFixed(1)}
          </div>
        </div>
      `)
      .join("")
      ||
      `<div class="mc-empty">No complete lineup data.</div>`;
  };

  return `
    <div class="card mc-panel mc-ratings-panel">
      <div class="mc-panel-title">
        <div>
          <div class="eyebrow">Full-time performance</div>
          <h3>Match ratings</h3>
        </div>

        <span>Post-match only</span>
      </div>

      ${
        motm
          ? `
            <div class="motm">
              <div>
                <div class="eyebrow">Man of the Match</div>
                <strong>
                  ${esc(motm.p.short_name||motm.p.name)}
                </strong>
              </div>

              <span>${motm.r.toFixed(1)}/10</span>
            </div>
          `
          :""
      }

      <div class="mc-form-compare" style="margin-top:14px">
        <div class="mc-rating-team">
          <h4>${esc(teamDisplayName(match,"home"))}</h4>
          ${list("home")}
        </div>

        <div class="mc-rating-team">
          <h4>${esc(teamDisplayName(match,"away"))}</h4>
          ${list("away")}
        </div>
      </div>

      <p class="mc-form-note">
        Ratings use recorded match events and available player statistics.
        They are MEFCO calculations, not official Opta ratings.
      </p>
    </div>
  `;
}

    !teamPage.querySelector(".team-follow-control")
  ){
    const box=document.createElement("div");
    box.className="team-follow-control";
    box.style.cssText="margin-top:12px";
    box.innerHTML=followButton("team",team.id);

    const header=teamPage.querySelector(".profile-hero");

    if(header)header.appendChild(box);
  }

  const player=playerById(playerId);
  const playerPage=document.getElementById("player-page");

  if(
    player&&
    playerPage&&
    !playerPage.querySelector(".player-follow-control")
  ){
    const box=document.createElement("div");
    box.className="player-follow-control";
    box.style.cssText="margin-top:12px";
    box.innerHTML=followButton("player",player.id);

    const header=playerPage.querySelector(".profile-hero");

    if(header)header.appendChild(box);
  }
}

function addFeatureExpansions(){
  if(
    selectedTeamId &&
    currentPage==="team"
  ){
    const team=teamById(selectedTeamId);
    const page=document.getElementById("team-page");

    if(team&&page&&!page.querySelector(".team-feature-expansion")){
      const rows=matches
        .filter(match=>
          isFinished(match)&&
          (
            String(match.home_team_id)===String(team.id)||
            String(match.away_team_id)===String(team.id)
          )
        )
        .slice()
        .sort(
          (a,b)=>
            matchDate(b).localeCompare(matchDate(a))
        )
        .slice(0,5);

      const section=document.createElement("div");
      section.className="section team-feature-expansion";

      section.innerHTML=`
        <div class="section-head">
          <div>
            <div class="eyebrow">Performance</div>
            <h2>Recent form</h2>
          </div>
        </div>

        <div class="feature-grid">
          ${
            rows.map(match=>{
              const home=
                String(match.home_team_id)===String(team.id);

              const [homeScore,awayScore]=scoreOf(match);

              const gf=home?homeScore:awayScore;
              const ga=home?awayScore:homeScore;

              const result=
                gf>ga
                  ?"W"
                  :gf<ga
                    ?"L"
                    :"D";

              return `
                <button
                  class="card feature-card"
                  onclick="openMatch('${esc(match.id)}')"
                >
                  <strong>${result} • ${gf}–${ga}</strong>
                  <span>
                    ${esc(
                      home
                        ?teamDisplayName(match,"away")
                        :teamDisplayName(match,"home")
                    )}
                  </span>
                  <small>
                    ${esc(fmtDate(matchDate(match),{month:"short",day:"numeric"}))}
                  </small>
                </button>
              `;
            }).join("")
            ||
            `<div class="empty">No completed results yet.</div>`
          }
        </div>
      `;

      page.appendChild(section);
    }

    injectFollowControls(team.id,null);
  }

  if(
    selectedPlayerId &&
    currentPage==="player"
  ){
    const player=playerById(selectedPlayerId);
    const page=document.getElementById("player-page");

    if(player&&page&&!page.querySelector(".player-feature-expansion")){
      const ratings=matches
        .filter(isFinished)
        .map(match=>({
          match,
          rating:automaticMatchRatingSafe(player,match)
        }))
        .filter(item=>item.rating!=null)
        .slice(-10);

      const average=ratings.length
        ?(
          ratings.reduce(
            (total,item)=>total+item.rating,
            0
          )/ratings.length
        ).toFixed(1)
        :"—";

      const section=document.createElement("div");
      section.className="section player-feature-expansion";

      section.innerHTML=`
        <div class="section-head">
          <div>
            <div class="eyebrow">Performance</div>
            <h2>Match ratings</h2>
          </div>

          <span class="muted">
            Average: ${average}
          </span>
        </div>

        <div class="stat-history">
          ${
            ratings.map(item=>`
              <div
                class="stat-history-bar"
                style="height:${Math.max(
                  15,
                  ((item.rating-4)/6)*100
                )}%"
              >
                <span>${item.rating}</span>
              </div>
            `).join("")
            ||
            `<div class="mc-empty">No rated appearances yet.</div>`
          }
        </div>
      `;

      page.appendChild(section);
    }

    injectFollowControls(null,player.id);
  }
}

const originalRenderAll=renderAll;

renderAll=function(){
  originalRenderAll();
  addFeatureExpansions();
};

/* Prevent accidental undefined category access in older community render paths. */
window.newsCategory=newsCategory;
</script>

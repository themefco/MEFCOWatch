<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MEFCO Watch">
<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="MEFCO Watch — live football scores, national teams, competitions, news and statistics.">
<meta name="robots" content="index,follow">
<meta property="og:title" content="MEFCO Watch">
<meta property="og:description" content="Live MEFCO football scores, national teams, competitions, news and statistics.">
<meta name="twitter:card" content="summary">
<title>MEFCO Watch</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#070a0f;color:#f8fafc;min-height:100vh
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
img{max-width:100%}
.app{min-height:100vh;background:radial-gradient(circle at 80% -10%,rgba(38,255,154,.08),transparent 35%),#070a0f}
.hide{display:none!important}

/* HEADER */
header{
position:sticky;top:0;z-index:30;display:flex;align-items:center;
justify-content:space-between;gap:18px;padding:14px 24px;
border-bottom:1px solid #202936;background:rgba(7,10,15,.88);
backdrop-filter:blur(18px)
}
.logo{
background:none;border:0;color:#fff;font-size:22px;font-weight:900;
letter-spacing:-1px;white-space:nowrap
}
.logo span{color:#38f59b}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button,.ghost{
border:1px solid transparent;background:transparent;color:#aab5c5;
padding:9px 12px;border-radius:10px;font-weight:700
}
nav button:hover,nav button.active{
background:#141c26;color:#fff;border-color:#283442
}
nav button.active{color:#38f59b}
.head-right{display:flex;align-items:center;gap:8px}
.notif{
border:1px solid #2b3847;background:#10161f;color:#dbe5ef;
padding:8px 11px;border-radius:10px;font-size:12px;font-weight:800
}

/* TICKER */
.ticker{
height:34px;overflow:hidden;border-bottom:1px solid #1c2631;
background:#0b1017;display:flex;align-items:center
}
.ticker-track{
white-space:nowrap;font-size:12px;color:#aeb9c8;
animation:scroll 35s linear infinite
}
.ticker-track:hover{animation-play-state:paused}
.ticker b{color:#38f59b}
@keyframes scroll{
from{transform:translateX(100%)}
to{transform:translateX(-100%)}
}

/* GENERAL */
main{max-width:1440px;margin:auto;padding:28px 24px 60px}
.page{display:none}
.page.active{display:block}
.card{
border:1px solid #202936;
background:linear-gradient(145deg,#10161f,#0c1118);
border-radius:18px;
box-shadow:0 15px 50px rgba(0,0,0,.16)
}
.section{margin-top:28px}
.section-head{
display:flex;align-items:end;justify-content:space-between;
gap:12px;margin-bottom:13px
}
.section-head h2{font-size:22px;letter-spacing:-.5px}
.section-head p{color:#7f8b9d;font-size:13px;margin-top:4px}
.eyebrow{
font-size:11px;text-transform:uppercase;letter-spacing:1.5px;
color:#38f59b;font-weight:900;margin-bottom:10px
}
.muted{color:#7f8b9d;font-size:11px}

/* HERO */
.hero{
display:grid;grid-template-columns:1.5fr .8fr;gap:18px;margin-bottom:22px
}
.hero-main{
padding:30px;min-height:290px;display:flex;flex-direction:column;
justify-content:flex-end;
background:
radial-gradient(circle at 85% 15%,rgba(56,245,155,.15),transparent 30%),
linear-gradient(145deg,#111923,#0a0f15)
}
.hero h1{
font-size:clamp(36px,6vw,72px);line-height:.95;
letter-spacing:-3px;max-width:850px
}
.hero p{margin-top:14px;color:#aab5c5;max-width:720px;line-height:1.6}
.hero-side{padding:20px}
.hero-side h3{font-size:20px}
.mini-grid{
display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px
}
.mini-stat{
padding:15px;border:1px solid #202936;
background:#0b1118;border-radius:13px
}
.mini-stat strong{display:block;font-size:24px}
.mini-stat span{font-size:11px;color:#8491a2}
.system-state{
display:flex;align-items:center;gap:8px;color:#aeb9c8;
font-size:12px;margin-top:14px
}

/* GRIDS */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.grid.four{grid-template-columns:repeat(4,1fr)}

/* BUTTONS */
.actions{display:flex;gap:7px;flex-wrap:wrap}
.btn{
border:1px solid #2a3745;background:#121a23;color:#eaf0f6;
padding:9px 12px;border-radius:10px;font-weight:800;
transition:.15s
}
.btn:hover{border-color:#425467;background:#16202b}
.btn.primary{background:#38f59b;color:#06100b;border-color:#38f59b}
.btn.primary:hover{background:#52f7a8}
.btn.danger{border-color:#5a3037;color:#ff9ba6}
.btn.small{padding:7px 9px;font-size:12px}
.btn.icon{padding:8px 10px}

/* MATCHES */
.match-card{padding:17px;position:relative;overflow:hidden}
.match-card.live{
border-color:rgba(56,245,155,.45);
box-shadow:0 0 0 1px rgba(56,245,155,.08),0 15px 35px rgba(0,0,0,.2)
}
.match-top,.match-bottom,.row{
display:flex;align-items:center;justify-content:space-between;gap:10px
}
.competition-label{color:#7f8b9d;font-size:11px}
.live-dot{color:#38f59b;font-weight:900;font-size:11px}
.teams{
margin:18px 0;display:grid;grid-template-columns:1fr auto 1fr;
align-items:center;gap:8px
}
.team{text-align:center;font-weight:850}
.team img,.team-crest{
width:42px;height:42px;object-fit:contain;
display:block;margin:0 auto 8px
}
.team-name{line-height:1.25}
.score{font-size:24px;font-weight:950}
.status{font-size:11px;color:#8996a7;margin-top:3px}
.star{
border:0;background:none;color:#697789;font-size:18px;padding:0
}
.star.active{color:#ffd75e}

/* TOOLBAR */
.toolbar{
display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px
}
.filter.active{
background:#38f59b;color:#06100b;border-color:#38f59b
}
.date-nav{display:flex;gap:7px;margin-left:auto}

/* INPUTS */
.input,.select,.textarea{
width:100%;background:#0b1118;border:1px solid #263340;
color:#f8fafc;border-radius:10px;padding:11px 12px;outline:none
}
.input:focus,.select:focus,.textarea:focus{border-color:#38f59b}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.form-grid.three{grid-template-columns:repeat(3,1fr)}
label{
display:grid;gap:7px;font-size:12px;font-weight:800;color:#aeb9c8
}

/* TABLES */
.table-wrap{overflow:auto;border:1px solid #202936;border-radius:14px}
.table{width:100%;border-collapse:collapse;min-width:650px}
.table th,.table td{
text-align:left;padding:12px 14px;border-bottom:1px solid #1d2732;
font-size:13px
}
.table th{
color:#7f8b9d;font-size:10px;text-transform:uppercase;
letter-spacing:1px
}
.table tr:last-child td{border-bottom:0}
.table tr:hover td{background:#0d141c}
.table .rank{color:#667586;font-weight:900;width:35px}
.table-player{
display:flex;align-items:center;gap:10px
}
.table-player img{
width:30px;height:30px;border-radius:50%;object-fit:cover;background:#121a23
}

/* PILLS */
.pill{
display:inline-flex;align-items:center;
border:1px solid #293746;background:#101821;
padding:4px 8px;border-radius:999px;
font-size:10px;font-weight:850
}
.pill.live{color:#38f59b;border-color:#265d47}
.pill.done{color:#aeb9c8}
.pill.upcoming{color:#63a9ff}
.pill.paused{color:#ffd75e}

/* EMPTY */
.empty,.loading{
padding:32px;text-align:center;color:#8290a2;
border:1px dashed #2a3745;border-radius:14px
}
.skeleton{
height:100px;border-radius:14px;
background:linear-gradient(90deg,#0d131a,#151d26,#0d131a);
background-size:200% 100%;animation:sh 1.2s infinite
}
@keyframes sh{to{background-position:-200% 0}}

/* NEWS */
.news-card{overflow:hidden}
.news-image{
height:150px;background:#0a1017;display:grid;place-items:center;
overflow:hidden
}
.news-image img{width:100%;height:100%;object-fit:cover}
.news-image-placeholder{font-size:34px;color:#38f59b}
.news-card .news-body{padding:17px}
.news-card .date{
color:#38f59b;font-size:10px;font-weight:900;text-transform:uppercase
}
.news-card h3{margin:8px 0;font-size:17px}
.news-card p{color:#8e9bad;font-size:12px;line-height:1.6}

/* ARTICLE */
.article{max-width:900px;margin:auto}
.article h1{
font-size:clamp(34px,6vw,62px);line-height:1;
letter-spacing:-2px;margin:12px 0
}
.article-meta{color:#8390a0;font-size:12px;margin-bottom:22px}
.article-body{
font-size:17px;line-height:1.8;color:#c8d1dc;
white-space:pre-wrap
}
.article-category{
display:inline-block;color:#38f59b;font-size:10px;
font-weight:900;text-transform:uppercase;
border:1px solid #285640;padding:5px 8px;border-radius:999px
}

/* COMPETITIONS */
.competition-card{padding:20px}
.competition-banner{
height:105px;margin:-20px -20px 18px;
border-radius:17px 17px 0 0;overflow:hidden;
background:linear-gradient(135deg,#111b20,#0b1118);
display:grid;place-items:center
}
.competition-banner img{
width:100%;height:100%;object-fit:cover
}
.competition-icon{
width:48px;height:48px;border-radius:14px;
background:#15231e;display:grid;place-items:center;
color:#38f59b;font-size:22px;margin-bottom:15px
}
.competition-card h3{font-size:18px}
.competition-card p{
color:#8996a7;font-size:12px;margin:6px 0 15px
}
.comp-meta{
display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px
}

/* PROFILES */
.team-header,.player-header{
padding:24px;display:flex;align-items:center;gap:20px
}
.team-header img{
width:86px;height:86px;object-fit:contain;
border-radius:18px;background:#0b1118
}
.player-photo{
width:100px;height:100px;object-fit:cover;
border-radius:18px;background:#0b1118;
border:1px solid #293542
}
.player-avatar{
width:100px;height:100px;display:grid;place-items:center;
font-size:30px;font-weight:950;color:#38f59b;
border-radius:18px;background:#0b1118;border:1px solid #293542
}
.profile-meta h1{font-size:34px;letter-spacing:-1px}
.profile-meta p{color:#8794a6;margin-top:5px}
.profile-tags{
display:flex;gap:7px;flex-wrap:wrap;margin-top:10px
}
.kpis{
display:grid;grid-template-columns:repeat(4,1fr);
gap:10px;margin-top:18px
}
.kpi{
padding:15px;background:#0b1118;
border:1px solid #202b37;border-radius:12px
}
.kpi strong{font-size:24px}
.kpi span{
display:block;color:#7f8b9d;font-size:10px;
text-transform:uppercase;margin-top:4px
}

/* MATCH CENTRE */
.match-hero{padding:30px;text-align:center}
.match-hero .teams{max-width:720px;margin:28px auto}
.big-score{font-size:48px;font-weight:950;letter-spacing:-2px}
.match-status{
display:inline-flex;align-items:center;gap:7px;
margin-top:6px
}
.timeline{
border-left:2px solid #263340;margin:18px 0 0 18px;
padding-left:20px;display:grid;gap:13px
}
.event{
position:relative;padding:10px 12px;
border:1px solid #202936;background:#0d141c;border-radius:10px
}
.event:before{
content:"";position:absolute;width:9px;height:9px;border-radius:50%;
background:#38f59b;left:-26px;top:15px
}
.event.goal:before{width:11px;height:11px;left:-27px;top:14px}
.event.card-yellow:before{background:#ffd75e;border-radius:2px}
.event.card-red:before{background:#ff5964;border-radius:2px}
.event .minute{font-size:11px;color:#38f59b;font-weight:900}
.event strong{font-size:13px}
.event .event-detail{color:#7f8b9d;font-size:11px;margin-top:3px}
.stat-bars{display:grid;gap:13px}
.stat-row{display:grid;grid-template-columns:45px 1fr 45px;gap:10px;align-items:center;font-size:12px}
.stat-row>div:nth-child(2){
height:7px;background:#18212b;border-radius:10px;overflow:hidden
}
.stat-bar{
height:100%;background:#38f59b;border-radius:10px
}

/* SEARCH */
.searchbox{position:relative;max-width:700px}
.search-results{display:grid;gap:8px;margin-top:10px}
.search-result{
width:100%;text-align:left;padding:13px;
border:1px solid #202936;background:#0d141c;
border-radius:11px;color:#fff
}
.search-result:hover{border-color:#38f59b}
.search-result strong{display:block}
.search-result span{color:#7f8b9d;font-size:11px}

/* ADMIN */
.admin-layout{
display:grid;grid-template-columns:300px 1fr;gap:16px
}
.admin-list{padding:14px}
.admin-list h3{margin-bottom:12px}
.admin-list .btn{
width:100%;text-align:left;margin-bottom:7px
}
.admin-list .btn.selected{
border-color:#38f59b;background:#13251d
}
.admin-panel{padding:20px}
.log{max-height:220px;overflow:auto;display:grid;gap:6px}
.log-item{
font-size:11px;color:#8996a7;padding:8px;
border-bottom:1px solid #1c2631
}
.admin-section{
padding-top:20px;margin-top:20px;border-top:1px solid #202936
}
.admin-warning{
padding:12px 14px;border:1px solid #5a3037;
background:#171015;color:#ff9ba6;
border-radius:11px;font-size:12px
}

/* FOOTER / TOAST */
.footer{
border-top:1px solid #202936;padding:25px 24px;
color:#687587;text-align:center;font-size:11px
}
.toast{
position:fixed;right:18px;bottom:18px;z-index:60;
background:#101820;border:1px solid #30404e;
padding:12px 15px;border-radius:12px;
box-shadow:0 15px 40px rgba(0,0,0,.35);
transform:translateY(130px);opacity:0;transition:.25s;
max-width:min(420px,calc(100vw - 36px))
}
.toast.show{transform:none;opacity:1}
.db-dot{
width:8px;height:8px;border-radius:50%;
background:#ff5964;display:inline-block
}
.db-dot.ok{background:#38f59b;box-shadow:0 0 8px rgba(56,245,155,.5)}
.public-note{
padding:12px 14px;border:1px solid #202936;
background:#0b1118;border-radius:12px;
color:#8996a7;font-size:12px
}

/* MOBILE */
@media(max-width:1050px){
.hero,.admin-layout{grid-template-columns:1fr}
.grid{grid-template-columns:repeat(2,1fr)}
.grid.four{grid-template-columns:repeat(2,1fr)}
.head-right{display:none}
}
@media(max-width:700px){
header{padding:12px 14px;align-items:flex-start}
nav{overflow:auto;flex-wrap:nowrap;max-width:calc(100vw - 75px)}
nav button{white-space:nowrap}
.logo{font-size:18px}
main{padding:18px 14px 45px}
.hero-main{padding:22px;min-height:250px}
.hero h1{font-size:42px}
.grid,.grid.two,.grid.four,
.form-grid,.form-grid.three,.kpis{grid-template-columns:1fr}
.date-nav{width:100%;margin-left:0}
.date-nav .btn{flex:1}
.team-header,.player-header{align-items:flex-start}
.profile-meta h1{font-size:27px}
.match-hero{padding:20px}
.big-score{font-size:38px}
.teams{gap:4px}
.team img,.team-crest{width:34px;height:34px}
.player-photo,.player-avatar{width:76px;height:76px}
.article h1{font-size:38px}
}
</style>
</head>

<body>
<div class="app">

<header>
<button class="logo" onclick="showPage('home',this)">MEFCO <span>WATCH</span></button>

<nav id="nav">
<button class="active" data-page="home" onclick="showPage('home',this)">Home</button>
<button data-page="scores" onclick="showPage('scores',this)">Scores</button>
<button data-page="news" onclick="showPage('news',this)">News</button>
<button data-page="competitions" onclick="showPage('competitions',this)">Competitions</button>
<button data-page="stats" onclick="showPage('stats',this)">Stats</button>
<button data-page="search" onclick="showPage('search',this)">Search</button>
<button id="adminNav" data-page="admin" onclick="showPage('admin',this)" class="hide">Admin</button>
</nav>

<div class="head-right">
<button id="notificationButton" class="notif" onclick="enableNotifications()">Enable Notifications</button>
</div>
</header>

<div class="ticker">
<div id="tickerTrack" class="ticker-track">MEFCO Watch • Loading live football data…</div>
</div>

<main>

<section id="home" class="page active"></section>

<section id="scores" class="page"></section>

<section id="news" class="page"></section>

<section id="article-page" class="page"></section>

<section id="competitions" class="page"></section>

<section id="competition-page" class="page"></section>

<section id="stats" class="page"></section>

<section id="search" class="page"></section>

<section id="team-page" class="page"></section>

<section id="player-page" class="page"></section>

<section id="match-page" class="page"></section>

<section id="admin" class="page"></section>

</main>

<footer class="footer">
MEFCO WATCH • Football, live.
<span style="display:block;margin-top:6px">Public viewer mode • Live data from MEFCO</span>
</footer>

<div id="toast" class="toast"></div>

</div>

<script>
const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";

const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";

const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";

const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";
const PUBLIC_MODE=!ADMIN_MODE;

let matches=[];
let news=[];
let teams=[];
let players=[];
let competitions=[];

let selectedMatchId=null;
let selectedArticleId=null;
let selectedCompetition=null;

let scoreFilter="all";
let scoreDate=todayISO();

let adminLog=[];
let timer=null;
let dbOnline=false;
let loading=false;
let searchResults=[];

/* =========================
   HELPERS
========================= */

function esc(v){
return String(v??"").replace(/[&<>'"]/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[c]));
}

function todayISO(){
const d=new Date();
return [
d.getFullYear(),
String(d.getMonth()+1).padStart(2,"0"),
String(d.getDate()).padStart(2,"0")
].join("-");
}

function dateObj(s){
return new Date((s||todayISO())+"T00:00:00");
}

function fmtDate(s,opts={weekday:"short",month:"short",day:"numeric"}){
return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s));
}

function fmtTime(t){
return t?String(t).slice(0,5):"—";
}

function matchDate(m){
return m?.match_date||todayISO();
}

function matchTime(m){
return m?.match_time||"00:00";
}

function scoreOf(m){
return [
Number(m?.score_home??0),
Number(m?.score_away??0)
];
}

function statusOf(m){
return String(m?.status||"scheduled").toLowerCase();
}

function isLive(m){
return statusOf(m)==="live";
}

function isFinished(m){
return ["finished","ft","full_time"].includes(statusOf(m));
}

function isPaused(m){
return ["paused","pause"].includes(statusOf(m));
}

function teamById(id){
return teams.find(t=>String(t.id)===String(id));
}

function playerById(id){
return players.find(p=>String(p.id)===String(id));
}

function teamName(id,fallback="Unknown"){
return teamById(id)?.name||fallback;
}

function teamImage(t){
return t?.logo_url||t?.flag_url||"";
}

function teamDisplayName(m,side){
const id=side==="home"?m.home_team_id:m.away_team_id;
const fallback=side==="home"?m.home:m.away;
return teamName(id,fallback);
}

function eventType(e){
return String(e?.type||"event").toLowerCase();
}

function eventPlayer(e){
const p=playerById(e?.player_id);
return p?.short_name||p?.name||e?.player||"";
}

function eventTeam(e){
return teamById(e?.team_id)?.name||e?.team||"";
}

function eventStoppage(e){
return Number(e?.added??e?.stoppage??0);
}

function eventLabel(e){
const type=eventType(e);

const labels={
goal:"Goal",
assist:"Assist",
yellow:"Yellow Card",
"yellow-card":"Yellow Card",
red:"Red Card",
"red-card":"Red Card",
substitution:"Substitution",
var:"VAR",
penalty:"Penalty",
other:"Match Event"
};

return labels[type]||(
type.charAt(0).toUpperCase()+type.slice(1)
);
}

function showToast(msg){
const t=document.getElementById("toast");
t.textContent=msg;
t.classList.add("show");
clearTimeout(showToast.timer);
showToast.timer=setTimeout(()=>{
t.classList.remove("show");
},2800);
}

function statusPill(m){
if(isLive(m))return '<span class="pill live">LIVE</span>';
if(isFinished(m))return '<span class="pill done">FT</span>';
if(isPaused(m))return '<span class="pill paused">PAUSED</span>';
return '<span class="pill upcoming">UPCOMING</span>';
}

function safeText(v,fallback="—"){
return v===null||v===undefined||v===""?fallback:esc(v);
}

/* =========================
   SUPABASE
========================= */

async function supabaseFetch(url,options={}){
const response=await fetch(url,{
...options,
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
Prefer:"return=representation",
...(options.headers||{})
}
});

if(!response.ok){
const text=await response.text();
throw new Error(text||("HTTP "+response.status));
}

if(response.status===204)return null;

const text=await response.text();
return text?JSON.parse(text):null;
}

async function safeLoad(url,params={}){
return supabaseFetch(
url+"?"+new URLSearchParams(params)
);
}

/* =========================
   DATA LOADING
========================= */

async function loadData(){
if(loading)return;

loading=true;

try{

const jobs=await Promise.allSettled([

safeLoad(MATCHES_URL,{
select:"*",
order:"match_date.asc,match_time.asc"
}),

safeLoad(NEWS_URL,{
select:"*",
order:"created_at.desc"
}),

safeLoad(TEAMS_URL,{
select:"*",
order:"name.asc"
}),

safeLoad(PLAYERS_URL,{
select:"*",
order:"name.asc"
}),

safeLoad(COMPETITIONS_URL,{
select:"*",
order:"name.asc"
})

]);

if(jobs[0].status==="fulfilled")
matches=Array.isArray(jobs[0].value)?jobs[0].value:[];

if(jobs[1].status==="fulfilled")
news=Array.isArray(jobs[1].value)?jobs[1].value:[];

if(jobs[2].status==="fulfilled")
teams=Array.isArray(jobs[2].value)?jobs[2].value:[];

if(jobs[3].status==="fulfilled")
players=Array.isArray(jobs[3].value)?jobs[3].value:[];

if(jobs[4].status==="fulfilled")
competitions=Array.isArray(jobs[4].value)?jobs[4].value:[];

dbOnline=
jobs[0].status==="fulfilled"&&
jobs[2].status==="fulfilled"&&
jobs[3].status==="fulfilled"&&
jobs[4].status==="fulfilled";

await loadAllEvents();

renderAll();

}catch(error){

console.error("MEFCO data load failed:",error);

dbOnline=false;

renderAll();

showToast("MEFCO database connection failed");

}finally{

loading=false;

}

}

async function loadAllEvents(){

if(!matches.length)return;

try{

const data=await safeLoad(EVENTS_URL,{
select:"*",
order:"minute.asc,created_at.asc"
});

for(const m of matches){

m.events=(data||[]).filter(
e=>String(e.match_id)===String(m.id)
);

}

}catch(error){

console.warn("Events unavailable:",error);

for(const m of matches)
m.events=Array.isArray(m.events)?m.events:[];

}

}

function collectPlayerStats(){

const map=new Map();

for(const p of players){

map.set(String(p.id),{
id:p.id,
name:p.name,
short_name:p.short_name,
team:teamName(p.team_id,p.nationality||""),
goals:Number(p.goals||0),
assists:Number(p.assists||0),
appearances:Number(p.appearances||0),
yellow:Number(p.yellow_cards||0),
red:Number(p.red_cards||0),
photo:p.photo_url||""
});

}

for(const m of matches){

for(const e of m.events||[]){

const p=playerById(e.player_id);

if(!p)continue;

const item=map.get(String(p.id));

if(!item)continue;

const type=eventType(e);

if(type==="goal"||type==="penalty"){
item.goals++;
}

if(
e.assist||
type==="assist"
){
item.assists++;
}

if(type.includes("yellow"))
item.yellow++;

if(type.includes("red"))
item.red++;

}

}

return [...map.values()];

}

function formatMoney(value){

const n=Number(value||0);

if(!n)return "—";

if(n>=1000000)
return "€"+(n/1000000).toFixed(n>=10000000?0:1)+"M";

if(n>=1000)
return "€"+(n/1000).toFixed(0)+"K";

return "€"+n.toLocaleString();

}

/* =========================
   MATCH CENTRE
========================= */

function matchStats(m){

if(!m?.stats)return null;

if(typeof m.stats==="object")
return m.stats;

try{
return JSON.parse(m.stats);
}catch{
return null;
}

}

function statValue(stats,...keys){

if(!stats)return null;

for(const key of keys){

if(stats[key]!==undefined&&stats[key]!==null)
return Number(stats[key]);

}

return null;

}

function renderMatchStats(m){

const stats=matchStats(m);

if(!stats)return "";

const home=statValue(stats,"home_possession","possession_home","homePossession");
const away=statValue(stats,"away_possession","possession_away","awayPossession");

const homeShots=statValue(stats,"home_shots","shots_home","homeShots");
const awayShots=statValue(stats,"away_shots","shots_away","awayShots");

const homeShotsTarget=statValue(stats,"home_shots_on_target","shots_on_target_home");
const awayShotsTarget=statValue(stats,"away_shots_on_target","shots_on_target_away");

const rows=[];

if(home!==null&&away!==null)
rows.push(["Possession",home,away,"%"]);

if(homeShots!==null&&awayShots!==null)
rows.push(["Shots",homeShots,awayShots,""]);

if(homeShotsTarget!==null&&awayShotsTarget!==null)
rows.push(["Shots on target",homeShotsTarget,awayShotsTarget,""]);

if(!rows.length)return "";

return `

<div class="section">

<div class="section-head">
<div>
<h2>Match statistics</h2>
<p>Data supplied by the match record.</p>
</div>
</div>

<div class="card" style="padding:20px">

<div class="stat-bars">

${rows.map(r=>{

const max=Math.max(r[1],r[2],1);

return `

<div class="stat-row">

<strong>${r[1]}${r[3]}</strong>

<div>
<div class="stat-bar"
style="width:${Math.max(3,(r[1]/max)*100)}%">
</div>
</div>

<strong style="text-align:right">
${r[2]}${r[3]}
</strong>

</div>

<div style="text-align:center;color:#7f8b9d;font-size:11px;margin-top:-7px">
${esc(r[0])}
</div>

`;

}).join("")}

</div>

</div>

</div>

`;

}

•

/* =========================
   ADMIN UPDATES
========================= */

async function updateMatch(id,changes){

const m=matches.find(
x=>String(x.id)===String(id)
);

if(!m)return false;

try{

await supabaseFetch(
MATCHES_URL+"?id=eq."+encodeURIComponent(id),
{
method:"PATCH",
body:JSON.stringify(changes)
}
);

Object.assign(m,changes);

addLog("Updated match "+id);

renderAll();

if(ADMIN_MODE)
renderAdminPanel();

showToast("Match saved");

return true;

}catch(error){

console.error(error);

showToast("Could not save match");

return false;

}

}

async function saveAdminMatch(){

const m=matches.find(
x=>String(x.id)===String(selectedMatchId)
);

if(!m)return;

const home=Number(
document.getElementById("admHome")?.value||0
);

const away=Number(
document.getElementById("admAway")?.value||0
);

const minute=Math.max(
0,
Number(document.getElementById("admMinute")?.value||0)
);

await updateMatch(m.id,{
score_home:home,
score_away:away,
minute
});

}

async function startSelected(){

const ok=await updateMatch(
selectedMatchId,
{status:"live"}
);

if(ok)startTimer();

}

async function pauseSelected(){

stopTimer();

await updateMatch(
selectedMatchId,
{status:"paused"}
);

}

async function finishSelected(){

stopTimer();

await updateMatch(
selectedMatchId,
{
status:"finished",
minute:Math.max(
Number(matches.find(x=>String(x.id)===String(selectedMatchId))?.minute||0),
90
)
}
);

}

/* =========================
   MATCH TIMER
========================= */

function startTimer(){

stopTimer();

timer=setInterval(async()=>{

const m=matches.find(
x=>String(x.id)===String(selectedMatchId)
);

if(!m||!isLive(m))return;

const minute=Math.min(
130,
Number(m.minute||0)+1
);

m.minute=minute;

renderTicker();

if(ADMIN_MODE)
renderAdminPanel();

try{

await supabaseFetch(
MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),
{
method:"PATCH",
body:JSON.stringify({minute})
}
);

}catch(error){

console.warn("Timer update failed:",error);

}

},60000);

}

function stopTimer(){

if(timer){
clearInterval(timer);
timer=null;
}

}

/* =========================
   EVENTS
========================= */

async function addEvent(){

const m=matches.find(
x=>String(x.id)===String(selectedMatchId)
);

if(!m)return;

const teamId=
document.getElementById("eventTeamSelect")?.value||null;

const playerId=
document.getElementById("eventPlayerSelect")?.value||null;

const player=playerById(playerId);

const type=
document.getElementById("eventType")?.value||"other";

const minute=
Number(document.getElementById("eventMinute")?.value||
m.minute||
0);

const added=
Number(document.getElementById("eventAdded")?.value||0);

const description=
document.getElementById("eventDescription")?.value?.trim()||"";

const assist=
document.getElementById("eventAssist")?.value?.trim()||null;

if(
teamId&&
![
String(m.home_team_id),
String(m.away_team_id)
].includes(String(teamId))
){

showToast("Event team must belong to this match");

return;

}

const event={
match_id:m.id,
minute,
added,
type,
player:player?.name||"",
player_id:playerId||null,
team:teamName(teamId,""),
team_id:teamId||null,
description,
assist
};

try{

let result;

try{

result=await supabaseFetch(
EVENTS_URL,
{
method:"POST",
body:JSON.stringify(event)
}
);

}catch(firstError){

/*
Legacy fallback for installations where
player_id/team_id are unavailable.
*/

const legacy={...event};

delete legacy.player_id;
delete legacy.team_id;

result=await supabaseFetch(
EVENTS_URL,
{
method:"POST",
body:JSON.stringify(legacy)
}
);

}

const saved=Array.isArray(result)
?result[0]
:result;

m.events=m.events||[];
m.events.push(saved||event);

/*
A goal changes the match score.
*/

if(type==="goal"&&teamId){

const isHome=
String(teamId)===String(m.home_team_id);

const changes=isHome
?{
score_home:Number(m.score_home||0)+1
}
:{
score_away:Number(m.score_away||0)+1
};

Object.assign(m,changes);

try{

await supabaseFetch(
MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),
{
method:"PATCH",
body:JSON.stringify(changes)
}
);

}catch(error){

console.warn("Goal score update failed:",error);

}

}

addLog(
`${eventLabel(event)} added to ${m.id}`
);

renderAll();

if(ADMIN_MODE)
renderAdminPanel();

showToast("Event added");

}catch(error){

console.error("Event creation failed:",error);

showToast(
"Could not add event. Check the event table permissions."
);

}

}

function quickEvent(type){

const select=document.getElementById("eventType");

if(select)
select.value=type;

addEvent();

}

/* =========================
   CREATE MATCH
========================= */

const el=document.getElementById("adminPanel");

el.innerHTML=`

<div class="eyebrow">New match</div>

<h2>Create fixture</h2>

<div class="form-grid" style="margin-top:15px">

<label>
Competition

<select
id="createCompetition"

</select>

<label>
Date

function fillCreateFlags(){

const home=teamById(
document.getElementById("createHomeTeam")?.value
);

const away=teamById(
document.getElementById("createAwayTeam")?.value
);

if(home){

document.getElementById("createHomeFlag").value=
home.flag_url||home.logo_url||"";

}

if(away){

document.getElementById("createAwayFlag").value=
away.flag_url||away.logo_url||"";

}

}

async function createMatch(){

const competitionSelect=
document.getElementById("createCompetition");

const home=teamById(
document.getElementById("createHomeTeam")?.value
);

const away=teamById(
document.getElementById("createAwayTeam")?.value
);

if(!home||!away){

showToast("Select both teams");

return;

}

if(String(home.id)===String(away.id)){

showToast("Home and away teams must be different");

return;

}

const option=
competitionSelect?.options[
competitionSelect.selectedIndex
];

const competitionName=
option?.dataset?.name||
option?.textContent?.trim()||
"";

const competitionId=
competitionSelect?.value||null;

const match={

id:crypto.randomUUID(),

competition:competitionName,

competition_id:competitionId,

home:home.name,

away:away.name,

home_team_id:home.id,

away_team_id:away.id,

match_date:
document.getElementById("createDate")?.value||
todayISO(),

match_time:
document.getElementById("createKickoff")?.value||
"20:00",

home_flag:
document.getElementById("createHomeFlag")?.value?.trim()||
home.flag_url||
home.logo_url||
"",

away_flag:
document.getElementById("createAwayFlag")?.value?.trim()||
away.flag_url||
away.logo_url||
"",

status:"scheduled",

minute:0,

score_home:0,

score_away:0,

stoppage:0,

favorite:false,

events:[],

stats:{}

};

try{

let result;

try{

result=await supabaseFetch(
MATCHES_URL,
{
method:"POST",
body:JSON.stringify(match)
}
);

}catch(firstError){

/*
Fallback for databases where some relational
fields are not writable yet.
*/

const fallback={...match};

delete fallback.competition_id;
delete fallback.home_team_id;
delete fallback.away_team_id;

result=await supabaseFetch(
MATCHES_URL,
{
method:"POST",
body:JSON.stringify(fallback)
}
);

}

const created=
Array.isArray(result)?result[0]:result;

matches.push(created||match);

addLog("Created match");

showToast("Match created");

renderAll();

}catch(error){

console.error("Create match failed:",error);

showToast("Could not create match");

}

}

/* =========================
   FAVORITES
========================= */

async function toggleFavorite(id){

const m=matches.find(
x=>String(x.id)===String(id)
);

if(!m)return;

const newValue=!Boolean(m.favorite);

try{

await supabaseFetch(
MATCHES_URL+"?id=eq."+encodeURIComponent(id),
{
method:"PATCH",
body:JSON.stringify({
favorite:newValue
})
}
);

m.favorite=newValue;

renderAll();

}catch(error){

console.error(error);

showToast("Could not update favorite");

}

}

/* =========================
   REFRESH
========================= */

async function refreshData(){

if(loading)return;

showToast("Refreshing MEFCO data…");

await loadData();

showToast(
dbOnline
?"MEFCO data refreshed"
:"MEFCO data could not be fully refreshed"
);

}

/* =========================
   NOTIFICATIONS
========================= */

async function enableNotifications(){

if(!("Notification" in window)){

showToast("Notifications are not supported here");

return;

}

try{

const permission=
await Notification.requestPermission();

const button=
document.getElementById("notificationButton");

if(button){

button.textContent=
permission==="granted"
?"Notifications Enabled"
:permission==="denied"
?"Notifications Blocked"
:"Enable Notifications";

}

showToast(
permission==="granted"
?"Notifications enabled"
:"Notification permission not granted"
);

}catch(error){

console.error(error);

showToast("Could not enable notifications");

}

}

async function sendNotification(
title,
body,
url="/"
){

try{

const response=
await fetch(
NOTIFICATION_API+"/api/notify",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
title,
body,
url
})
}
);

if(!response.ok)
throw new Error(await response.text());

showToast("Notification sent");

}catch(error){

console.error(error);

showToast("Notification service unavailable");

}

}

/* =========================
   ADMIN LOG
========================= */

function addLog(msg){

adminLog.unshift({
time:new Date().toLocaleTimeString(),
msg
});

if(adminLog.length>50)
adminLog.pop();

}

/* =========================
   KEYBOARD
========================= */

window.addEventListener("keydown",e=>{

if(
e.key==="/"&&
!["INPUT","TEXTAREA","SELECT"]
.includes(document.activeElement?.tagName)
){

e.preventDefault();

navFor("search");

setTimeout(()=>{
document.getElementById("globalSearch")?.focus();
},50);

}

if(
e.key.toLowerCase()==="r"&&
e.ctrlKey
){

e.preventDefault();

refreshData();

}

});

/* =========================
   IMAGE FALLBACK
========================= */

document.addEventListener(
"error",
e=>{

if(e.target?.tagName==="IMG"){

e.target.style.display="none";

}

},
true
);

/* =========================
   VISIBILITY
========================= */

window.addEventListener(
"focus",
()=>{

if(document.visibilityState==="visible")
renderTicker();

}
);

/* =========================
   PWA
========================= */

if("serviceWorker" in navigator){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("./sw.js")
.catch(error=>
console.error(
"MEFCO Watch service worker:",
error
)
);

}
);

}

/* =========================
   STARTUP
========================= */

document
.getElementById("adminNav")
?.classList
.toggle("hide",!ADMIN_MODE);

loadData();

/*
Refresh live data every 30 seconds.
The service worker does not intercept Supabase
requests, so database data remains live.
*/

setInterval(()=>{

if(
document.visibilityState==="visible"&&
!loading
){

loadData();

}

},30000);

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MEFCO Watch</title>
<style>
:root{
 --bg:#081014;--panel:#0e181d;--panel2:#111e24;--line:#223038;--text:#edf5f7;
 --muted:#8ea0a8;--accent:#6ee7b7;--accent2:#60a5fa;--danger:#fb7185;--warn:#fbbf24;
 --shadow:0 18px 50px rgba(0,0,0,.24);--radius:16px
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0;background:radial-gradient(circle at 10% -10%,#123039 0,transparent 34%),var(--bg);
 color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
img{max-width:100%}

.app{min-height:100vh}
.topbar{
 position:sticky;top:0;z-index:50;background:rgba(8,16,20,.9);
 backdrop-filter:blur(16px);border-bottom:1px solid var(--line)
}
.topbar-inner{
 max-width:1450px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px
}
.brand{font-weight:900;font-size:20px;letter-spacing:-.04em;white-space:nowrap}
.brand span{color:var(--accent)}
.nav{display:flex;gap:5px;flex:1;overflow:auto}
.nav button,.ghost{
 border:0;background:transparent;color:var(--muted);padding:9px 12px;border-radius:10px
}
.nav button:hover,.nav button.active,.ghost:hover{
 background:#17242a;color:var(--text)
}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{
 border:1px solid var(--line);background:#152229;color:var(--text);
 border-radius:10px;padding:9px 13px
}
.btn:hover{border-color:#3b515b;background:#1a2b33}
.btn.primary{background:var(--accent);color:#062018;border-color:var(--accent);font-weight:800}
.btn.danger{background:#321820;border-color:#63303c;color:#fecdd3}
.btn.small{padding:6px 9px;font-size:12px}

.main{max-width:1450px;margin:auto;padding:24px 20px 60px}
.page{display:none}
.page.active{display:block}

.card{
 background:linear-gradient(180deg,rgba(18,31,37,.96),rgba(12,22,27,.96));
 border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}

.hero{display:grid;grid-template-columns:1.5fr .8fr;gap:16px}
.hero-main{
 padding:34px;border:1px solid var(--line);border-radius:var(--radius);
 background:linear-gradient(135deg,#12272d,#0c171c)
}
.hero h1{font-size:clamp(32px,5vw,62px);line-height:.98;letter-spacing:-.06em;margin:8px 0 16px}
.hero p{max-width:700px;color:var(--muted);font-size:16px}
.hero-side{padding:24px}
.eyebrow{
 font-size:11px;text-transform:uppercase;letter-spacing:.14em;
 color:var(--accent);font-weight:800
}
.section{margin-top:28px}
.section-head{
 display:flex;justify-content:space-between;gap:15px;align-items:flex-end;margin-bottom:14px
}
.section-head h2,.section-head h3{margin:0}
.section-head p{margin:4px 0 0;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

.match-card{padding:15px}
.match-card.live{border-color:#285c4d}
.match-top,.match-bottom{
 display:flex;justify-content:space-between;align-items:center;gap:8px
}
.competition-label,.status,.muted,.date{color:var(--muted);font-size:12px}
.live-dot{color:var(--accent);font-weight:800}
.teams{
 display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
 gap:10px;padding:24px 4px;text-align:center
}
.team{
 display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700
}
.team img{width:34px;height:34px;object-fit:contain}
.score{font-size:25px;font-weight:900;white-space:nowrap}
.match-bottom{border-top:1px solid var(--line);padding-top:12px}

.mini-grid,.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini-stat,.kpi{
 padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b151a
}
.mini-stat strong,.kpi strong{display:block;font-size:20px}
.mini-stat span,.kpi span{color:var(--muted);font-size:11px}

.empty,.mc-empty{
 padding:26px;border:1px dashed #30424b;border-radius:14px;
 color:var(--muted);text-align:center
}
.toolbar{
 display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0
}
.filter.active{border-color:var(--accent);color:var(--accent)}
.date-nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.date-control{display:flex;gap:6px}

.input,.select,textarea{
 width:100%;background:#0a1419;border:1px solid var(--line);
 border-radius:10px;color:var(--text);padding:10px;outline:none
}
.input:focus,.select:focus,textarea:focus{border-color:#4d6974}

.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
label{
 display:flex;flex-direction:column;gap:6px;color:var(--muted);
 font-size:12px;font-weight:700
}

.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}
.table th{color:var(--muted);font-size:11px;text-transform:uppercase}

.news-card{overflow:hidden}
.news-image{height:180px;background:#091216}
.news-image img{width:100%;height:100%;object-fit:cover}
.news-body{padding:18px}
.news-body h3{margin:6px 0}
.news-body p{color:var(--muted)}

.article{max-width:900px;margin:auto}
.article h1{font-size:42px;line-height:1.05}
.article-body{white-space:pre-wrap;color:#c6d2d7;font-size:16px}

.searchbox{max-width:700px}
.search-results{display:grid;gap:7px;margin-top:14px;max-width:850px}
.search-result{
 display:flex;justify-content:space-between;text-align:left;padding:13px;
 background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text)
}
.search-result span{color:var(--muted)}

.team-header,.player-header{
 padding:22px;display:flex;gap:18px;align-items:center
}
.team-header>img{width:90px;height:90px;object-fit:contain}
.player-avatar{
 width:100px;height:100px;border-radius:50%;background:#17262d;
 display:grid;place-items:center;font-size:28px;overflow:hidden
}
.player-avatar img{width:100%;height:100%;object-fit:cover}
.profile-meta h1{margin:3px 0}
.profile-meta p{color:var(--muted)}

.match-centre-shell{max-width:1150px;margin:auto}
.match-centre-bar{
 display:flex;justify-content:space-between;margin-bottom:10px
}
.mc-hero{padding:24px}
.mc-topline,.mc-meta{
 display:flex;justify-content:space-between;gap:10px;color:var(--muted)
}
.mc-scoreboard{
 display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
 text-align:center;padding:34px 0
}
.mc-team img{width:70px;height:70px;object-fit:contain}
.mc-team-name{font-size:20px;font-weight:900;margin-top:8px}
.mc-team-side{color:var(--muted);font-size:11px}
.mc-big-score{font-size:52px;font-weight:950;letter-spacing:-.06em}
.mc-status{display:inline-block;color:var(--muted);font-weight:800}
.mc-status.live{color:var(--accent)}
.mc-status.done{color:#cbd5e1}

.mc-tabs{
 display:flex;gap:5px;border-bottom:1px solid var(--line);margin-top:15px
}
.mc-tab{
 border:0;background:transparent;color:var(--muted);padding:12px 15px
}
.mc-tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
.mc-tab-panel{display:none}
.mc-tab-panel.active{display:block}

.mc-columns{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}
.mc-panel{padding:18px;margin-top:14px}
.mc-panel-title{
 display:flex;justify-content:space-between;align-items:flex-end
}
.mc-panel-title span{color:var(--muted);font-size:12px}
.mc-event-list{display:grid}
.mc-event{
 display:grid;grid-template-columns:42px 32px 1fr auto;
 gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)
}
.mc-event-minute{color:var(--muted);font-size:12px}
.mc-event-icon{font-weight:900}
.mc-event-copy span{display:block;color:var(--muted);font-size:12px}
.mc-event-team{color:var(--muted);font-size:12px}

.mc-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mc-fact{padding:12px;border:1px solid var(--line);border-radius:10px}
.mc-fact strong{display:block;font-size:20px}
.mc-fact span{font-size:11px;color:var(--muted)}

.mc-lineups{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lineup-side{border:1px solid var(--line);border-radius:13px;padding:15px}
.lineup-head{
 display:flex;gap:10px;align-items:center;padding-bottom:12px;
 border-bottom:1px solid var(--line)
}
.lineup-head img{width:38px;height:38px;object-fit:contain}
.lineup-head span{display:block;color:var(--muted);font-size:11px}
.lineup-player{
 display:grid;grid-template-columns:32px 1fr auto;gap:10px;
 align-items:center;padding:9px 0;border-bottom:1px solid rgba(34,48,56,.55)
}
.shirt{
 width:26px;height:26px;border:1px solid var(--line);border-radius:50%;
 display:grid;place-items:center;color:var(--muted);font-size:11px
}
.lineup-player small{display:block;color:var(--muted)}
.lineup-pos{color:var(--muted);font-size:11px}

.admin-shell{display:grid;grid-template-columns:330px 1fr;gap:14px}
.admin-list-v2{
 padding:12px;height:max-content;position:sticky;top:80px
}
.admin-list-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.admin-search{grid-column:1/-1}
.admin-match-list{margin-top:10px;max-height:70vh;overflow:auto}
.admin-match-btn{
 width:100%;text-align:left;background:transparent;border:1px solid transparent;
 border-radius:11px;color:var(--text);padding:10px;margin-bottom:5px
}
.admin-match-btn:hover,.admin-match-btn.selected{
 background:#17242a;border-color:var(--line)
}
.am-top{display:flex;justify-content:space-between;gap:8px}
.admin-match-btn small{display:block;color:var(--muted);margin-top:3px}
.admin-status-dot{
 width:8px;height:8px;border-radius:50%;background:#52636a;
 flex:0 0 auto;margin-top:5px
}
.admin-status-dot.live{
 background:var(--accent);box-shadow:0 0 12px rgba(110,231,183,.5)
}
.admin-status-dot.finished{background:#94a3b8}

.admin-panel-v2{padding:18px}
.admin-v2-header{border-bottom:1px solid var(--line);padding-bottom:15px}
.admin-v2-header h2{margin:4px 0}
.admin-v2-sub{display:flex;gap:6px}
.pill{
 display:inline-flex;padding:4px 8px;border:1px solid var(--line);
 border-radius:999px;color:var(--muted);font-size:11px
}
.pill.live{color:var(--accent);border-color:#285c4d}
.pill.done{color:#cbd5e1}

.admin-section-v2{padding:18px 0;border-bottom:1px solid var(--line)}
.admin-section-v2:last-child{border-bottom:0}

.admin-score-control{
 display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:15px
}
.admin-score-box input{text-align:center;font-size:28px;font-weight:900}
.admin-score-vs{color:var(--muted);font-weight:900;padding-bottom:10px}

.goal-assist{
 display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;
 padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b151a
}

.lineup-builder{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lineup-editor{border:1px solid var(--line);border-radius:13px;padding:14px}
.lineup-editor h4{margin:0 0 10px}
.xi-grid{display:grid;gap:7px}
.xi-row{display:grid;grid-template-columns:25px 1fr;gap:7px;align-items:center}
.xi-row b{color:var(--muted);font-size:11px;text-align:center}

.admin-event-log{display:grid;gap:6px}
.admin-log-row{
 display:grid;grid-template-columns:45px 30px 1fr auto;gap:8px;
 align-items:center;border:1px solid var(--line);padding:9px;border-radius:9px
}
.admin-log-row small{display:block;color:var(--muted)}
.delete-event{padding:5px 7px}

.toast{
 position:fixed;right:18px;bottom:18px;background:#14242b;border:1px solid #38505a;
 color:var(--text);padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);
 transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:100
}
.toast.show{transform:translateY(0);opacity:1}
.db-dot{
 display:inline-block;width:8px;height:8px;border-radius:50%;
 background:#eab308;margin-right:6px
}
.db-dot.ok{background:var(--accent)}

.ticker{
 border-bottom:1px solid var(--line);color:var(--muted);
 font-size:12px;overflow:hidden;white-space:nowrap
}
.ticker-track{max-width:1450px;margin:auto;padding:7px 20px}
.footer{
 border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);text-align:center
}

@media(max-width:1000px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .hero,.mc-columns,.admin-shell{grid-template-columns:1fr}
 .admin-list-v2{position:static}
 .lineup-builder,.mc-lineups{grid-template-columns:1fr}
}

@media(max-width:700px){
 .topbar-inner{flex-wrap:wrap}
 .nav{order:3;flex-basis:100%}
 .grid,.grid.two,.form-grid,.form-grid.three,.mini-grid,.kpis{grid-template-columns:1fr}
 .teams{gap:5px}
 .mc-scoreboard{grid-template-columns:1fr}
 .mc-team{margin:10px 0}
 .mc-big-score{font-size:42px}
 .date-nav{margin-left:0}
 .goal-assist{grid-template-columns:1fr}
 .admin-score-control{grid-template-columns:1fr}
 .admin-score-vs{display:none}
}
</style>
</head>

<body>
<div class="app">

<header class="topbar">
 <div class="topbar-inner">

 </div>
</header>

<main class="main">

 <section id="scores" class="page"></section>
 <section id="news" class="page"></section>
 <section id="article-page" class="page"></section>
 <section id="competitions" class="page"></section>

 <section id="stats" class="page"></section>

 <section id="player-page" class="page"></section>

</main>

<footer class="footer">MEFCO WATCH • Football, live.</footer>
<div id="toast" class="toast"></div>

</div>

<script>

const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";

const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";

const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";

const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";

let matches=[],news=[],teams=[],players=[],competitions=[];
let selectedMatchId=null,selectedArticleId=null,selectedCompetition=null;
let scoreFilter="all",scoreDate=todayISO(),adminLog=[],timer=null,refreshTimer=null,dbOnline=false;
let adminFilter="all";

let lineupDraft={
 matchId:null,
 home:[],
 away:[],
 dirty:false
};

const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 "'":"&#39;",
 '"':"&quot;"
}[c]));

function todayISO(){
 const d=new Date();
 return d.getFullYear()+"-"+
 String(d.getMonth()+1).padStart(2,"0")+"-"+
 String(d.getDate()).padStart(2,"0")
}

function dateObj(s){
 const [y,m,d]=String(s||todayISO()).split("-").map(Number);
 return new Date(y,m-1,d)
}

function localISO(d){
 return[
  d.getFullYear(),
  String(d.getMonth()+1).padStart(2,"0"),
  String(d.getDate()).padStart(2,"0")
 ].join("-")
}

function shiftISO(s,n){
 const d=dateObj(s);
 d.setDate(d.getDate()+Number(n||0));
 return localISO(d)
}

function fmtDate(s,opts={
 weekday:"short",
 month:"short",
 day:"numeric"
}){
 return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s))
}

function fmtTime(t){
 return t?String(t).slice(0,5):"—"
}

function matchDate(m){
 return String(m?.match_date??m?.date??todayISO()).slice(0,10)
}

function matchTime(m){
 return m?.match_time||m?.time||"00:00"
}

function scoreOf(m){
 return[
  Number(m?.score_home??m?.home_score??0),
  Number(m?.score_away??m?.away_score??0)
 ]
}

function isLive(m){
 return String(m?.status||"").toLowerCase()==="live"
}

function isFinished(m){
 return String(m?.status||"").toLowerCase()==="finished"
}

function teamById(id){
 return teams.find(t=>String(t.id)===String(id))
}

function playerById(id){
 return players.find(p=>String(p.id)===String(id))
}

function teamName(id,fallback="Unknown"){
 const t=teamById(id);
 return t?.name||t?.short_name||fallback
}

function playerImage(p){
 return p?.photo_url||
 p?.image_url||
 p?.photo||
 p?.image||
 p?.avatar_url||
 p?.avatar||
 p?.picture_url||
 p?.profile_image||
 ""
}

function competitionName(c,fallback="Competition"){
 return c?.name||
 c?.title||
 c?.short_name||
 c?.competition||
 fallback
}

function competitionById(id){
 return competitions.find(c=>String(c.id)===String(id))
}

function competitionNameForMatch(m){
 return competitionName(
  competitionById(m?.competition_id),
  m?.competition||"MEFCO"
 )
}

function teamFlag(t){
 return t?.flag_url||
 t?.logo_url||
 t?.image_url||
 t?.crest_url||
 ""
}

function safeMediaUrl(value){
 const u=String(value||"").trim();
 if(!u)return"";

 try{
  const x=new URL(u,location.href);
  return["http:","https:","data:","blob:"].includes(x.protocol)
   ?x.href
   :"";
 }catch{
  return""
 }
}

function teamDisplayName(m,side){
 const id=side==="home"?m.home_team_id:m.away_team_id;
 return teamName(
  id,
  side==="home"?m.home:m.away
 )
}

function eventType(e){
 return String(
  e?.type||
  e?.event_type||
  "event"
 ).toLowerCase()
}

function eventPlayer(e){
 const p=playerById(e?.player_id);
 return p?.short_name||
 p?.name||
 e?.player_name||
 e?.player||
 ""
}

function eventTeam(e){
 return teamById(e?.team_id)?.name||
 e?.team||
 ""
}

function showToast(msg){
 const t=document.getElementById("toast");
 if(!t)return;

 t.textContent=msg;
 t.classList.add("show");

 clearTimeout(showToast.t);

 showToast.t=setTimeout(
  ()=>t.classList.remove("show"),
  2600
 )
}


/* ---------- SUPABASE ---------- */

async function supabaseFetch(url,options={}){
 const r=await fetch(url,{
  ...options,
  headers:{
   apikey:SUPABASE_KEY,
   Authorization:"Bearer "+SUPABASE_KEY,
   "Content-Type":"application/json",
   Prefer:"return=representation",
   ...(options.headers||{})
  }
 });

 const raw=await r.text();

 if(!r.ok){
  let info={};

  try{
   info=raw?JSON.parse(raw):{}
  }catch{}

  const err=new Error(
   info.message||
   raw||
   (`HTTP ${r.status}`)
  );

  err.status=r.status;
  err.code=info.code||"";
  err.hint=info.hint||"";
  err.details=info.details||"";
  err.url=url;

  throw err;
 }

 if(!raw)return null;

 try{
  return JSON.parse(raw)
 }catch{
  return raw
 }
}

async function safeLoad(url,params){
 return supabaseFetch(
  url+"?"+new URLSearchParams(params||{})
 )
}

async function loadTable(
 url,
 params={},
 fallbackParams={select:"*"}
){
 try{
  return await safeLoad(url,params)
 }catch(first){
  if(JSON.stringify(params)===JSON.stringify(fallbackParams)){
   throw first
  }

  try{
   return await safeLoad(url,fallbackParams)
  }catch{
   throw first
  }
 }
}


/* ---------- LINEUP HELPERS ---------- */

function readMatchMetadata(m){
 let meta={};

 try{
  meta=typeof m?.metadata==="string"
   ?JSON.parse(m.metadata||"{}")
   :(m?.metadata||{})
 }catch{}

 return meta&&typeof meta==="object"
  ?meta
  :{}
}

function readMatchLineups(m){
 const meta=readMatchMetadata(m);

 return{
  home:Array.isArray(meta?.lineups?.home)
   ?meta.lineups.home.map(String)
   :[],

  away:Array.isArray(meta?.lineups?.away)
   ?meta.lineups.away.map(String)
   :[]
 }
}

function resetLineupDraft(m){
 const saved=readMatchLineups(m);

 lineupDraft={
  matchId:m?.id??null,
  home:saved.home.slice(0,11),
  away:saved.away.slice(0,11),
  dirty:false
 }
}

function ensureLineupDraft(m){
 if(!m)return;

 if(String(lineupDraft.matchId)!==String(m.id)){
  resetLineupDraft(m)
 }
}

function snapshotLineupDraftFromDOM(){

 if(!homeEls.length&&!awayEls.length)return;

 lineupDraft={
  matchId:m.id,
  home:homeEls.map(s=>s.value),
  away:awayEls.map(s=>s.value),

 updateLineupDraftIndicator()

/* ---------- MATCH UPDATES ---------- */

async function updateMatch(id,changes){
 const m=matches.find(
  x=>String(x.id)===String(id)
 );

 if(!m){
  showToast("Match not found");
  return false;
 }

 try{
  const result=await supabaseFetch(
   MATCHES_URL+"?id=eq."+encodeURIComponent(id),
   {
    method:"PATCH",
    body:JSON.stringify(changes),
    headers:{
     Prefer:"return=minimal"
    }
   }
  );

  /*
   Do NOT trust the PATCH response as the
   authoritative local match object.
  */

  Object.assign(m,changes);

  try{
   renderAll()
  }catch(uiError){
   console.error(
    "MEFCO match render failed:",
    uiError
   )
  }

  return true;

 }catch(e){
  console.error(
   "MEFCO match update failed:",
   e
  );

  const detail=[
   e?.message,
   e?.code?`code ${e.code}`:"",
   e?.hint?`hint: ${e.hint}`:""
  ]
  .filter(Boolean)
  .join(" — ");

  showToast(
   "Match update failed: "+
   (detail||"database error")
  );

  return false;
}


/* ---------- STATUS ---------- */

async function persistStatus(id,status){
 const m=matches.find(
  x=>String(x.id)===String(id)
 );

 if(!m)return false;

 try{

  await supabaseFetch(
   MATCHES_URL+"?id=eq."+encodeURIComponent(id),
   {
    method:"PATCH",
    body:JSON.stringify({
     status
    }),
    headers:{
     Prefer:"return=minimal"
    }
   }
  );

  /*
   Verify with a fresh SELECT instead of assuming
   the PATCH response contains the updated row.
  */

  const verify=await safeLoad(
   MATCHES_URL,
   {
    select:"id,status",
    id:"eq."+id
   }
  );

  const row=Array.isArray(verify)
   ?verify[0]
   :null;

  if(!row||String(row.status)!==String(status)){
   throw new Error(
    `Supabase did not confirm status=${status}`
   );
  }

  m.status=status;

  if(status!=="live"){
   stopTimer()
  }

  try{
   renderAll()
  }catch(uiError){
   console.error(
    "MEFCO status render failed:",
    uiError
   )
  }

  return true;

 }catch(e){
  console.error(
   "MEFCO status update failed:",
   e
  );

  const detail=[
   e?.message,
   e?.code?`code ${e.code}`:"",
   e?.hint?`hint: ${e.hint}`:""
  ]
  .filter(Boolean)
  .join(" — ");

  showToast(
   "Status update failed: "+
   (detail||"database error")
  );

  return false;
}

}

/* ---------- CLOCK ---------- */

function startTimer(){
 stopTimer();

 const m=matches.find(
  x=>String(x.id)===String(selectedMatchId)
 );

 if(!m||!isLive(m))return;

 timer=setInterval(async()=>{
  const current=matches.find(
   x=>String(x.id)===String(selectedMatchId)
  );

  if(!current||!isLive(current)){
   stopTimer();
   return;
  }

  const minute=Math.max(
   0,
   Number(current.minute||0)+1
  );

  try{

   await supabaseFetch(
    MATCHES_URL+
    "?id=eq."+
    encodeURIComponent(current.id),
    {
     method:"PATCH",
     body:JSON.stringify({
      minute,
      status:"live"
     }),
     headers:{
      Prefer:"return=minimal"
     }
    }
   );

   current.minute=minute;
   current.status="live";

   if(
    ADMIN_MODE&&
    lineupDraft.dirty&&
    String(lineupDraft.matchId)===String(current.id)
   ){

    const min=document.getElementById("admMinute");
    if(min)min.value=minute;

    const em=document.getElementById("eventMinute");
    if(em)em.value=minute;

    const om=document.getElementById("otherEventMinute");
    if(om)om.value=minute;

   }else{
    renderAdminPanel()
   }

   renderTicker();

   if(selectedMatchId){
    renderMatch()
   }

  }catch(e){
   console.warn(
    "Clock update failed",
    e
   )
  }

 },60000)
}

function stopTimer(){
 if(timer)clearInterval(timer);
 timer=null;
}

function resumeLiveTimer(){
 const live=matches.find(
  m=>String(m.id)===String(selectedMatchId)&&isLive(m)
 );

 if(live){
  startTimer()
 }
}


/* ---------- EVENTS ---------- */

async function postEvent(event){

 const payload={
  ...event,
  data:
   event.data&&typeof event.data==="object"
    ?event.data
    :{}
 };

 if(payload.match_id!=null){
  payload.match_id=Number(payload.match_id)
 }

 if(payload.team_id!=null){
  payload.team_id=Number(payload.team_id)
 }

 if(payload.player_id!=null){
  payload.player_id=Number(payload.player_id)
 }

 if(payload.player_out_id!=null){
  payload.player_out_id=Number(payload.player_out_id)
 }

 if(!Number.isInteger(payload.match_id)){
  throw new Error(
   "Invalid match_id for event"
  );
 }

 if(
  payload.team_id!=null&&
  !Number.isInteger(payload.team_id)
 ){
  throw new Error(
   "Invalid team_id for event"
  );
 }

 if(
  payload.player_id!=null&&
  !Number.isInteger(payload.player_id)
 ){
  throw new Error(
   "Invalid player_id for event"
  );
 }

 const result=await supabaseFetch(
  EVENTS_URL,
  {
   method:"POST",
   body:JSON.stringify(payload)
  }
 );

 const row=Array.isArray(result)
  ?result[0]
  :result;

 if(!row||row.id==null){
  throw new Error(
   "Event INSERT returned no row. Check matches-events INSERT/SELECT policies."
  );
 }

 return row;
}

async function adjustPlayerStat(
 playerId,
 field,
 delta
){

 if(
  !playerId||
  ![
   "goals",
   "assists",
   "yellow_cards",
   "red_cards"
  ].includes(field)
 ){
  return false;
 }

 const p=playerById(playerId);

 if(!p){
  throw new Error(
   `Player ${playerId} is not loaded`
  );
 }

 const current=Number(
  p[field]||0
 );

 const value=Math.max(
  0,
  current+Number(delta||0)
 );

 await supabaseFetch(
  PLAYERS_URL+
  "?id=eq."+
  encodeURIComponent(playerId),
  {
   method:"PATCH",
   body:JSON.stringify({
    [field]:value
   }),
   headers:{
    Prefer:"return=minimal"
   }
  }
 );

 p[field]=value;

 return true;
}

/* ---------- GOAL + ASSIST ---------- */

async function addGoalWithAssist(){

 const m=matches.find(
  x=>String(x.id)===String(selectedMatchId)
 );

 if(!m)return;

 const teamIdRaw=
  document.getElementById(
   "eventTeamSelect"
  )?.value;

 const playerIdRaw=
  document.getElementById(
   "eventPlayerSelect"
  )?.value||null;

 const assistIdRaw=
  document.getElementById(
   "eventAssistPlayerSelect"
  )?.value||null;

 const minute=Math.max(
  0,
  Number(
   document.getElementById(
    "eventMinute"
   )?.value
  )||
  Number(m.minute)||
  0
 );

 const stoppage=Math.max(
  0,
  Number(
   document.getElementById(
    "eventStoppage"
   )?.value
  )||
  0
 );

 const teamId=Number(teamIdRaw);
 const playerId=Number(playerIdRaw);
 const assistId=assistIdRaw
  ?Number(assistIdRaw)
  :null;

 const matchId=Number(m.id);

 if(
  !Number.isInteger(teamId)||
  !Number.isInteger(playerId)||
  !Number.isInteger(matchId)
 ){
  showToast(
   "Invalid match, team or player ID"
  );
  return;
 }

 if(
  assistId!=null&&
  !Number.isInteger(assistId)
 ){
  showToast(
   "Invalid assist player ID"
  );
  return;
 }

 if(!teamId||!playerId){
  showToast(
   "Select the scoring team and scorer"
  );
  return;
 }

 if(
  assistId&&
  assistId===playerId
 ){
  showToast(
   "Scorer and assister must be different"
  );
  return;
 }

 const isHome=
  teamId===Number(m.home_team_id);

 const isAway=
  teamId===Number(m.away_team_id);

 if(!isHome&&!isAway){
  showToast(
   "Scoring team is not part of this match"
  );
  return;
 }

 const p=playerById(playerId);
 const ap=playerById(assistId);

 if(!p){
  showToast(
   `Player ${playerId} is not loaded in MEFCO Watch`
  );
  return;
 }

 if(
  String(p.team_id)!==
  String(teamId)
 ){
  showToast(
   "The scorer is not assigned to the selected team"
  );
  return;
 }

 if(
  assistId&&
  (
   !ap||
   String(ap.team_id)!==
   String(teamId)
  )
 ){
  showToast(
   "The assister is not assigned to the selected team"
  );
  return;
 }

 const created=[];

 let goalStat=false;
 let assistStat=false;
 let scoreSaved=false;

 const oldHome=
  Number(m.score_home||0);

 const oldAway=
  Number(m.score_away||0);

 const newScoreHome=
  isHome
   ?oldHome+1
   :oldHome;

 const newScoreAway=
  isAway
   ?oldAway+1
   :oldAway;

 const goalEvent={
  match_id:matchId,
  minute,
  stoppage,
  type:"goal",
  player_id:playerId,
  team_id:teamId,
  player:p.name||p.short_name||"",
  team:teamName(teamId,""),
  detail:assistId
   ?`Assist: ${ap?.name||ap?.short_name||""}`
   :"",
  data:{}
 };

 const assistEvent=assistId
  ?{
    match_id:matchId,
    minute,
    stoppage,
    type:"assist",
    player_id:assistId,
    team_id:teamId,
    player:ap.name||ap.short_name||"",
    team:teamName(teamId,""),
    detail:`For ${p.name||p.short_name||""}`,
    data:{}
   }
  :null;

 try{

  showToast("Saving goal…");

  const goal=
   await postEvent(goalEvent);

  created.push(goal);

  await adjustPlayerStat(
   playerId,
   "goals",
   1
  );

  goalStat=true;

  if(assistEvent){

   const assist=
    await postEvent(assistEvent);

   created.push(assist);

   await adjustPlayerStat(
    assistId,
    "assists",
    1
   );

   assistStat=true;
  }

  const ok=
   await updateMatch(
    m.id,
    {
     score_home:newScoreHome,
     score_away:newScoreAway
    }
   );

  if(!ok){
   throw new Error(
    "Score update failed after event creation"
   );
  }

  scoreSaved=true;

  m.events=m.events||[];

  created.forEach(
   e=>m.events.push(e)
  );

  try{
   renderAll()
  }catch(uiError){
   console.error(
    "MEFCO goal render failed:",
    uiError
   )
  }

  showToast(
   assistId
    ?"Goal + assist saved"
    :"Goal saved"
  );

 }catch(e){

  console.error(
   "MEFCO goal transaction failed:",
   e
  );

  /*
   Best-effort rollback so a partial goal
   cannot leave score/events/stats out of sync.
  */

  for(
   const e of created.slice().reverse()
  ){
   try{
    await deleteEventRow(e.id)
   }catch(re){
    console.error(
     "Goal rollback event failed:",
     re
    )
   }
  }

  if(assistStat){
   try{
    await adjustPlayerStat(
     assistId,
     "assists",
     -1
    )
   }catch(re){
    console.error(
     "Assist stat rollback failed:",
     re
    )
   }
  }

  if(goalStat){
   try{
    await adjustPlayerStat(
     playerId,
     "goals",
     -1
    )
   }catch(re){
    console.error(
     "Goal stat rollback failed:",
     re
    )
   }
  }

  if(scoreSaved){
   try{
    await updateMatch(
     m.id,
     {
      score_home:oldHome,
      score_away:oldAway
     }
    )
   }catch(re){
    console.error(
     "Score rollback failed:",
     re
    )
   }
  }

  try{
   await loadAllEvents();
   renderAll();
  }catch(uiError){
   console.error(
    "MEFCO rollback render failed:",
    uiError
   )
  }

  const detail=[
   e?.message,
   e?.code
    ?`code ${e.code}`
    :"",
   e?.hint
    ?`hint: ${e.hint}`
    :""
  ]
  .filter(Boolean)
  .join(" — ");

  showToast(
   "Goal NOT saved: "+
   (detail||"database error")
  );
 }
}

   )||
   Number(m.minute)||
   0
  ),
  stoppage:0,
  type,
  player_id:playerId,
  team_id:teamId,
  player:p?.name||
   p?.short_name||
   "",
  team:teamName(
   teamId,
   ""
  ),
  detail:
   document.getElementById(
    "otherEventDetail"
   )?.value.trim()||
   "",
  data:{}
 };

 try{

  const r=
   await postEvent(event);

  if(type==="yellow"){
   await adjustPlayerStat(
    playerId,
    "yellow_cards",
    1
   );
  }

  if(type==="red"){
   await adjustPlayerStat(
    playerId,
    "red_cards",
    1
   );
  }

  m.events=m.events||[];
  m.events.push(r);

  try{
   renderAll()
  }catch(uiError){
   console.error(uiError)
  }

  showToast("Event saved");

 }catch(e){

  console.error(
   "MEFCO event failed",
   e
  );

  showToast(
   "Event NOT saved: "+
   (e?.message||"database error")
  );
 }
}


/* ---------- DELETE EVENT ---------- */

async function deleteEvent(id){

 if(!id){
  showToast(
   "This event has no database ID"
  );
  return;
 }

 const m=matches.find(
  x=>String(x.id)===String(selectedMatchId)
 );

 const e=m?.events?.find(
  x=>String(x.id)===String(id)
 );

 if(!e)return;

 const type=eventType(e);

 try{

  await deleteEventRow(id);

  if(type==="goal"){

   await adjustPlayerStat(
    e.player_id,
    "goals",
    -1
   );

   const changes=
    String(e.team_id)===
    String(m.home_team_id)
     ?{
       score_home:Math.max(
        0,
        Number(m.score_home||0)-1
       )
      }
     :
      String(e.team_id)===
      String(m.away_team_id)
      ?{
        score_away:Math.max(
         0,
         Number(m.score_away||0)-1
        )
       }
      :
      null;

   if(changes){
    await updateMatch(
     m.id,
     changes
    );
   }
  }

  if(type==="assist"){
   await adjustPlayerStat(
    e.player_id,
    "assists",
    -1
   );
  }

  if(type==="yellow"){
   await adjustPlayerStat(
    e.player_id,
    "yellow_cards",
    -1
   );
  }

  if(type==="red"){
   await adjustPlayerStat(
    e.player_id,
    "red_cards",
    -1
   );
  }

  if(m){
   m.events=
    (m.events||[])
     .filter(
      x=>String(x.id)!==
      String(id)
     );
  }

  try{
   renderAll()
  }catch(uiError){
   console.error(uiError)
  }

  showToast("Event deleted");

 }catch(e2){

  console.error(
   "MEFCO delete event failed",
   e2
  );

  showToast(
   "Could not delete event: "+
   (e2?.message||"database error")
  );
 }
}

async function saveAdminMatch(){

 if(

 const cs=
  document.getElementById(
   "admCompetition"

 };

 for(

     "admCity"
    ).value.trim(),

    ).value.trim()
  })
 ){

  if(
   Object.prototype.hasOwnProperty.call(

    k
   )
  ){

  }
 }

 if(
  Object.prototype.hasOwnProperty.call(
   m,
   "home_flag"
  )
 ){

 }

 if(
  Object.prototype.hasOwnProperty.call(
   m,

 ){

 }

 const teamsChanged=

 if(teamsChanged){

  };

   matchId:m.id,

  };

 await updateMatch(
  m.id,

 );
}

async function createMatch(){

 const cs=
  document.getElementById(
   "createCompetition"
  );

 const h=teamById(
  document.getElementById(
   "createHomeTeam"
  ).value
 );

 const a=teamById(
  document.getElementById(
   "createAwayTeam"
  ).value
 );

 if(
  !h||
  !a||
  String(h.id)===String(a.id)
 ){
  showToast(
   "Select two different teams"
  );
  return;
 }

 const c=
  cs.options[
   cs.selectedIndex
  ];

 const name=
  c?.dataset.name||
  c?.textContent||
  "";

 const match={
  competition:name,

  competition_id:
   cs.value&&
   !String(cs.value).startsWith("legacy-")
    ?cs.value
    :null,

  home:h.name,
  away:a.name,

  home_team_id:h.id,
  away_team_id:a.id,

  match_date:
   document.getElementById(
    "createDate"
   ).value,

  match_time:
   document.getElementById(
    "createKickoff"
   ).value,

  home_flag:
   document.getElementById(
    "createHomeFlag"
   ).value.trim(),

  away_flag:
   document.getElementById(
    "createAwayFlag"
   ).value.trim(),

  status:"scheduled",
  minute:0,

  score_home:0,
  score_away:0,

  stoppage:0,
  favorite:false,

  metadata:{
   lineups:{
    home:[],
    away:[]
   }
  }
 };

 try{

  const result=
   await supabaseFetch(
    MATCHES_URL,
    {
     method:"POST",
     body:JSON.stringify(match)
    }
   );

  matches.push(
   Array.isArray(result)
    ?result[0]
    :result
  );

  showToast(
   "Match created"
  );

  renderAll();

 }catch(e){

  console.error(e);

  showToast(
   "Could not create match"
  );
 }
}

/* ---------- SCORES ---------- */

function setScoreDate(date){
 scoreDate=date;
 renderScores();
}

function moveScoreDate(delta){
 scoreDate=shiftISO(
  scoreDate,
  delta
 );
 renderScores();
}

function renderScores(){

 const el=
  document.getElementById(
   "scores"
  );

 let dayMatches=
  matches.filter(
   m=>matchDate(m)===scoreDate
  );

 if(scoreFilter==="live"){
  dayMatches=dayMatches.filter(isLive)
 }

 if(scoreFilter==="finished"){
  dayMatches=dayMatches.filter(isFinished)
 }

 if(scoreFilter==="scheduled"){
  dayMatches=dayMatches.filter(
   m=>!isLive(m)&&!isFinished(m)
  )
 }

 el.innerHTML=`

 <div class="section-head">

  <div>
   <div class="eyebrow">
    Match Centre
   </div>

   <h2>Scores</h2>

   <p>
    ${esc(fmtDate(scoreDate))}
   </p>
  </div>

 </div>

 <div class="toolbar">

  <button
   class="btn small filter ${scoreFilter==="all"?"active":""}"
   onclick="scoreFilter='all';renderScores()"
  >
   All
  </button>

  <button
   class="btn small filter ${scoreFilter==="live"?"active":""}"
   onclick="scoreFilter='live';renderScores()"
  >
   Live
  </button>

  <button
   class="btn small filter ${scoreFilter==="finished"?"active":""}"
   onclick="scoreFilter='finished';renderScores()"
  >
   Finished
  </button>

  <button
   class="btn small filter ${scoreFilter==="scheduled"?"active":""}"
   onclick="scoreFilter='scheduled';renderScores()"
  >
   Scheduled
  </button>

  <div class="date-nav">

   <button
    class="btn small"
    onclick="moveScoreDate(-1)"
   >
    ←
   </button>

   <input
    class="input"
    type="date"
    value="${esc(scoreDate)}"
    onchange="setScoreDate(this.value)"
    style="width:auto"
   >

   <button
    class="btn small"
    onclick="moveScoreDate(1)"
   >
    →
   </button>

   <button
    class="btn small"
    onclick="scoreDate=todayISO();renderScores()"
   >
    Today
   </button>

  </div>

 </div>

 ${
  dayMatches.length
   ?`
    <div class="grid">
     ${dayMatches.map(matchCard).join("")}
    </div>
   `
   :
   `
    <div class="empty">
     No matches for this date.
    </div>
   `
 }
 `;
}


/* ---------- COMPETITIONS ---------- */

function getCompetitionList(){

 const map=new Map();

 competitions.forEach(
  c=>{
   const name=
    competitionName(
     c,
     ""
    );

   if(name){
    map.set(
     String(c.id),
     {
      id:c.id,
      name
     }
    );
   }
  }
 );

 matches.forEach(
  m=>{
   if(
    m.competition&&
    ![...map.values()].some(
     c=>c.name===m.competition
    )
   ){
    map.set(
     "legacy-"+m.competition,
     {
      id:"legacy-"+m.competition,
      name:m.competition
     }
    );
   }
  }
 );

 return[...map.values()]
  .sort(
   (a,b)=>
    a.name.localeCompare(b.name)
  );
}

function renderCompetitions(){

 const el=
  document.getElementById(
   "competitions"
  );

 const list=
  getCompetitionList();

 el.innerHTML=`

 <div class="section-head">

  <div>
   <div class="eyebrow">
    MEFCO
   </div>

   <h2>Competitions</h2>

   <p>
    Browse competitions and fixtures.
   </p>
  </div>

 </div>

 ${
  list.length
   ?`
    <div class="grid">
     ${
      list.map(
       c=>{

        const count=
         matches.filter(
          m=>
           String(
            m.competition_id
           )===String(c.id)||
           (
            c.id.startsWith("legacy-")&&
            m.competition===c.name
           )
         ).length;

        return`
        <article class="card" style="padding:18px">

         <div class="eyebrow">
          Competition
         </div>

         <h3>
          ${esc(c.name)}
         </h3>

         <p class="muted">
          ${count} match${count===1?"":"es"}
         </p>

         <button
          class="btn small"
          onclick="openCompetition('${esc(c.id)}')"
         >
          View competition
         </button>

        </article>
        `;
       }
      ).join("")
     }
    </div>
   `
   :
   `
    <div class="empty">
     No competitions available.
    </div>
   `
 }
 `;
}

function renderSearch(){

 const el=
  document.getElementById(
   "search"
  );

 el.innerHTML=`

 <div class="section-head">

  <div>
   <div class="eyebrow">
    MEFCO Watch
   </div>

   <h2>Search</h2>

   <p>
    Search teams, players, matches and news.
   </p>
  </div>

 </div>

 <div class="searchbox">

  <input
   id="globalSearch"
   class="input"
   placeholder="Search MEFCO…"
   oninput="runSearch(this.value)"
  >

 </div>

 <div
  id="searchResults"
  class="search-results"
 ></div>
 `;
}

function runSearch(query){

 const q=String(query||"")
  .trim()
  .toLowerCase();

 const el=
  document.getElementById(
   "searchResults"
  );

 if(!el)return;

 if(!q){
  el.innerHTML="";
  return;
 }

 const results=[];

 teams
  .filter(
   t=>
    String(t.name||"")
     .toLowerCase()
     .includes(q)
  )
  .slice(0,8)
  .forEach(
   t=>{
    results.push(`
     <button
      class="search-result"
      onclick="openTeam('${esc(t.id)}')"
     >
      <strong>
       ${esc(t.name)}
      </strong>
      <span>Team</span>
     </button>
    `)
   }
  );

 players
  .filter(
   p=>
    String(
     p.name||
     p.short_name||
     ""
    )
     .toLowerCase()
     .includes(q)
  )
  .slice(0,8)
  .forEach(
   p=>{
    results.push(`
     <button
      class="search-result"
      onclick="openPlayer('${esc(p.id)}')"
     >
      <strong>
       ${esc(
        p.name||
        p.short_name
       )}
      </strong>
      <span>Player</span>
     </button>
    `)
   }
  );

 news
  .filter(
   n=>
    String(
     n.title||
     ""
    )
     .toLowerCase()
     .includes(q)
  )
  .slice(0,8)
  .forEach(
   n=>{
    results.push(`
     <button
      class="search-result"
      onclick="openArticle('${esc(n.id)}')"
     >
      <strong>
       ${esc(n.title)}
      </strong>
      <span>News</span>
     </button>
    `)
   }
  );

 matches
  .filter(
   m=>
    (
     teamDisplayName(m,"home")+
     " "+
     teamDisplayName(m,"away")
    )
     .toLowerCase()
     .includes(q)
  )
  .slice(0,8)
  .forEach(
   m=>{
    results.push(`
     <button
      class="search-result"
      onclick="openMatch('${esc(m.id)}')"
     >
      <strong>
       ${esc(
        teamDisplayName(m,"home")
       )}
       vs
       ${esc(
        teamDisplayName(m,"away")
       )}
      </strong>

      <span>
       ${esc(matchDate(m))}
      </span>

     </button>
    `)
   }
  );

 el.innerHTML=
  results.length
   ?results.join("")
   :`
    <div class="empty">
     No results found.
    </div>
   `;
}

/* ---------- MATCH CENTRE ---------- */

function openMatch(id){

 selectedMatchId=id;

 const m=matches.find(
  x=>String(x.id)===String(id)
 );

 if(!m)return;

 showPage("match");

 resumeLiveTimer();
}

function eventMinuteLabel(e){

 const minute=
  Number(e?.minute||0);

 const stoppage=
  Number(e?.stoppage||0);

 return stoppage
  ?`${minute}+${stoppage}'`
  :`${minute}'`;
}

function eventIcon(type){

 if(type==="goal")return"⚽";
 if(type==="assist")return"↗";
 if(type==="yellow")return"🟨";
 if(type==="red")return"🟥";
 if(type==="substitution")return"↕";

 return"•";
}

function eventDetail(e){

 const type=eventType(e);

 if(type==="goal"){
  const assist=
   String(
    e.detail||""
   );

  return assist
   ?assist
   :"Goal";
 }

 if(type==="assist"){
  return e.detail||
   "Assist";
 }

 return e.detail||
  type.charAt(0).toUpperCase()+
  type.slice(1);
}

  document.getElementById(
   "match-page"
  );

  x=>String(x.id)===String(selectedMatchId)

   <div class="mc-empty">

   </div>
  `;

  hs,

   .sort(
    (a,b)=>
     Number(a.minute||0)-

     Number(a.stoppage||0)-
     Number(b.stoppage||0)||
     Number(a.id||0)-
     Number(b.id||0)

   e=>eventType(e)==="goal"
  );

 const lineups=

      competitionNameForMatch(m)
     )}
    </span>

     ${esc(

     )}

     ${esc(
      fmtTime(matchTime(m))
     )}
    </span>

   </div>


   <div class="mc-scoreboard">

    <div class="mc-team">

     ${
      safeMediaUrl(
       m.home_flag||
       teamFlag(
        teamById(
         m.home_team_id
        )
       )
      )
       ?`
        <img
         src="${esc(
          safeMediaUrl(
           m.home_flag||
           teamFlag(
            teamById(
             m.home_team_id
            )
           )
          )
         )}"
         alt=""
        >
       `
       :""
     }

     <div class="mc-team-name">
      ${esc(
       teamDisplayName(
        m,
        "home"
       )
      )}
     </div>

     <div class="mc-team-side">
      HOME
     </div>

    </div>


    <div>

     <div class="mc-big-score">
      ${hs} - ${as}
     </div>

     <div
      class="mc-status ${

         :
         String(m.status||"SCHEDULED").toUpperCase()

    </div>

     ${
      safeMediaUrl(
       m.away_flag||

        teamById(
         m.away_team_id
        )

         src="${esc(
          safeMediaUrl(
           m.away_flag||
           teamFlag(
            teamById(
             m.away_team_id
            )
           )
          )
         )}"
         alt=""
        >
       `
       :""
     }

     <div class="mc-team-name">

function switchMatchTab(tab,button){

 document.querySelectorAll(
  ".mc-tab"
 ).forEach(
  b=>b.classList.remove("active")
 );

 document.querySelectorAll(
  ".mc-tab-panel"
 ).forEach(
  p=>p.classList.remove("active")
 );

 button.classList.add("active");

 const panel=
  document.getElementById(
   "mc-"+tab
  );

 if(panel){
  panel.classList.add("active")
 }
}

function adminMatchListHTML(list){

 return list.map(
  m=>{

   const selected=
    String(m.id)===
    String(selectedMatchId);

   const [
    hs,
    as
   ]=scoreOf(m);

   return`
    <button
     class="admin-match-btn ${selected?"selected":""}"
     onclick="selectAdminMatch('${esc(m.id)}')"
    >

     <div class="am-top">

      <div>
       <strong>
        ${esc(
         teamDisplayName(
          m,
          "home"
         )
        )}
        <br>
        ${esc(
         teamDisplayName(
          m,
          "away"
         )
        )}
       </strong>

       <small>
        ${esc(matchDate(m))}
        •
        ${esc(fmtTime(matchTime(m)))}
        •
        ${hs}-${as}
       </small>

      </div>

      <span
       class="admin-status-dot ${
        isLive(m)
         ?"live"
         :
         isFinished(m)
          ?"finished"
          :""
       }"
      ></span>

     </div>

    </button>
   `;
  }
 ).join("")||
 `
  <div class="empty">
   No matches found.
  </div>
 `;
}

function renderAdminMatchList(query=""){

 const el=
  document.getElementById(
   "adminMatchList"
  );

 if(!el)return;

 const q=String(query||"")
  .trim()
  .toLowerCase();

 const list=
  matches
   .filter(
    m=>{
     if(adminFilter==="all")return true;

     if(adminFilter==="live"){
      return isLive(m)
     }

     if(adminFilter==="finished"){
      return isFinished(m)
     }

     return String(
      m.status||""
     ).toLowerCase()===
     adminFilter
    }
   )
   .filter(
    m=>{
     if(!q)return true;

     return(
      teamDisplayName(m,"home")+
      " "+
      teamDisplayName(m,"away")+
      " "+
      String(m.competition||"")
     )
      .toLowerCase()
      .includes(q)
    }
   );

 el.innerHTML=
  adminMatchListHTML(list)
}

function selectAdminMatch(id){

 if(
  lineupDraft.dirty&&
  String(lineupDraft.matchId)!==
  String(id)
 ){

  snapshotLineupDraftFromDOM();

  const leave=
   confirm(
    "You have unsaved lineup changes. Switch matches anyway?"
   );

  if(!leave)return;
 }

 selectedMatchId=id;

 const m=matches.find(
  x=>String(x.id)===String(id)
 );

 resetLineupDraft(m);

 renderAdminPanel();

 resumeLiveTimer();
}

     )}
    </h4>

    <div class="xi-grid">

     ${
      Array.from(
       {length:11},
       (_,i)=>`

       <div class="xi-row">

        <b>
         ${i+1}
        </b>

        <select
         class="select away-lineup"
         onchange="handleLineupChange()"
        >

         <option value="">
          Select player
         </option>

         ${awayPlayers.map(
          p=>`
           <option
            value="${esc(p.id)}"
            ${
             String(
              awayDraft[i]||""
             )===
             String(p.id)
              ?"selected"
              :""
            }
           >
            ${esc(
             p.short_name||
             p.name
            )}
           </option>
          `
         ).join("")}

        </select>

       </div>

      `
      ).join("")
     }

    </div>

   </div>

  </div>

 </div>


 <!-- EVENT LOG -->

 <div class="admin-section-v2">

  <div class="section-head">

   <div>

    <h3>
     Event log
    </h3>

    <p>
     Every recorded event for this match.
    </p>

   </div>

   <span class="pill">
    ${events.length}
   </span>

  </div>

  ${
   events.length
    ?`
     <div class="admin-event-log">

      ${events.map(
       e=>`

       <div class="admin-log-row">

        <span>
         ${esc(
          eventMinuteLabel(e)
         )}
        </span>

        <span>
         ${eventIcon(
          eventType(e)
         )}
        </span>

        <div>

         <strong>
          ${esc(
           eventPlayer(e)||
           eventType(e)
          )}
         </strong>

         <small>
          ${esc(
           eventTeam(e)
          )}
          ${
           e.detail
            ?" • "+esc(e.detail)
            :""
          }
         </small>

        </div>

        <button
         class="btn danger delete-event"
         onclick="deleteEvent('${esc(e.id)}')"
        >
         Delete
        </button>

       </div>

      `
      ).join("")}

     </div>
    `
    :
    `
     <div class="empty">
      No events recorded yet.
     </div>
    `
  }

 </div>


 <!-- FIXTURE DETAILS -->

 <div class="admin-section-v2">

  <h3>
   Fixture details
  </h3>

  <div class="form-grid">

   <label>
    Home team

    <select
     id="admHomeTeam"
     class="select"
    >

     ${teams.map(
      t=>`
       <option
        value="${esc(t.id)}"
        ${
         String(t.id)===
         String(m.home_team_id)
          ?"selected"
          :""
        }
       >
        ${esc(t.name)}
       </option>
      `
     ).join("")}

    </select>

   </label>


   <label>
    Away team

    <select
     id="admAwayTeam"
     class="select"
    >

     ${teams.map(
      t=>`
       <option
        value="${esc(t.id)}"
        ${
         String(t.id)===
         String(m.away_team_id)
          ?"selected"
          :""
        }
       >
        ${esc(t.name)}
       </option>
      `
     ).join("")}

    </select>

   </label>


   <label>
    Competition

    <select
     id="admCompetition"
     class="select"
    >

     ${getCompetitionList().map(
      c=>`
       <option
        value="${esc(c.id)}"
        ${
         String(c.id)===
         String(m.competition_id)
          ?"selected"
          :""
        }
       >
        ${esc(c.name)}
       </option>
      `
     ).join("")}

    </select>

   </label>


   <label>
    Date

    <input
     id="admDate"
     class="input"
     type="date"
     value="${esc(matchDate(m))}"
    >

   </label>


   <label>
    Kickoff

    <input
     id="admTime"
     class="input"
     type="time"
     value="${esc(fmtTime(matchTime(m)))}"
    >

   </label>


   <label>
    Venue

    <input
     id="admVenue"
     class="input"
     value="${esc(m.venue||"")}"
    >

   </label>


   <label>
    City

    <input
     id="admCity"
     class="input"
     value="${esc(m.city||"")}"
    >

   </label>


   <label>
    Round

    <input
     id="admRound"
     class="input"
     value="${esc(
      m.round||
      m.matchday||
      ""
     )}"
    >

   </label>

  </div>


  <div
   class="actions"
   style="margin-top:14px"
  >

   <button
    class="btn primary"
    onclick="saveAdminMatch()"
   >
    Save fixture
   </button>

  </div>

 </div>

 `;
}


/* ---------- GLOBAL RENDER ---------- */

function renderTicker(){

 const el=
  document.getElementById(
   "tickerTrack"
  );

 if(!el)return;

 const live=
  matches.filter(isLive);

 if(live.length){

  el.textContent=
   "LIVE • "+
   live.map(
    m=>
     `${teamDisplayName(m,"home")} ${scoreOf(m)[0]}-${scoreOf(m)[1]} ${teamDisplayName(m,"away")}`
   ).join(
    "   •   "
   );

 }else{

  const next=
   [...matches]
    .filter(
     m=>
      !isFinished(m)
    )
    .sort(
     (a,b)=>
      (
       matchDate(a)+
       matchTime(a)
      ).localeCompare(
       matchDate(b)+
       matchTime(b)
      )
     )
    [0];

  el.textContent=
   next
    ?`NEXT • ${teamDisplayName(next,"home")} vs ${teamDisplayName(next,"away")} • ${fmtDate(matchDate(next))} ${fmtTime(matchTime(next))}`
    :"MEFCO Watch • No upcoming matches";
 }
}

function renderAll(){

 renderHome();
 renderScores();
 renderNews();
 renderCompetitions();
 renderStats();
 renderSearch();
 renderTicker();

 if(
  selectedMatchId
 ){
  renderMatch()
 }

 if(
  selectedArticleId
 ){
  const exists=news.find(
   n=>String(n.id)===
   String(selectedArticleId)
  );

  if(exists){
   openArticle(
    selectedArticleId
   );
  }
 }

 if(
  ADMIN_MODE
 ){
  renderAdminPanel()
 }
}


/* ---------- KEYBOARD / WINDOW ---------- */

window.addEventListener(
 "keydown",
 e=>{

  if(
   e.key==="/"&&
   ![
    "INPUT",
    "TEXTAREA",
    "SELECT"
   ].includes(
    document.activeElement.tagName
   )
  ){

   e.preventDefault();

   navFor("search");

   setTimeout(
    ()=>{
     document
      .getElementById(
       "globalSearch"
      )
      ?.focus()
    },
    50
   );
  }

  if(
   e.key.toLowerCase()==="r"&&
   e.ctrlKey
  ){

   e.preventDefault();

   refreshData();
  }

 }
);

window.addEventListener(
 "beforeunload",
 e=>{

  if(lineupDraft.dirty){
   e.preventDefault();
   e.returnValue="";
  }

 }
);

window.addEventListener(
 "focus",
 ()=>{
  if(
   document.visibilityState===
   "visible"
  ){
   renderTicker()
  }
 }
);


/* ---------- START ---------- */

loadData()
 .then(
  ()=>{
   startAutoRefresh();

   /*
    Resume the real match clock after
    a reload if the selected match is live.
   */

   if(selectedMatchId){
    resumeLiveTimer()
   }
  }
 )
 .catch(
  e=>{
   console.error(
    "MEFCO startup:",
    e
   );

   showToast(
    "MEFCO could not load data"
   );

   startAutoRefresh()
  }
 );

</script>

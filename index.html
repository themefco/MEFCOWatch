<style>

.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.news-card{overflow:hidden}.news-image{height:180px;background:#091216}.news-image img{width:100%;height:100%;object-fit:cover}.news-body{padding:18px}.news-body h3{margin:6px 0}.news-body p{color:var(--muted)}
.article{max-width:900px;margin:auto}.article h1{font-size:42px;line-height:1.05}.article-body{white-space:pre-wrap;color:#c6d2d7;font-size:16px}
.searchbox{max-width:700px}.search-results{display:grid;gap:7px;margin-top:14px;max-width:850px}.search-result{display:flex;justify-content:space-between;text-align:left;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text)}.search-result span{color:var(--muted)}
.team-header,.player-header{padding:22px;display:flex;gap:18px;align-items:center}.team-header>img{width:90px;height:90px;object-fit:contain}.player-avatar{width:100px;height:100px;border-radius:50%;background:#17262d;display:grid;place-items:center;font-size:28px;overflow:hidden}.player-avatar img{width:100%;height:100%;object-fit:cover}.profile-meta h1{margin:3px 0}.profile-meta p{color:var(--muted)}
.match-centre-shell{max-width:1150px;margin:auto}.match-centre-bar{display:flex;justify-content:space-between;margin-bottom:10px}.mc-hero{padding:24px}.mc-topline,.mc-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted)}.mc-scoreboard{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:34px 0}.mc-team img{width:70px;height:70px;object-fit:contain}.mc-team-name{font-size:20px;font-weight:900;margin-top:8px}.mc-team-side{color:var(--muted);font-size:11px}.mc-big-score{font-size:52px;font-weight:950;letter-spacing:-.06em}.mc-status{display:inline-block;color:var(--muted);font-weight:800}.mc-status.live{color:var(--accent)}.mc-status.done{color:#cbd5e1}.mc-tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-top:15px}.mc-tab{border:0;background:transparent;color:var(--muted);padding:12px 15px}.mc-tab.active{color:var(--text);border-bottom:2px solid var(--accent)}.mc-tab-panel{display:none}.mc-tab-panel.active{display:block}.mc-columns{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.mc-panel{padding:18px;margin-top:14px}.mc-panel-title{display:flex;justify-content:space-between;align-items:flex-end}.mc-panel-title span{color:var(--muted);font-size:12px}.mc-event-list{display:grid}.mc-event{display:grid;grid-template-columns:42px 32px 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.mc-event-minute{color:var(--muted);font-size:12px}.mc-event-icon{font-weight:900}.mc-event-copy span{display:block;color:var(--muted);font-size:12px}.mc-event-team{color:var(--muted);font-size:12px}.mc-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.mc-fact{padding:12px;border:1px solid var(--line);border-radius:10px}.mc-fact strong{display:block;font-size:20px}.mc-fact span{font-size:11px;color:var(--muted)}
.mc-lineups{display:grid;grid-template-columns:1fr 1fr;gap:14px}.lineup-side{border:1px solid var(--line);border-radius:13px;padding:15px}.lineup-head{display:flex;gap:10px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}.lineup-head img{width:38px;height:38px;object-fit:contain}.lineup-head span{display:block;color:var(--muted);font-size:11px}.lineup-player{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid rgba(34,48,56,.55)}.shirt{width:26px;height:26px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:11px}.lineup-player small{display:block;color:var(--muted)}.lineup-pos{color:var(--muted);font-size:11px}
.admin-shell{display:grid;grid-template-columns:330px 1fr;gap:14px}.admin-list-v2{padding:12px;height:max-content;position:sticky;top:80px}.admin-list-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}.admin-search{grid-column:1/-1}.admin-match-list{margin-top:10px;max-height:70vh;overflow:auto}.admin-match-btn{width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:11px;color:var(--text);padding:10px;margin-bottom:5px}.admin-match-btn:hover,.admin-match-btn.selected{background:#17242a;border-color:var(--line)}.am-top{display:flex;justify-content:space-between;gap:8px}.admin-match-btn small{display:block;color:var(--muted);margin-top:3px}.admin-status-dot{width:8px;height:8px;border-radius:50%;background:#52636a;flex:0 0 auto;margin-top:5px}.admin-status-dot.live{background:var(--accent);box-shadow:0 0 12px rgba(110,231,183,.5)}.admin-status-dot.finished{background:#94a3b8}
.admin-panel-v2{padding:18px}.admin-v2-header{border-bottom:1px solid var(--line);padding-bottom:15px}.admin-v2-header h2{margin:4px 0}.admin-v2-sub{display:flex;gap:6px}.pill{display:inline-flex;padding:4px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px}.pill.live{color:var(--accent);border-color:#285c4d}.pill.done{color:#cbd5e1}
.admin-section-v2{padding:18px 0;border-bottom:1px solid var(--line)}.admin-section-v2:last-child{border-bottom:0}.admin-score-control{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:15px}.admin-score-box input{text-align:center;font-size:28px;font-weight:900}.admin-score-vs{color:var(--muted);font-weight:900;padding-bottom:10px}.goal-assist{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#0b151a}.lineup-builder{display:grid;grid-template-columns:1fr 1fr;gap:12px}.lineup-editor{border:1px solid var(--line);border-radius:13px;padding:14px}.lineup-editor h4{margin:0 0 10px}.xi-grid{display:grid;gap:7px}.xi-row{display:grid;grid-template-columns:25px 1fr;gap:7px;align-items:center}.xi-row b{color:var(--muted);font-size:11px;text-align:center}.admin-event-log{display:grid;gap:6px}.admin-log-row{display:grid;grid-template-columns:45px 30px 1fr auto;gap:8px;align-items:center;border:1px solid var(--line);padding:9px;border-radius:9px}.admin-log-row small{display:block;color:var(--muted)}.delete-event{padding:5px 7px}
.toast{position:fixed;right:18px;bottom:18px;background:#14242b;border:1px solid #38505a;color:var(--text);padding:12px 15px;border-radius:10px;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;pointer-events:none;transition:.2s;z-index:100}.toast.show{transform:translateY(0);opacity:1}.db-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#eab308;margin-right:6px}.db-dot.ok{background:var(--accent)}
.ticker{border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;overflow:hidden;white-space:nowrap}.ticker-track{max-width:1450px;margin:auto;padding:7px 20px}.footer{border-top:1px solid var(--line);padding:25px 20px;color:var(--muted);text-align:center}
@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.hero,.mc-columns,.admin-shell{grid-template-columns:1fr}.admin-list-v2{position:static}.lineup-builder,.mc-lineups{grid-template-columns:1fr}}
@media(max-width:700px){.topbar-inner{flex-wrap:wrap}.nav{order:3;flex-basis:100%}.grid,.grid.two,.form-grid,.form-grid.three,.mini-grid,.kpis{grid-template-columns:1fr}.teams{gap:5px}.mc-scoreboard{grid-template-columns:1fr}.mc-team{margin:10px 0}.mc-big-score{font-size:42px}.date-nav{margin-left:0}.goal-assist{grid-template-columns:1fr}.admin-score-control{grid-template-columns:1fr}.admin-score-vs{display:none}}
</style>

<body>
<div class="app">
<header class="topbar">
 <div class="topbar-inner">
  <div class="brand">MEFCO <span>WATCH</span></div>
  <nav id="nav" class="nav">
   <button data-page="home" class="active" onclick="showPage('home',this)">Home</button>
   <button data-page="scores" onclick="showPage('scores',this)">Scores</button>
   <button data-page="news" onclick="showPage('news',this)">News</button>
   <button data-page="competitions" onclick="showPage('competitions',this)">Competitions</button>
   <button data-page="stats" onclick="showPage('stats',this)">Stats</button>
   <button data-page="search" onclick="showPage('search',this)">Search</button>
   <button data-page="admin" onclick="showPage('admin',this)">Admin</button>
  </nav>
  <button id="notificationButton" class="btn small" onclick="enableNotifications()">Enable Notifications</button>
 </div>
</header>
<div class="ticker"><div id="tickerTrack" class="ticker-track">MEFCO Watch • Loading…</div></div>
<main class="main">
 <section id="home" class="page active"></section>
 <section id="scores" class="page"></section>
 <section id="news" class="page"></section>
 <section id="article-page" class="page"></section>
 <section id="competitions" class="page"></section>
 <section id="competition-page" class="page"></section>
 <section id="stats" class="page"></section>
 <section id="search" class="page"></section>
 <section id="team-page" class="page"></section>
 <section id="player-page" class="page"></section>
 <section id="match-page" class="page"></section>
 <section id="admin" class="page"></section>
</main>
<footer class="footer">MEFCO WATCH • Football, live.</footer>
<div id="toast" class="toast"></div>
</div>

<script>
const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";
const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";
const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";
const ADMIN_MODE=new URLSearchParams(location.search).get("admin")==="1";

let matches=[],news=[],teams=[],players=[],competitions=[];
let selectedMatchId=null,selectedArticleId=null,selectedCompetition=null;
let scoreFilter="all",scoreDate=todayISO(),adminLog=[],timer=null,refreshTimer=null,dbOnline=false;
let adminFilter="all";

/* V2 LINEUP DRAFT STATE */
let lineupDraft={matchId:null,home:[],away:[],dirty:false};

const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function dateObj(s){const [y,m,d]=String(s||todayISO()).split("-").map(Number);return new Date(y,m-1,d)}
function localISO(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,"0"),String(d.getDate()).padStart(2,"0")].join("-")}
function shiftISO(s,n){const d=dateObj(s);d.setDate(d.getDate()+Number(n||0));return localISO(d)}
function fmtDate(s,opts={weekday:"short",month:"short",day:"numeric"}){return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s))}
function fmtTime(t){return t?String(t).slice(0,5):"—"}
function matchDate(m){return String(m?.match_date??m?.date??todayISO()).slice(0,10)}
function matchTime(m){return m?.match_time||m?.time||"00:00"}
function scoreOf(m){return[Number(m?.score_home??m?.home_score??0),Number(m?.score_away??m?.away_score??0)]}
function isLive(m){return String(m?.status||"").toLowerCase()==="live"}
function isFinished(m){return String(m?.status||"").toLowerCase()==="finished"}
function teamById(id){return teams.find(t=>String(t.id)===String(id))}
function playerById(id){return players.find(p=>String(p.id)===String(id))}
function teamName(id,fallback="Unknown"){const t=teamById(id);return t?.name||t?.short_name||fallback}
function playerImage(p){return p?.photo_url||p?.image_url||p?.photo||p?.image||p?.avatar_url||p?.avatar||p?.picture_url||p?.profile_image||""}
function competitionName(c,fallback="Competition"){return c?.name||c?.title||c?.short_name||c?.competition||fallback}
function competitionById(id){return competitions.find(c=>String(c.id)===String(id))}
function competitionNameForMatch(m){return competitionName(competitionById(m?.competition_id),m?.competition||"MEFCO")}
function teamFlag(t){return t?.flag_url||t?.logo_url||t?.image_url||t?.crest_url||""}
function safeMediaUrl(value){const u=String(value||"").trim();if(!u)return"";try{const x=new URL(u,location.href);return["http:","https:","data:","blob:"].includes(x.protocol)?x.href:""}catch{return""}}
function teamDisplayName(m,side){const id=side==="home"?m.home_team_id:m.away_team_id;return teamName(id,side==="home"?m.home:m.away)}
function eventType(e){return String(e?.type||e?.event_type||"event").toLowerCase()}
function eventPlayer(e){const p=playerById(e?.player_id);return p?.short_name||p?.name||e?.player_name||e?.player||""}
function eventTeam(e){return teamById(e?.team_id)?.name||e?.team||""}
function showToast(msg){const t=document.getElementById("toast");if(!t)return;t.textContent=msg;t.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove("show"),2600)}

async function supabaseFetch(url,options={}){
 const r=await fetch(url,{...options,headers:{
  apikey:SUPABASE_KEY,
  Authorization:"Bearer "+SUPABASE_KEY,
  "Content-Type":"application/json",
  Prefer:"return=representation",
  ...(options.headers||{})
 }});
 if(!r.ok)throw new Error(await r.text());
 return r.status===204?null:r.json();
}
async function safeLoad(url,params){return supabaseFetch(url+"?"+new URLSearchParams(params||{}))}
async function loadTable(url,params={},fallbackParams={select:"*"}){try{return await safeLoad(url,params)}catch(first){if(JSON.stringify(params)===JSON.stringify(fallbackParams))throw first;try{return await safeLoad(url,fallbackParams)}catch{return[]}}}

/* ---------- LINEUP V2 HELPERS ---------- */
function readMatchMetadata(m){
 let meta={};
 try{meta=typeof m?.metadata==="string"?JSON.parse(m.metadata||"{}"):(m?.metadata||{})}catch{}
 return meta&&typeof meta==="object"?meta:{};
}
function readMatchLineups(m){
 const meta=readMatchMetadata(m);
 return{
  home:Array.isArray(meta?.lineups?.home)?meta.lineups.home.map(String):[],
  away:Array.isArray(meta?.lineups?.away)?meta.lineups.away.map(String):[]
 };
}
function resetLineupDraft(m){
 const saved=readMatchLineups(m);
 lineupDraft={
  matchId:m?.id??null,
  home:saved.home.slice(0,11),
  away:saved.away.slice(0,11),
  dirty:false
 };
}
function ensureLineupDraft(m){
 if(!m)return;
 if(String(lineupDraft.matchId)!==String(m.id))resetLineupDraft(m);
}
function snapshotLineupDraftFromDOM(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 const homeEls=[...document.querySelectorAll(".home-lineup")];
 const awayEls=[...document.querySelectorAll(".away-lineup")];
 if(!homeEls.length&&!awayEls.length)return;
 lineupDraft={
  matchId:m.id,
  home:homeEls.map(s=>s.value),
  away:awayEls.map(s=>s.value),
  dirty:true
 };
 updateLineupDraftIndicator();
}
function handleLineupChange(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));
 if(!m)return;
 lineupDraft={
  matchId:m.id,
  home:[...document.querySelectorAll(".home-lineup")].map(s=>s.value),
  away:[...document.querySelectorAll(".away-lineup")].map(s=>s.value),
  dirty:true
 };
 updateLineupDraftIndicator();
}
function updateLineupDraftIndicator(){
 const el=document.getElementById("lineupDraftIndicator");
 if(el)el.textContent=lineupDraft.dirty?"Unsaved changes":"Saved";
}
function lineupIdsFromEditor(side){return[...document.querySelectorAll("."+side+"-lineup")].map(s=>s.value).filter(Boolean)}
function getDraftSide(m,side){ensureLineupDraft(m);return lineupDraft[side]||[]}

/* ---------- DATA ---------- */
async function loadData(){
 if(ADMIN_MODE&&lineupDraft.dirty)snapshotLineupDraftFromDOM();

 const jobs=await Promise.allSettled([
  loadTable(MATCHES_URL,{select:"*",order:"match_date.asc,match_time.asc"}),
  loadTable(NEWS_URL,{select:"*",order:"created_at.desc"}),
  loadTable(TEAMS_URL,{select:"*",order:"name.asc"}),
  loadTable(PLAYERS_URL,{select:"*",order:"name.asc"}),
  loadTable(COMPETITIONS_URL,{select:"*"})
 ]);

 const freshMatches=jobs[0].status==="fulfilled"&&Array.isArray(jobs[0].value)?jobs[0].value:[];
 matches=freshMatches;
 news=jobs[1].status==="fulfilled"&&Array.isArray(jobs[1].value)?jobs[1].value:[];
 teams=jobs[2].status==="fulfilled"&&Array.isArray(jobs[2].value)?jobs[2].value:[];
 players=jobs[3].status==="fulfilled"&&Array.isArray(jobs[3].value)?jobs[3].value:[];
 competitions=jobs[4].status==="fulfilled"&&Array.isArray(jobs[4].value)?jobs[4].value:[];

 teams.sort((a,b)=>teamName(a.id,a.name||a.short_name||"").localeCompare(teamName(b.id,b.name||b.short_name||"")));
 players.sort((a,b)=>String(a.name||a.short_name||"").localeCompare(String(b.name||b.short_name||"")));
 competitions.sort((a,b)=>competitionName(a).localeCompare(competitionName(b)));
 news.sort((a,b)=>new Date(b.created_at||b.published_at||0)-new Date(a.created_at||a.published_at||0));
 dbOnline=jobs[0].status==="fulfilled"&&jobs[2].status==="fulfilled";

 /* Never destroy an active lineup draft during refresh. */
 if(lineupDraft.matchId){
  const fresh=matches.find(x=>String(x.id)===String(lineupDraft.matchId));
  if(!fresh)resetLineupDraft(null);
 }
 await loadAllEvents();
 renderAll();
}
async function loadAllEvents(){
 if(!matches.length)return;
 try{
  const data=await loadTable(EVENTS_URL,{select:"*",order:"minute.asc,created_at.asc"});
  for(const m of matches)m.events=(data||[]).filter(e=>String(e.match_id)===String(m.id));
 }catch(e){for(const m of matches)m.events=m.events||[];console.warn("MEFCO events load:",e)}
}

function showPage(id,button=null){

 const p=document.getElementById(id);if(p)p.classList.add("active");

 if(button)button.classList.add("active");
 window.scrollTo({top:0,behavior:"smooth"});
 const fn={home:renderHome,scores:renderScores,news:renderNews,competitions:renderCompetitions,stats:renderStats,search:renderSearch,admin:renderAdmin}[id];
 if(fn)fn();
}
function navFor(page){const b=document.querySelector('#nav button[data-page="'+page+'"]');showPage(page,b)}

function renderAll(){
 renderHome();renderScores();renderNews();renderCompetitions();renderStats();renderSearch();

function newsCard(n){const image=safeMediaUrl(n.image_url||n.cover_url||n.hero_image||n.thumbnail_url||n.image||"");return`<article class="card news-card">${image?`<div class="news-image"><img src="${esc(image)}" alt="" loading="lazy" onerror="this.closest('.news-image')?.remove()"></div>`:""}<div class="news-body"><div class="date">${esc(formatNewsDate(n))}</div><h3>${esc(n.title||"Untitled article")}</h3><p>${esc(n.excerpt||n.summary||String(n.body||"").slice(0,150))}</p><button class="btn small" style="margin-top:13px" onclick="openArticle('${esc(n.id)}')">Read article</button></div></article>`}

function collectPlayerStats(){
 const out={};
 for(const p of players)out[p.name]={id:p.id,name:p.name,short_name:p.short_name,team:teamName(p.team_id,p.nationality||""),goals:Number(p.goals||0),assists:Number(p.assists||0)};
 for(const m of matches)for(const e of m.events||[]){const p=eventPlayer(e);if(!p)continue;const db=playerById(e.player_id),key=db?db.name:p;if(!out[key])out[key]={id:e.player_id,name:p,short_name:p,team:eventTeam(e),goals:0,assists:0};const t=eventType(e);if(t==="goal")out[key].goals++;if(t==="assist")out[key].assists++}
 return Object.values(out);
}

function runSearch(q){q=q.trim().toLowerCase();const el=document.getElementById("searchResults");if(!q){el.innerHTML="";return}const r=[];teams.filter(t=>(t.name+" "+(t.short_name||"")+" "+(t.country||"")).toLowerCase().includes(q)).slice(0,8).forEach(t=>r.push({type:"Team",name:t.name,sub:"National team",fn:()=>openTeam(t.id)}));players.filter(p=>(p.name+" "+(p.short_name||"")+" "+(p.nationality||"")).toLowerCase().includes(q)).slice(0,8).forEach(p=>r.push({type:"Player",name:p.name,sub:teamName(p.team_id,p.position||""),fn:()=>openPlayer(p.id)}));getCompetitionList().filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,5).forEach(c=>r.push({type:"Competition",name:c.name,sub:c.season||"Competition",fn:()=>openCompetition(c.id,c.name)}));matches.filter(m=>(teamDisplayName(m,"home")+" "+teamDisplayName(m,"away")+" "+(m.competition||"")).toLowerCase().includes(q)).slice(0,8).forEach(m=>r.push({type:"Match",name:`${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}`,sub:m.competition||"Match",fn:()=>openMatch(m.id)}));news.filter(n=>String(n.title||"").toLowerCase().includes(q)).slice(0,5).forEach(n=>r.push({type:"News",name:n.title,sub:formatNewsDate(n),fn:()=>openArticle(n.id)}));window._searchResults=r;el.innerHTML=r.length?r.map((x,i)=>`<button class="search-result" onclick="searchOpen(${i})"><strong>${esc(x.name)}</strong><span>${esc(x.type)} • ${esc(x.sub)}</span></button>`).join(""):'<div class="empty">No results.</div>'}

function renderMatch(){

/* ---------- STATUS / DATABASE FIX ---------- */
async function updateMatch(id,changes){
 const m=matches.find(x=>String(x.id)===String(id));if(!m)return false;
 const previous={...m};
 try{
  /* PATCH only the requested fields. Never send the stale whole match object. */
  const result=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify(changes)});
  const server=Array.isArray(result)?result[0]:result;
  Object.assign(m,server||changes);

  /* If status was changed, trust the server response only after it contains status. */
  if(Object.prototype.hasOwnProperty.call(changes,"status")){
   if(server&&String(server.status).toLowerCase()!==String(changes.status).toLowerCase()){
    throw new Error("Database returned a different status");
   }
   m.status=changes.status;
  }
  addLog(`Updated ${teamDisplayName(m,"home")} vs ${teamDisplayName(m,"away")}: ${Object.keys(changes).join(", ")}`);
  renderAll();
  return true;
 }catch(e){
  Object.assign(m,previous);
  console.error("MEFCO updateMatch:",e);
  showToast("Could not save match: "+(e?.message||"database error"));
  return false;
 }
}

async function persistStatus(id,status){
 const m=matches.find(x=>String(x.id)===String(id));if(!m)return false;
 status=String(status).toLowerCase();
 if(!["scheduled","live","halftime","finished","postponed","cancelled","abandoned"].includes(status))return false;
 try{
  showToast(status==="live"?"Starting match…":"Updating match…");
  /* Status writes are isolated from score/fixture writes. */
  const result=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id),{method:"PATCH",body:JSON.stringify({status})});
  const row=Array.isArray(result)?result[0]:result;
  if(!row||String(row.status).toLowerCase()!==status)throw new Error("Supabase did not confirm status="+status);
  m.status=status;
  if(row)Object.assign(m,row);
  /* Do not let a UI rerender invent a different status. */
  renderAll();
  return true;
 }catch(e){
  console.error("MEFCO status update:",e);
  showToast("Status was not saved: "+(e?.message||"database error"));
  return false;
 }
}
async function startSelected(){
 const id=selectedMatchId;
 const m=matches.find(x=>String(x.id)===String(id));
 if(!m)return;
 /* Only this function is allowed to transition a match into LIVE. */
 const ok=await persistStatus(id,"live");
 if(!ok)return;
 try{
  /* Final read-back prevents an old scheduled value from being accepted by the UI. */
  const verify=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(id)+"&select=id,status");
  const row=Array.isArray(verify)?verify[0]:verify;
  if(!row||String(row.status).toLowerCase()!=="live")throw new Error("Live status was not persisted");
  m.status="live";
  startTimer();
  showToast("Match is LIVE");
 }catch(e){
  console.error("LIVE verification failed:",e);
  m.status="scheduled";
  stopTimer();
  showToast("Could not confirm LIVE status");
 }
}
async function pauseSelected(){const ok=await persistStatus(selectedMatchId,"halftime");if(ok)stopTimer()}
async function finishSelected(){const ok=await persistStatus(selectedMatchId,"finished");if(ok)stopTimer()}

/* ---------- CLOCK: NEVER REBUILD DIRTY LINEUP EDITOR ---------- */
function startTimer(){
 stopTimer();
 timer=setInterval(async()=>{
  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  if(!m||!isLive(m))return;
  const minute=Number(m.minute||0)+1;
  try{
   const result=await supabaseFetch(MATCHES_URL+"?id=eq."+encodeURIComponent(m.id),{method:"PATCH",body:JSON.stringify({minute,status:"live"})});
   const row=Array.isArray(result)?result[0]:result;
   if(row&&String(row.status).toLowerCase()!=="live")throw new Error("Clock update returned non-live status");
   m.minute=minute;m.status="live";
   if(ADMIN_MODE&&lineupDraft.dirty&&String(lineupDraft.matchId)===String(m.id)){
    const min=document.getElementById("admMinute");if(min)min.value=minute;
    const em=document.getElementById("eventMinute");if(em)em.value=minute;
    const om=document.getElementById("otherEventMinute");if(om)om.value=minute;
   }else renderAdminPanel();
   renderTicker();if(selectedMatchId)renderMatch();
  }catch(e){console.warn("Clock update failed",e)}
 },60000);
}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
function resumeLiveTimer(){const live=matches.find(m=>String(m.id)===String(selectedMatchId)&&isLive(m));if(live)startTimer()}

 try{
  const goal=await postEvent({match_id:m.id,minute,stoppage,type:"goal",player_id:playerId,team_id:teamId,player:p?.name||"",team:teamName(teamId,""),detail:assistId?"Assist: "+(ap?.name||""):""});

async function deleteEvent(id){

 const m=matches.find(x=>String(x.id)===String(selectedMatchId)),e=m?.events?.find(x=>String(x.id)===String(id));if(!e)return;
 try{
  await supabaseFetch(EVENTS_URL+"?id=eq."+encodeURIComponent(id),{method:"DELETE"});
  if(eventType(e)==="goal"){await adjustPlayerStat(e.player_id,"goals",-1);const changes=String(e.team_id)===String(m.home_team_id)?{score_home:Math.max(0,Number(m.score_home||0)-1)}:String(e.team_id)===String(m.away_team_id)?{score_away:Math.max(0,Number(m.score_away||0)-1)}:null;if(changes)await updateMatch(m.id,changes)}
  if(eventType(e)==="assist")await adjustPlayerStat(e.player_id,"assists",-1);
  if(eventType(e)==="yellow")await adjustPlayerStat(e.player_id,"yellow_cards",-1);
  if(eventType(e)==="red")await adjustPlayerStat(e.player_id,"red_cards",-1);
  if(m)m.events=(m.events||[]).filter(x=>String(x.id)!==String(id));
  renderAll();showToast("Event deleted");
 }catch(e2){console.error(e2);showToast("Could not delete event")}
}

/* ---------- LINEUPS ---------- */
function resetCurrentLineupDraft(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 resetLineupDraft(m);renderAdminPanel();showToast("Lineups reset to last saved version");
}
async function saveLineups(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 const home=lineupIdsFromEditor("home"),away=lineupIdsFromEditor("away");
 if(home.length!==new Set(home).size||away.length!==new Set(away).size){showToast("A player cannot appear twice in the same XI");return}
 if(home.length!==11||away.length!==11){showToast("Select exactly 11 players for each starting XI");return}
 const meta=readMatchMetadata(m);meta.lineups={home,away};
 const ok=await updateMatch(m.id,{metadata:meta});
 if(ok){lineupDraft={matchId:m.id,home:home.slice(),away:away.slice(),dirty:false};renderAdminPanel();showToast("Lineups saved")}
}

/* ---------- FIXTURE EDITOR ---------- */
function openMatchEditor(id){if(!ADMIN_MODE){showToast("Admin mode is required");return}if(String(selectedMatchId)!==String(id)){if(lineupDraft.dirty)snapshotLineupDraftFromDOM();selectedMatchId=id;resetLineupDraft(matches.find(x=>String(x.id)===String(id)))}showPage("admin");renderAdminPanel()}
async function saveAdminMatch(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 const home=teamById(document.getElementById("admHomeTeam").value),away=teamById(document.getElementById("admAwayTeam").value);
 if(!home||!away||String(home.id)===String(away.id)){showToast("Choose two different teams");return}
 const cs=document.getElementById("admCompetition"),changes={home_team_id:home.id,away_team_id:away.id,home:home.name,away:away.name,match_date:document.getElementById("admDate").value,match_time:document.getElementById("admTime").value,competition_id:cs.value||null,competition:cs.options[cs.selectedIndex]?.textContent||""};
 for(const[k,v]of Object.entries({venue:document.getElementById("admVenue").value.trim(),city:document.getElementById("admCity").value.trim(),round:document.getElementById("admRound").value.trim(),matchday:document.getElementById("admRound").value.trim()}))if(Object.prototype.hasOwnProperty.call(m,k))changes[k]=v;
 if(Object.prototype.hasOwnProperty.call(m,"home_flag"))changes.home_flag=teamFlag(home);
 if(Object.prototype.hasOwnProperty.call(m,"away_flag"))changes.away_flag=teamFlag(away);
 const teamsChanged=String(home.id)!==String(m.home_team_id)||String(away.id)!==String(m.away_team_id);
 if(teamsChanged){const meta=readMatchMetadata(m);meta.lineups={home:[],away:[]};changes.metadata=meta;lineupDraft={matchId:m.id,home:[],away:[],dirty:false}}
 await updateMatch(m.id,changes);
}
async function saveScoreOnly(){
 const m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;
 /* Score saving must NEVER change match status. Status is controlled only by Start, Half time and Finish. */
 await updateMatch(m.id,{score_home:Math.max(0,Number(document.getElementById("admHomeScore").value)||0),score_away:Math.max(0,Number(document.getElementById("admAwayScore").value)||0),minute:Math.max(0,Number(document.getElementById("admMinute").value)||0),stoppage:Math.max(0,Number(document.getElementById("admStoppage").value)||0)});
}
function showCreateMatch(){
 const el=document.getElementById("adminPanel");el.innerHTML=`<div class="eyebrow">New match</div><h2>Create fixture</h2><div class="form-grid" style="margin-top:15px"><label>Competition<select id="createCompetition" class="select"><option value="">Select competition</option>${getCompetitionList().map(c=>`<option value="${esc(c.id||c.name)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join("")}</select></label><label>Date<input id="createDate" class="input" type="date" value="${todayISO()}"></label><label>Kickoff<input id="createKickoff" class="input" type="time" value="20:00"></label><label>Home team<select id="createHomeTeam" class="select"><option value="">Select home team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select></label><label>Away team<select id="createAwayTeam" class="select"><option value="">Select away team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join("")}</select></label><label>Home flag URL<input id="createHomeFlag" class="input"></label><label>Away flag URL<input id="createAwayFlag" class="input"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createMatch()">Create Match</button></div>`;
}
async function createMatch(){
 const cs=document.getElementById("createCompetition"),h=teamById(document.getElementById("createHomeTeam").value),a=teamById(document.getElementById("createAwayTeam").value);if(!h||!a||String(h.id)===String(a.id)){showToast("Select two different teams");return}
 const c=cs.options[cs.selectedIndex],name=c?.dataset.name||c?.textContent||"",match={competition:name,competition_id:cs.value&&!String(cs.value).startsWith("legacy-")?cs.value:null,home:h.name,away:a.name,home_team_id:h.id,away_team_id:a.id,match_date:document.getElementById("createDate").value,match_time:document.getElementById("createKickoff").value,home_flag:document.getElementById("createHomeFlag").value.trim(),away_flag:document.getElementById("createAwayFlag").value.trim(),status:"scheduled",minute:0,score_home:0,score_away:0,stoppage:0,favorite:false,metadata:{lineups:{home:[],away:[]}}};
 try{const result=await supabaseFetch(MATCHES_URL,{method:"POST",body:JSON.stringify(match)});matches.push(Array.isArray(result)?result[0]:result);showToast("Match created");renderAll()}catch(e){console.error(e);showToast("Could not create match")}
}
async function toggleFavorite(id){const m=matches.find(x=>String(x.id)===String(id));if(m)await updateMatch(id,{favorite:!m.favorite})}
async function refreshData(){showToast("Refreshing MEFCO data…");try{await loadData();showToast("Data refreshed")}catch(e){console.error(e);showToast("Data refresh failed")}}
function startAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(document.visibilityState==="visible")loadData().catch(console.warn)},30000)}
async function enableNotifications(){if(!("Notification"in window)){showToast("Notifications are not supported here");return}const p=await Notification.requestPermission();document.getElementById("notificationButton").textContent=p==="granted"?"Notifications Enabled":p==="denied"?"Notifications Blocked":"Enable Notifications";showToast(p==="granted"?"Notifications enabled":"Notification permission not granted")}
async function sendNotification(title,body,url="/"){try{const r=await fetch(NOTIFICATION_API+"/api/notify",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title,body,url})});if(!r.ok)throw new Error(await r.text());showToast("Notification sent")}catch(e){showToast("Notification service unavailable")}}
function addLog(msg){adminLog.unshift({time:new Date().toLocaleTimeString(),msg});if(adminLog.length>50)adminLog.pop()}

window.addEventListener("keydown",e=>{
 if(e.key==="/"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();navFor("search");setTimeout(()=>document.getElementById("globalSearch")?.focus(),50)}
 if(e.key.toLowerCase()==="r"&&e.ctrlKey){e.preventDefault();refreshData()}
});
window.addEventListener("beforeunload",e=>{if(lineupDraft.dirty){e.preventDefault();e.returnValue=""}});
window.addEventListener("focus",()=>{if(document.visibilityState==="visible")renderTicker()});

loadData().then(()=>{
 startAutoRefresh();
 /* Resume the real match clock after a reload if the selected match is live. */
 if(selectedMatchId)resumeLiveTimer();
}).catch(e=>{console.error("MEFCO startup:",e);showToast("MEFCO could not load data");startAutoRefresh()});
</script>

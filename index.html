<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="MEFCO Watch — live football scores, national teams, competitions, news and statistics.">
<title>MEFCO Watch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#050607;
  --bg2:#080b0e;
  --panel:#0b0f12;
  --panel2:#10151a;
  --panel3:#151b21;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#f7f8f5;
  --muted:#89939b;
  --soft:#b7c0c5;
  --green:#b7ff2a;
  --green2:#76d900;
  --cyan:#63e6ff;
  --red:#ff5364;
  --amber:#ffd166;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 25px 80px rgba(0,0,0,.45);
  --shadow2:0 12px 40px rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--text);
  font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(183,255,42,.08),transparent 23rem),
    radial-gradient(circle at 96% 12%,rgba(99,230,255,.055),transparent 27rem),
    linear-gradient(180deg,#080a0c 0,#050607 55%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.025;
  background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px);
}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.app{min-height:100vh}

/* HEADER / BROADCAST NAV */
header{
  position:sticky;top:0;z-index:30;min-height:76px;padding:11px 30px;
  display:flex;align-items:center;gap:24px;
  background:rgba(5,6,7,.78);border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
}
header:before{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--green),var(--cyan),transparent);opacity:.65}
.logo{
  position:relative;display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:5px 0;
  border:0;background:none;color:#fff;font-family:"Barlow Condensed",sans-serif;font-size:31px;font-weight:900;letter-spacing:-1.2px;text-transform:uppercase;
}
.logo:before{content:"";width:9px;height:27px;background:var(--green);transform:skewX(-15deg);box-shadow:0 0 20px rgba(183,255,42,.45)}
.logo span{color:var(--green)}
nav{display:flex;align-items:center;justify-content:center;gap:5px;flex:1}
nav button,.ghost{
  position:relative;border:1px solid transparent;background:transparent;color:#7f898f;padding:10px 13px;border-radius:11px;
  font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;transition:.22s ease;
}
nav button:after{content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;background:var(--green);transform:scaleX(0);transform-origin:center;transition:.22s}
nav button:hover,.ghost:hover{color:#fff;background:rgba(255,255,255,.045);border-color:var(--line)}
nav button.active{color:#fff;background:rgba(183,255,42,.075);border-color:rgba(183,255,42,.16)}
nav button.active:after{transform:scaleX(1)}
.head-right{display:flex;align-items:center;gap:8px}
.notif{border:1px solid var(--line2);background:#0b0f12;color:#e8eeeb;padding:9px 12px;border-radius:11px;font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.55px;transition:.2s}
.notif:hover{border-color:rgba(183,255,42,.4);box-shadow:0 0 25px rgba(183,255,42,.08)}

/* TICKER */
.ticker{height:38px;display:flex;align-items:center;overflow:hidden;background:#090c0e;border-bottom:1px solid var(--line);box-shadow:0 10px 35px rgba(0,0,0,.2)}
.ticker:before{content:"LIVE FEED";height:100%;display:flex;align-items:center;padding:0 15px;background:var(--green);color:#050607;font-size:10px;font-weight:1000;letter-spacing:1px;position:relative;z-index:2}
.ticker-track{white-space:nowrap;animation:scroll 40s linear infinite;padding-left:25px;color:#a4adb2;font-size:10px;font-weight:700;letter-spacing:.2px}
.ticker b{color:var(--green);font-weight:1000}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* PAGE */
main{width:min(1560px,100%);margin:auto;padding:36px 30px 90px}
.page{display:none;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both}.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* UNIVERSAL CARDS */
.card,.hero-main{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));box-shadow:var(--shadow2);
}
.card:before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 28%,transparent 72%,rgba(255,255,255,.018));opacity:.7}
.card:hover{border-color:rgba(255,255,255,.15);box-shadow:0 18px 60px rgba(0,0,0,.42);transform:translateY(-2px)}
.card{transition:border-color .22s,box-shadow .22s,transform .22s}
.section{margin-top:42px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}
.section-head h2,h2{font-family:"Barlow Condensed",sans-serif;font-size:32px;line-height:.95;letter-spacing:-.5px;text-transform:uppercase}
.section-head p,.muted{color:var(--muted);font-size:12px;margin-top:7px}
.eyebrow{color:var(--green);font-size:10px;font-weight:1000;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px}
.date{color:#748087;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.empty{border:1px dashed rgba(255,255,255,.13);border-radius:18px;padding:40px;text-align:center;color:#707a80;background:rgba(255,255,255,.015)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.65fr);gap:16px;margin-bottom:32px}
.hero-main{min-height:390px;padding:42px;display:flex;flex-direction:column;justify-content:flex-end;background:
  radial-gradient(circle at 78% 18%,rgba(183,255,42,.19),transparent 22%),
  radial-gradient(circle at 90% 90%,rgba(99,230,255,.10),transparent 28%),
  linear-gradient(135deg,#151c20 0,#090c0f 68%);}
.hero-main:before{content:"01";position:absolute;right:-10px;top:-45px;font-family:"Barlow Condensed";font-size:280px;font-weight:900;line-height:1;color:rgba(255,255,255,.025);font-style:italic}
.hero-main:after{content:"";position:absolute;width:380px;height:380px;right:8%;top:8%;border:1px solid rgba(183,255,42,.12);border-radius:50%;box-shadow:0 0 0 30px rgba(183,255,42,.012),0 0 0 60px rgba(183,255,42,.008);pointer-events:none}
.hero-main h1{position:relative;z-index:1;max-width:820px;font-family:"Barlow Condensed";font-size:clamp(54px,6vw,94px);line-height:.84;letter-spacing:-2.8px;text-transform:uppercase;font-weight:900}
.hero-main p{position:relative;z-index:1;max-width:650px;color:#aeb8bc;font-size:14px;line-height:1.65;margin-top:20px}
.hero-side{padding:26px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(155deg,#11171b,#090c0f)}
.hero-side h3{font-family:"Barlow Condensed";font-size:30px;line-height:.95;text-transform:uppercase;margin-bottom:18px}.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-stat{padding:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:14px}.mini-stat strong{display:block;font-family:"Barlow Condensed";font-size:30px;line-height:1}.mini-stat span{display:block;margin-top:5px;color:#7f8a90;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* BUTTONS */
.actions{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid var(--line2);background:rgba(255,255,255,.045);color:#eef2ef;padding:11px 15px;border-radius:11px;font-size:10px;font-weight:900;letter-spacing:.65px;text-transform:uppercase;transition:.2s;position:relative;z-index:2}
.btn:hover{border-color:rgba(183,255,42,.45);background:rgba(183,255,42,.08);transform:translateY(-1px)}
.btn.primary{color:#071000;background:var(--green);border-color:var(--green);box-shadow:0 8px 30px rgba(183,255,42,.16)}.btn.primary:hover{background:#c9ff5d;box-shadow:0 10px 40px rgba(183,255,42,.26)}
.btn.danger{color:#fff;background:rgba(255,83,100,.12);border-color:rgba(255,83,100,.35)}.btn.small{padding:8px 10px;font-size:9px}.btn:disabled{opacity:.45;cursor:not-allowed}

/* MATCH CARDS */
.match-card{padding:0;background:linear-gradient(160deg,#11171b,#090c0e)}
.match-card:after{content:"";position:absolute;inset:auto 0 0;height:2px;background:linear-gradient(90deg,transparent,var(--green),transparent);opacity:0;transition:.2s}.match-card:hover:after,.match-card.live:after{opacity:1}
.match-top{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)}
.competition-label{font-size:9px;color:#7f8a90;font-weight:900;text-transform:uppercase;letter-spacing:.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
.status{font-size:9px;color:#7f8a90;font-weight:900;letter-spacing:.6px}.live-dot{color:var(--red);font-size:9px;font-weight:1000;letter-spacing:.7px;animation:pulse 1.6s infinite}.live-dot:before{content:"";display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-right:5px;box-shadow:0 0 10px rgba(255,83,100,.7)}
@keyframes pulse{50%{opacity:.45}}
.teams{display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:24px 16px}.team{text-align:center;font-family:"Barlow Condensed";font-size:21px;font-weight:700;line-height:1.05;text-transform:uppercase}.team img{width:48px;height:48px;object-fit:contain;margin:0 auto 9px;filter:drop-shadow(0 7px 13px rgba(0,0,0,.4))}.score{font-family:"Barlow Condensed";font-size:34px;font-weight:900;text-align:center;letter-spacing:-1px}.teams>div:nth-child(2) .status{text-align:center;margin-top:3px}.match-bottom{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;border-top:1px solid var(--line);background:rgba(0,0,0,.13)}

/* NEWS */
.news-card{min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(180deg,#13191d,#090c0e)}
.news-card .news-image{height:155px;overflow:hidden;background:linear-gradient(135deg,#151b1f,#080a0c)}.news-card .news-image img{width:100%;height:100%;object-fit:cover;transition:.5s}.news-card:hover .news-image img{transform:scale(1.055)}
.news-body{padding:18px}.news-body h3{font-family:"Barlow Condensed";font-size:25px;line-height:.98;text-transform:uppercase;margin:8px 0}.news-body p{font-size:12px;line-height:1.55;color:#929da3}.news-card .btn{margin-top:13px}

/* TABLES */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.12)}.table{width:100%;border-collapse:collapse;min-width:600px}.table th{padding:12px 13px;color:#667279;font-size:9px;letter-spacing:1px;text-transform:uppercase;text-align:left;background:#0a0e11;border-bottom:1px solid var(--line)}.table td{padding:13px;border-bottom:1px solid rgba(255,255,255,.055);font-size:11px;color:#d8dedf}.table tr:hover td{background:rgba(183,255,42,.025)}.table tr:last-child td{border-bottom:0}

/* COMPETITIONS */
.competition-card{min-height:230px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;background:
  radial-gradient(circle at 90% 15%,rgba(183,255,42,.11),transparent 24%),linear-gradient(145deg,#141a1e,#090c0f)}
.competition-card:before{content:"COMP";position:absolute;right:-10px;bottom:-35px;font-family:"Barlow Condensed";font-size:120px;font-weight:900;font-style:italic;color:rgba(255,255,255,.025)}
.competition-card h3{font-family:"Barlow Condensed";font-size:34px;line-height:.9;text-transform:uppercase;max-width:80%}.competition-card p{color:#7e898f;font-size:11px;margin-top:8px}.competition-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:99px;padding:6px 9px;color:#89949a;font-size:8px;font-weight:900;text-transform:uppercase;letter-spacing:.7px}

/* PLAYER PROFILE — HERO-FIRST, IMAGE-DRIVEN */
.player-header{
  min-height:430px;padding:0;display:grid;grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);align-items:stretch;
  background:
    radial-gradient(circle at 12% 45%,rgba(183,255,42,.18),transparent 24%),
    linear-gradient(115deg,#151b1f,#080b0e 70%);
  border-color:rgba(255,255,255,.11);
}
.player-header:after{content:"PLAYER";position:absolute;right:-25px;bottom:-62px;font-family:"Barlow Condensed";font-style:italic;font-size:180px;font-weight:900;color:rgba(255,255,255,.028);pointer-events:none}
.player-avatar{
  min-height:430px;display:flex;align-items:end;justify-content:center;position:relative;overflow:hidden;
  font-family:"Barlow Condensed";font-size:180px;font-weight:900;color:rgba(255,255,255,.15);
  background:radial-gradient(circle at 50% 42%,rgba(183,255,42,.16),transparent 31%),linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25));
}
.player-avatar:before{content:"";position:absolute;bottom:-120px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(183,255,42,.15);box-shadow:0 0 0 35px rgba(183,255,42,.02),0 0 0 70px rgba(183,255,42,.012)}
.player-avatar img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));padding:20px 30px 0}
.player-avatar.has-photo{font-size:0;background:linear-gradient(180deg,rgba(183,255,42,.08),rgba(0,0,0,.25))}.player-avatar.has-photo .player-initial{display:none}.player-initial{position:relative;z-index:1}
.player-avatar.has-photo:after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,rgba(0,0,0,.45));z-index:3;pointer-events:none}
.profile-meta{position:relative;z-index:4;align-self:center;padding:48px 48px 48px 25px}.profile-meta .eyebrow{font-size:11px}.profile-meta h1{font-family:"Barlow Condensed";font-size:clamp(58px,7vw,105px);font-weight:900;line-height:.78;letter-spacing:-2px;text-transform:uppercase;max-width:760px}.profile-meta p{margin-top:18px;color:#aab4b8;font-size:13px}.profile-meta:before{content:"";position:absolute;left:0;top:52px;width:4px;height:110px;background:var(--green);box-shadow:0 0 25px rgba(183,255,42,.3)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.kpi{padding:17px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));position:relative;overflow:hidden}.kpi:after{content:"";position:absolute;right:-10px;bottom:-20px;width:60px;height:60px;border-radius:50%;background:rgba(183,255,42,.05)}.kpi strong{display:block;font-family:"Barlow Condensed";font-size:31px;line-height:.9}.kpi span{display:block;margin-top:6px;color:#747f85;font-size:8px;font-weight:900;letter-spacing:1px;text-transform:uppercase}

/* TEAM PROFILE */
.team-header{padding:30px;display:flex;align-items:center;gap:25px;background:radial-gradient(circle at 15% 50%,rgba(183,255,42,.12),transparent 25%),linear-gradient(135deg,#141a1e,#090c0f)}
.team-header img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 15px 22px rgba(0,0,0,.45))}.team-header h1{font-family:"Barlow Condensed";font-size:65px;line-height:.85;text-transform:uppercase}.team-header p{margin-top:10px;color:#8e999e;font-size:12px}

/* MATCH CENTRE */
.match-hero{padding:28px;background:radial-gradient(circle at 50% 0,rgba(183,255,42,.11),transparent 35%),linear-gradient(145deg,#151b1f,#080b0e)}
.match-hero .teams{padding:35px 25px}.match-hero .team{font-size:28px}.match-hero .team img{width:75px;height:75px}.match-hero .score{font-size:64px}.timeline,.log{display:flex;flex-direction:column;gap:8px}.log-item{padding:12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:12px;color:#b7c0c5;font-size:11px}

/* FORMS / ADMIN */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}label{display:flex;flex-direction:column;gap:7px;color:#818c92;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}.input,.select,textarea{width:100%;border:1px solid var(--line2);outline:0;background:#090d10;color:#edf2ef;border-radius:11px;padding:11px 12px;font-size:11px}.input:focus,.select:focus,textarea:focus{border-color:rgba(183,255,42,.55);box-shadow:0 0 0 3px rgba(183,255,42,.07)}

/* SEARCH */
.search-results{display:grid;gap:8px}.search-result{padding:15px 16px;border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.025);transition:.2s}.search-result:hover{border-color:rgba(183,255,42,.25);background:rgba(183,255,42,.035);transform:translateX(3px)}

/* FOOTER / UTILITY */
.db-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffbd45;margin-right:7px;box-shadow:0 0 10px rgba(255,189,69,.35)}.db-dot.ok{background:var(--green);box-shadow:0 0 12px rgba(183,255,42,.55)}
.hide{display:none!important}.toast{position:fixed;right:22px;bottom:22px;z-index:100;padding:13px 16px;border:1px solid var(--line2);border-radius:13px;background:rgba(10,13,15,.94);box-shadow:var(--shadow);color:#edf2ef;font-size:11px;font-weight:800;backdrop-filter:blur(18px)}

/* IMAGE SAFETY */
.news-card img,.team-header img,.team img,.player-avatar img{image-rendering:auto}
img[src=""],img:not([src]){display:none}

/* RESPONSIVE */
@media(max-width:1100px){header{padding:10px 18px}.hero{grid-template-columns:1fr}.hero-side{min-height:240px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.player-header{grid-template-columns:.85fr 1.15fr}}
@media(max-width:760px){
  header{min-height:64px;gap:12px;padding:9px 13px}.logo{font-size:25px}.logo:before{height:22px;width:7px}nav{overflow:auto;justify-content:flex-start;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;padding:8px 9px;font-size:9px}.head-right{display:none}
  main{padding:22px 13px 65px}.ticker{height:34px}.ticker:before{font-size:8px;padding:0 10px}.ticker-track{font-size:9px}
  .hero-main{min-height:330px;padding:27px}.hero-main h1{font-size:56px}.hero-main p{font-size:12px}.section{margin-top:30px}.section-head{align-items:flex-start}.section-head h2{font-size:28px}
  .grid,.grid.two{grid-template-columns:1fr}.teams{grid-template-columns:1fr 58px 1fr;padding:20px 10px}.team{font-size:18px}.team img{width:40px;height:40px}.score{font-size:28px}
  .player-header{grid-template-columns:1fr;min-height:0}.player-avatar{min-height:360px;height:360px}.profile-meta{padding:30px 25px 35px}.profile-meta h1{font-size:64px}.profile-meta:before{top:35px;height:90px}.kpis{grid-template-columns:1fr 1fr}.team-header{padding:22px;gap:16px}.team-header img{width:75px;height:75px}.team-header h1{font-size:45px}.match-hero .team{font-size:20px}.match-hero .score{font-size:48px}.form-grid,.form-grid.three{grid-template-columns:1fr}
}
@media(max-width:430px){.hero-main h1{font-size:48px}.hero-main:before{font-size:190px}.player-avatar{height:300px;min-height:300px}.profile-meta h1{font-size:54px}.kpi{padding:13px}.kpi strong{font-size:27px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
<button class="logo" onclick="showPage('home',this)">MEFCO <span>WATCH</span></button>
<nav id="nav"><button class="active" data-page="home" onclick="showPage('home',this)">Home</button><button data-page="scores" onclick="showPage('scores',this)">Scores</button><button data-page="news" onclick="showPage('news',this)">News</button><button data-page="competitions" onclick="showPage('competitions',this)">Competitions</button><button data-page="stats" onclick="showPage('stats',this)">Stats</button><button data-page="search" onclick="showPage('search',this)">Search</button><button data-page="admin" onclick="showPage('admin',this)">Admin</button></nav>
<div class="head-right"><button id="notificationButton" class="notif" onclick="enableNotifications()">Enable Notifications</button></div>
</header>

<script>
const SUPABASE_URL="https://qpokxolcdjxtmxrrqlgw.supabase.co";
const SUPABASE_KEY="sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC";
const MATCHES_URL=SUPABASE_URL+"/rest/v1/matches";
const EVENTS_URL=SUPABASE_URL+"/rest/v1/matches-events";
const NEWS_URL=SUPABASE_URL+"/rest/v1/news";
const TEAMS_URL=SUPABASE_URL+"/rest/v1/teams";
const PLAYERS_URL=SUPABASE_URL+"/rest/v1/players";
const COMPETITIONS_URL=SUPABASE_URL+"/rest/v1/competitions";
const NOTIFICATION_API="https://mefco-notifications.drtwelveyt.workers.dev";
let matches=[],news=[],teams=[],players=[],competitions=[],selectedMatchId=null,selectedArticleId=null,selectedCompetition=null,scoreFilter="all",scoreDate=todayISO(),adminLog=[],timer=null,refreshTimer=null,dbOnline=false;
const esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function todayISO(){return new Date().toISOString().slice(0,10)}
function dateObj(s){const [y,m,d]=String(s||todayISO()).split('-').map(Number);return new Date(y,m-1,d)}
function localISO(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function shiftISO(s,n){const d=dateObj(s);d.setDate(d.getDate()+Number(n||0));return localISO(d)}
function fmtDate(s,opts={weekday:'short',month:'short',day:'numeric'}){return new Intl.DateTimeFormat(undefined,opts).format(dateObj(s))}
function fmtTime(t){return t?String(t).slice(0,5):"—"}
function matchDate(m){return m.match_date||m.date||todayISO()}
function matchTime(m){return m.match_time||m.time||"00:00"}
function scoreOf(m){return [Number(m.score_home??m.home_score??0),Number(m.score_away??m.away_score??0)]}
function isLive(m){return String(m.status||'').toLowerCase()==='live'}
function isFinished(m){return String(m.status||'').toLowerCase()==='finished'}
function teamById(id){return teams.find(t=>String(t.id)===String(id))}
function playerById(id){return players.find(p=>String(p.id)===String(id))}
function teamName(id,fallback='Unknown'){let t=teamById(id);return t?.name||t?.short_name||fallback}
function playerImage(p){return p?.photo_url||p?.image_url||p?.photo||p?.image||p?.avatar_url||p?.avatar||p?.picture_url||p?.profile_image||''}
function competitionName(c,fallback='Competition'){return c?.name||c?.title||c?.short_name||c?.competition||fallback}
function competitionById(id){return competitions.find(c=>String(c.id)===String(id))}
function competitionNameForMatch(m){return competitionName(competitionById(m?.competition_id),m?.competition||'MEFCO')}
function teamFlag(t){return t?.flag_url||t?.logo_url||t?.image_url||t?.crest_url||''}
function safeMediaUrl(value){let u=String(value||'').trim();if(!u)return '';try{let x=new URL(u,location.href);return ['http:','https:','data:','blob:'].includes(x.protocol)?x.href:''}catch{return ''}}
function teamDisplayName(m,side){let id=side==='home'?m.home_team_id:m.away_team_id;let fallback=side==='home'?m.home:m.away;return teamName(id,fallback)}
function eventType(e){return String(e.type||e.event_type||'event').toLowerCase()}
function eventPlayer(e){let p=playerById(e.player_id);return p?.short_name||p?.name||e.player_name||e.player||''}
function eventTeam(e){return teamById(e.team_id)?.name||e.team||''}
function showToast(msg){let t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function supabaseFetch(url,options={}){let r=await fetch(url,{...options,headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(options.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function safeLoad(url,params){return supabaseFetch(url+'?'+new URLSearchParams(params||{}))}
async function loadTable(url,params={},fallbackParams={select:'*'}){try{return await safeLoad(url,params)}catch(firstError){if(JSON.stringify(params)===JSON.stringify(fallbackParams))throw firstError;try{return await safeLoad(url,fallbackParams)}catch{return []}}}
async function loadData(){
 const jobs=await Promise.allSettled([
  loadTable(MATCHES_URL,{select:'*',order:'match_date.asc,match_time.asc'}),
  loadTable(NEWS_URL,{select:'*',order:'created_at.desc'}),
  loadTable(TEAMS_URL,{select:'*',order:'name.asc'}),
  loadTable(PLAYERS_URL,{select:'*',order:'name.asc'}),
  loadTable(COMPETITIONS_URL,{select:'*'})
 ]);
 matches=jobs[0].status==='fulfilled'&&Array.isArray(jobs[0].value)?jobs[0].value:[];
 news=jobs[1].status==='fulfilled'&&Array.isArray(jobs[1].value)?jobs[1].value:[];
 teams=jobs[2].status==='fulfilled'&&Array.isArray(jobs[2].value)?jobs[2].value:[];
 players=jobs[3].status==='fulfilled'&&Array.isArray(jobs[3].value)?jobs[3].value:[];
 competitions=jobs[4].status==='fulfilled'&&Array.isArray(jobs[4].value)?jobs[4].value:[];
 teams.sort((a,b)=>teamName(a.id,a.name||a.short_name||'').localeCompare(teamName(b.id,b.name||b.short_name||'')));
 players.sort((a,b)=>String(a.name||a.short_name||'').localeCompare(String(b.name||b.short_name||'')));
 competitions.sort((a,b)=>competitionName(a).localeCompare(competitionName(b)));
 news.sort((a,b)=>new Date(b.created_at||b.published_at||0)-new Date(a.created_at||a.published_at||0));
 dbOnline=jobs[0].status==='fulfilled'&&jobs[2].status==='fulfilled';
 await loadAllEvents();renderAll();
}

async function loadAllEvents(){if(!matches.length)return;try{let data=await loadTable(EVENTS_URL,{select:'*',order:'minute.asc,created_at.asc'});for(const m of matches)m.events=(data||[]).filter(e=>String(e.match_id)===String(m.id))}catch(e){for(const m of matches)m.events=m.events||[];console.warn('MEFCO events load:',e)}}
function showPage(id,button=null){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));let p=document.getElementById(id);if(p)p.classList.add('active');document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));if(button)button.classList.add('active');window.scrollTo({top:0,behavior:'smooth'});({home:renderHome,scores:renderScores,news:renderNews,competitions:renderCompetitions,stats:renderStats,search:renderSearch,admin:renderAdmin}[id]||(()=>{}))()}
function navFor(page){let b=document.querySelector('#nav button[data-page="'+page+'"]');showPage(page,b)}
function renderAll(){renderHome();renderScores();renderNews();renderCompetitions();renderStats();renderSearch();renderAdmin();renderTicker();if(selectedMatchId)renderMatch();}
function renderTicker(){let live=matches.filter(isLive),finished=matches.filter(isFinished).slice(-4);let items=[...live.map(m=>`<b>LIVE</b> ${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}`),...finished.map(m=>`${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}`)];document.getElementById('tickerTrack').innerHTML=items.length?items.join(' &nbsp; • &nbsp; '):'MEFCO Watch • No live matches right now • Follow the latest fixtures and results';}
function matchCard(m){let [a,b]=scoreOf(m),live=isLive(m),ht=teamById(m.home_team_id),at=teamById(m.away_team_id);return `<article class="card match-card ${live?'live':''}"><div class="match-top"><span class="competition-label">${esc(competitionNameForMatch(m))}</span>${live?'<span class="live-dot">● LIVE</span>':`<span class="status">${isFinished(m)?'FT':fmtTime(matchTime(m))}</span>`}</div><div class="teams"><div class="team">${ht&&teamFlag(ht)?`<img src="${esc(teamFlag(ht))}" alt="">`:''}<div>${esc(teamDisplayName(m,'home'))}</div></div><div><div class="score">${isFinished(m)||live?a+'–'+b:'VS'}</div>${live?`<div class="status">${Number(m.minute||0)}${m.stoppage?`+${m.stoppage}`:''}'</div>`:''}</div><div class="team">${at&&teamFlag(at)?`<img src="${esc(teamFlag(at))}" alt="">`:''}<div>${esc(teamDisplayName(m,'away'))}</div></div></div><div class="match-bottom"><span class="muted">${fmtDate(matchDate(m),{month:'short',day:'numeric'})}${m.venue?' • '+esc(m.venue):''}</span><div class="actions"><button class="btn small" onclick="openMatch('${esc(m.id)}')">Match Centre</button>${ADMIN_MODE?`<button class="btn small" onclick="openMatchEditor('${esc(m.id)}')">Edit</button>`:''}</div></div></article>`}

function renderHome(){let el=document.getElementById('home');let today=matches.filter(m=>matchDate(m)===todayISO()).sort((a,b)=>matchTime(a).localeCompare(matchTime(b)));let live=matches.filter(isLive);let latest=[...news].slice(0,3);el.innerHTML=`<div class="hero"><div class="hero-main"><div class="eyebrow">MEFCO Watch</div><h1>The football feed, built around MEFCO.</h1><p>Live scores, national teams, competitions, match centres, news and player statistics — connected directly to MEFCO data.</p><div class="actions" style="margin-top:18px"><button class="btn primary" onclick="navFor('scores')">View Scores</button><button class="btn" onclick="navFor('competitions')">Explore Competitions</button></div></div><div class="card hero-side"><div class="eyebrow">System status</div><h3>${dbOnline?'Live database connected':'Database connection limited'}</h3><div class="mini-grid"><div class="mini-stat"><strong>${matches.length}</strong><span>Matches</span></div><div class="mini-stat"><strong>${teams.length}</strong><span>Teams</span></div><div class="mini-stat"><strong>${players.length}</strong><span>Players</span></div><div class="mini-stat"><strong>${live.length}</strong><span>Live now</span></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="refreshData()"><span class="db-dot ${dbOnline?'ok':''}"></span> Refresh data</button></div></div><div class="section"><div class="section-head"><div><h2>${live.length?'Live now':'Today'}</h2><p>${live.length?'Matches currently in progress.':fmtDate(todayISO())}</p></div><button class="ghost" onclick="navFor('scores')">All scores →</button></div>${(live.length?live:today).length?`<div class="grid">${(live.length?live:today).slice(0,6).map(matchCard).join('')}</div>`:'<div class="empty">No matches scheduled for today.</div>'}</div><div class="section"><div class="section-head"><div><h2>Latest news</h2><p>Stories from the MEFCO world.</p></div><button class="ghost" onclick="navFor('news')">All news →</button></div>${latest.length?`<div class="grid">${latest.map(newsCard).join('')}</div>`:'<div class="empty">No articles yet.</div>'}</div>`}
function newsCard(n){let image=safeMediaUrl(n.image_url||n.cover_url||n.hero_image||n.thumbnail_url||n.image||'');return `<article class="card news-card">${image?`<div class="news-image"><img src="${esc(image)}" alt="" loading="lazy" onerror="this.closest('.news-image')?.remove()"></div>`:''}<div class="news-body"><div class="date">${esc(formatNewsDate(n))}</div><h3>${esc(n.title||'Untitled article')}</h3><p>${esc(n.excerpt||n.summary||String(n.body||'').slice(0,150))}</p><button class="btn small" style="margin-top:13px" onclick="openArticle('${esc(n.id)}')">Read article</button></div></article>`}
function formatNewsDate(n){return n.created_at?new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(new Date(n.created_at)):''}
function renderScores(){let el=document.getElementById('scores');let list=matches.filter(m=>matchDate(m)===scoreDate);if(scoreFilter==='live')list=list.filter(isLive);if(scoreFilter==='favorites')list=list.filter(m=>m.favorite);list.sort((a,b)=>matchTime(a).localeCompare(matchTime(b)));el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Scores</div><h2>${fmtDate(scoreDate,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}</h2><p>${list.length} match${list.length===1?'':'es'} on this date</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div><div class="toolbar"><button class="btn filter ${scoreFilter==='all'?'active':''}" onclick="setScoreFilter('all')">All</button><button class="btn filter ${scoreFilter==='live'?'active':''}" onclick="setScoreFilter('live')">Live</button><button class="btn filter ${scoreFilter==='favorites'?'active':''}" onclick="setScoreFilter('favorites')">Favorites</button><div class="date-nav"><button class="btn" aria-label="Previous day" onclick="changeScoreDate(-1)">← Previous</button><div class="date-control"><input id="scoreDatePicker" class="input" type="date" value="${esc(scoreDate)}" aria-label="Choose scores date" onchange="jumpScoreDate(this.value)"><button class="btn" onclick="goToToday()">Today</button></div><button class="btn" aria-label="Next day" onclick="changeScoreDate(1)">Next →</button></div></div>${list.length?`<div class="grid">${list.map(matchCard).join('')}</div>`:'<div class="empty"><strong>No matches on this date.</strong><br><span>Use the date picker or Previous / Next to browse any date.</span></div>'}`}

function renderNews(){document.getElementById('news').innerHTML=`<div class="section-head"><div><div class="eyebrow">News</div><h2>MEFCO newsroom</h2><p>Articles, updates and competition stories.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div>${news.length?`<div class="grid">${news.map(newsCard).join('')}</div>`:'<div class="empty">No news published yet.</div>'}`}
function openArticle(id){selectedArticleId=id;let n=news.find(x=>String(x.id)===String(id));document.getElementById('article-page').innerHTML=n?`<article class="article"><button class="ghost" onclick="navFor('news')">← Back to News</button><div class="eyebrow" style="margin-top:25px">MEFCO News</div><h1>${esc(n.title)}</h1><div class="article-meta">${esc(formatNewsDate(n))}</div><div class="article-body">${esc(n.body||n.content||n.excerpt||'')}</div></article>`:'<div class="empty">Article not found.</div>';showPage('article-page');}
function getCompetitionList(){let map=new Map();for(const c of competitions){let name=competitionName(c);map.set(String(c.id),{...c,name})}for(const m of matches){let name=competitionNameForMatch(m);if(m.competition_id&&!map.has(String(m.competition_id)))map.set(String(m.competition_id),{id:m.competition_id,name});else if(m.competition&&!Array.from(map.values()).some(c=>competitionName(c)===m.competition))map.set('legacy-'+m.competition,{id:null,name:m.competition})}return [...map.values()].sort((a,b)=>competitionName(a).localeCompare(competitionName(b)))}
function renderCompetitions(){let list=getCompetitionList();document.getElementById('competitions').innerHTML=`<div class="section-head"><div><div class="eyebrow">Competitions</div><h2>MEFCO competitions</h2><p>Every tournament and league connected to match data.</p></div><button class="btn" onclick="refreshData()">↻ Refresh</button></div>${list.length?`<div class="grid">${list.map(c=>`<article class="card competition-card"><div class="competition-icon">⚽</div><h3>${esc(c.name)}</h3><p>${esc(c.short_name||c.type||'Competition')} ${c.season?`• ${esc(c.season)}`:''}</p><div class="actions"><button class="btn small" onclick="openCompetition('${esc(c.id||'')}','${esc(c.name)}')">Open competition</button></div></article>`).join('')}</div>`:'<div class="empty">No competitions found.</div>'}`}
function openCompetition(id,name){selectedCompetition={id,name};let ms=matches.filter(m=>String(m.competition_id)===String(id)||(!m.competition_id&&m.competition===name)||m.competition===name);let c=competitions.find(x=>String(x.id)===String(id));document.getElementById('competition-page').innerHTML=`<button class="ghost" onclick="navFor('competitions')">← Competitions</button><div class="card" style="margin-top:14px;padding:24px"><div class="eyebrow">Competition</div><h1>${esc(c?.name||name)}</h1><p class="muted" style="margin-top:7px">${esc(c?.description||'MEFCO national-team competition')}</p><div class="kpis"><div class="kpi"><strong>${c?.teams_count??new Set(ms.flatMap(m=>[m.home_team_id,m.away_team_id].filter(Boolean))).size}</strong><span>Teams</span></div><div class="kpi"><strong>${ms.length}</strong><span>Matches</span></div><div class="kpi"><strong>${ms.filter(isFinished).length}</strong><span>Completed</span></div><div class="kpi"><strong>${ms.filter(isLive).length}</strong><span>Live</span></div></div></div><div class="section"><div class="section-head"><h2>Fixtures & results</h2></div>${ms.length?`<div class="grid">${ms.map(matchCard).join('')}</div>`:'<div class="empty">No matches linked to this competition yet.</div>'}</div>`;showPage('competition-page')}
function collectPlayerStats(){let out={};for(const p of players)out[p.name]={id:p.id,name:p.name,short_name:p.short_name,team:teamName(p.team_id,p.nationality||''),goals:Number(p.goals||0),assists:Number(p.assists||0)};for(const m of matches){for(const e of m.events||[]){let p=eventPlayer(e);if(!p)continue;let id=e.player_id||p;let key=String(id);let db=playerById(id);if(!db){key=p;if(!out[key])out[key]={name:p,short_name:p,team:eventTeam(e),goals:0,assists:0}}else key=db.name;let x=out[key];let t=eventType(e);if(t.includes('goal'))x.goals++;if(t.includes('assist'))x.assists++}}return Object.values(out)}
function renderStats(){let ps=collectPlayerStats().sort((a,b)=>(b.goals-a.goals)||(b.assists-a.assists));document.getElementById('stats').innerHTML=`<div class="section-head"><div><div class="eyebrow">Statistics</div><h2>Player leaders</h2><p>Event-derived where available, with database profiles underneath.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Player</th><th>Team</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${ps.slice(0,50).map((p,i)=>`<tr><td>${i+1}</td><td><button class="ghost" onclick="openPlayer('${esc(p.id||p.name)}')">${esc(p.short_name||p.name)}</button></td><td>${esc(p.team)}</td><td><b>${p.goals}</b></td><td>${p.assists}</td></tr>`).join('')||'<tr><td colspan="5">No player statistics available.</td></tr>'}</tbody></table></div>`}
function renderSearch(){document.getElementById('search').innerHTML=`<div class="section-head"><div><div class="eyebrow">Search</div><h2>Search MEFCO Watch</h2><p>Teams, players, matches, competitions and news.</p></div></div><div class="searchbox"><input id="globalSearch" class="input" placeholder="Search Spain, Yamal, Global Cup…" oninput="runSearch(this.value)"></div><div id="searchResults" class="search-results"></div>`}
function runSearch(q){q=q.trim().toLowerCase();let el=document.getElementById('searchResults');if(!q){el.innerHTML='';return}let r=[];teams.filter(t=>(t.name+' '+(t.short_name||'')+' '+(t.country||'')).toLowerCase().includes(q)).slice(0,8).forEach(t=>r.push({type:'Team',name:t.name,sub:'National team',fn:()=>openTeam(t.id)}));players.filter(p=>(p.name+' '+(p.short_name||'')+' '+(p.nationality||'')).toLowerCase().includes(q)).slice(0,8).forEach(p=>r.push({type:'Player',name:p.name,sub:teamName(p.team_id,p.position||''),fn:()=>openPlayer(p.id)}));getCompetitionList().filter(c=>String(c.name).toLowerCase().includes(q)).slice(0,5).forEach(c=>r.push({type:'Competition',name:c.name,sub:c.season||'Competition',fn:()=>openCompetition(c.id,c.name)}));matches.filter(m=>(teamDisplayName(m,'home')+' '+teamDisplayName(m,'away')+' '+(m.competition||'')).toLowerCase().includes(q)).slice(0,8).forEach(m=>r.push({type:'Match',name:`${teamDisplayName(m,'home')} vs ${teamDisplayName(m,'away')}`,sub:m.competition||'Match',fn:()=>openMatch(m.id)}));news.filter(n=>String(n.title||'').toLowerCase().includes(q)).slice(0,5).forEach(n=>r.push({type:'News',name:n.title,sub:formatNewsDate(n),fn:()=>openArticle(n.id)}));el.innerHTML=r.length?r.map((x,i)=>`<button class="search-result" onclick="searchOpen(${i})"><strong>${esc(x.name)}</strong><span>${esc(x.type)} • ${esc(x.sub)}</span></button>`).join(''):'<div class="empty">No results.</div>';window._searchResults=r}
function searchOpen(i){window._searchResults?.[i]?.fn()}
function openTeam(idOrName){let t=teamById(idOrName)||teams.find(x=>x.name===idOrName);if(!t){t=teams.find(x=>x.short_name===idOrName)}if(!t){document.getElementById('team-page').innerHTML='<div class="empty">Team not found.</div>';showPage('team-page');return}let squad=players.filter(p=>String(p.team_id)===String(t.id));let ms=matches.filter(m=>String(m.home_team_id)===String(t.id)||String(m.away_team_id)===String(t.id));let wins=ms.filter(m=>isFinished(m)&&((String(m.home_team_id)===String(t.id)&&scoreOf(m)[0]>scoreOf(m)[1])||(String(m.away_team_id)===String(t.id)&&scoreOf(m)[1]>scoreOf(m)[0]))).length;document.getElementById('team-page').innerHTML=`<button class="ghost" onclick="navFor('search')">← Back</button><div class="card team-header" style="margin-top:12px">${teamFlag(t)?`<img src="${esc(teamFlag(t))}" alt="">`:'<div class="player-avatar">⚽</div>'}<div class="profile-meta"><div class="eyebrow">National Team</div><h1>${esc(t.name)}</h1><p>${esc(t.country||t.confederation||'MEFCO')}</p></div></div><div class="kpis"><div class="kpi"><strong>${t.overall??'—'}</strong><span>Overall</span></div><div class="kpi"><strong>${t.attack??'—'}</strong><span>Attack</span></div><div class="kpi"><strong>${t.midfield??'—'}</strong><span>Midfield</span></div><div class="kpi"><strong>${t.defence??'—'}</strong><span>Defence</span></div></div><div class="section"><div class="section-head"><h2>Squad</h2><p>${squad.length} players</p></div>${squad.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Player</th><th>Position</th><th>OVR</th><th>Goals</th><th>Assists</th></tr></thead><tbody>${squad.map(p=>`<tr><td><button class="ghost" onclick="openPlayer('${esc(p.id)}')">${esc(p.short_name||p.name)}</button></td><td>${esc(p.position||'—')}</td><td><b>${p.overall??'—'}</b></td><td>${p.goals??0}</td><td>${p.assists??0}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No players linked to this team.</div>'}</div><div class="section"><div class="section-head"><h2>Fixtures</h2><p>${wins} wins in loaded history</p></div>${ms.length?`<div class="grid">${ms.slice(0,12).map(matchCard).join('')}</div>`:'<div class="empty">No fixtures found.</div>'}</div>`;showPage('team-page')}
function openPlayer(idOrName){let p=playerById(idOrName)||players.find(x=>x.name===idOrName);if(!p){document.getElementById('player-page').innerHTML='<div class="empty">Player not found.</div>';showPage('player-page');return}let derived=collectPlayerStats().find(x=>String(x.id)===String(p.id)||x.name===p.name);let photo=safeMediaUrl(playerImage(p));let initials=esc((p.short_name||p.name||'?').slice(0,1));let portrait=photo?`<img src="${esc(photo)}" alt="${esc(p.name)}" loading="eager" referrerpolicy="no-referrer" onerror="this.remove();this.parentElement?.classList.remove('has-photo')">`:'';document.getElementById('player-page').innerHTML=`<button class="ghost" onclick="navFor('stats')">← Stats</button><div class="card player-header" style="margin-top:12px"><div class="player-avatar ${photo?'has-photo':''}">${portrait}<span class="player-initial">${initials}</span></div><div class="profile-meta"><div class="eyebrow">Player</div><h1>${esc(p.name)}</h1><p>${esc(teamName(p.team_id,p.nationality||'Free'))} • ${esc(p.position||'Position not set')}</p></div></div><div class="kpis"><div class="kpi"><strong>${p.overall??'—'}</strong><span>OVR</span></div><div class="kpi"><strong>${p.form??'—'}</strong><span>Form</span></div><div class="kpi"><strong>${p.morale??'—'}</strong><span>Morale</span></div><div class="kpi"><strong>${derived?.goals??p.goals??0}</strong><span>Goals</span></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="eyebrow">Profile</div><div class="table-wrap" style="margin-top:10px"><table class="table"><tbody><tr><td>Short name</td><td>${esc(p.short_name||p.name)}</td></tr><tr><td>Nationality</td><td>${esc(p.nationality||'—')}</td></tr><tr><td>Second nationality</td><td>${esc(p.second_nationality||'—')}</td></tr><tr><td>Position</td><td>${esc(p.position||'—')}</td></tr><tr><td>Preferred foot</td><td>${esc(p.preferred_foot||'—')}</td></tr></tbody></table></div></div><div class="card" style="padding:20px"><div class="eyebrow">Statistics</div><div class="kpis"><div class="kpi"><strong>${p.appearances??0}</strong><span>Apps</span></div><div class="kpi"><strong>${derived?.goals??p.goals??0}</strong><span>Goals</span></div><div class="kpi"><strong>${derived?.assists??p.assists??0}</strong><span>Assists</span></div><div class="kpi"><strong>${p.minutes??0}</strong><span>Minutes</span></div></div></div></div>`;showPage('player-page')}
function openMatch(id){selectedMatchId=id;renderMatch();showPage('match-page')}
function eventIcon(type){const t=eventType({type});return t==='goal'?'⚽':t==='assist'?'A':t==='yellow'?'Y':t==='red'?'R':t==='substitution'?'↕':t==='var'?'V':'•'}
function renderMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));let el=document.getElementById('match-page');if(!m){el.innerHTML='<div class="empty">Match not found.</div>';return}let [a,b]=scoreOf(m),events=[...(m.events||[])].sort((x,y)=>(Number(x.minute||0)-Number(y.minute||0))||(Number(x.stoppage||0)-Number(y.stoppage||0)));let ht=teamById(m.home_team_id),at=teamById(m.away_team_id);let status=isLive(m)?`LIVE • ${Number(m.minute||0)}${m.stoppage?`+${m.stoppage}`:''}'`:isFinished(m)?'FULL TIME':String(m.status||'SCHEDULED').toUpperCase();el.innerHTML=`<div class="match-centre-bar"><button class="ghost" onclick="navFor('scores')">← Scores</button>${ADMIN_MODE?`<button class="btn" onclick="openMatchEditor('${esc(m.id)}')">Edit match</button>`:''}</div><div class="card match-hero"><div class="eyebrow">${esc(competitionNameForMatch(m))}</div><div class="muted">${fmtDate(matchDate(m),{weekday:'long',month:'long',day:'numeric',year:'numeric'})} • ${fmtTime(matchTime(m))}</div><div class="match-status-row"><span class="pill ${isLive(m)?'live':isFinished(m)?'done':''}">${esc(status)}</span>${m.venue?`<span class="pill">${esc(m.venue)}</span>`:''}</div><div class="scoreboard"><div class="score-team">${ht&&teamFlag(ht)?`<img class="team-crest" src="${esc(teamFlag(ht))}" alt="">`:''}<div class="score-team-name">${esc(teamDisplayName(m,'home'))}</div></div><div class="score-main"><div class="big-score">${isFinished(m)||isLive(m)?a+'–'+b:'VS'}</div><div class="status">${isLive(m)?Number(m.minute||0)+"'":status}</div></div><div class="score-team">${at&&teamFlag(at)?`<img class="team-crest" src="${esc(teamFlag(at))}" alt="">`:''}<div class="score-team-name">${esc(teamDisplayName(m,'away'))}</div></div></div><div class="match-meta-grid"><div class="match-meta"><strong>${esc(fmtTime(matchTime(m)))}</strong><span>Kickoff</span></div><div class="match-meta"><strong>${esc(m.venue||'—')}</strong><span>Venue</span></div><div class="match-meta"><strong>${esc(m.city||'—')}</strong><span>City</span></div></div></div><div class="section grid two"><div class="card" style="padding:20px"><div class="section-head"><div><div class="eyebrow">Match events</div><h2>Timeline</h2></div><span class="muted">${events.length} event${events.length===1?'':'s'}</span></div>${events.length?`<div class="event-list">${events.map(e=>`<div class="event-row"><div class="event-minute">${Number(e.minute||0)}${e.stoppage?`+${e.stoppage}`:''}'</div><div class="event-icon">${eventIcon(e.type)}</div><div class="event-copy"><strong>${esc(eventPlayer(e)||eventTeam(e)||'Match event')}</strong><span>${esc(eventType(e))}${e.detail?' • '+esc(e.detail):''}</span></div><div class="event-side">${esc(eventTeam(e))}</div></div>`).join('')}</div>`:'<div class="empty">No events recorded yet.</div>'}</div><div class="card" style="padding:20px"><div class="section-head"><div><div class="eyebrow">Details</div><h2>Match information</h2></div></div><div class="table-wrap"><table class="table"><tbody><tr><td>Status</td><td>${esc(m.status||'scheduled')}</td></tr><tr><td>Competition</td><td>${esc(competitionNameForMatch(m)||'—')}</td></tr><tr><td>Kickoff</td><td>${esc(fmtTime(matchTime(m)))}</td></tr><tr><td>Venue</td><td>${esc(m.venue||'—')}</td></tr><tr><td>City</td><td>${esc(m.city||'—')}</td></tr><tr><td>Home rating</td><td>${ht?.overall??'—'}</td></tr><tr><td>Away rating</td><td>${at?.overall??'—'}</td></tr></tbody></table></div></div></div>`}

function renderAdmin(){let el=document.getElementById('admin');el.innerHTML=`<div class="section-head"><div><div class="eyebrow">Admin</div><h2>Match control room</h2><p>Manage fixtures, live scores, events and notifications.</p></div><button class="btn" onclick="refreshData()">↻ Reload database</button></div><div class="admin-layout"><div class="card admin-list"><h3 style="margin-bottom:12px">Matches</h3>${matches.length?matches.map(m=>`<button class="btn small" onclick="selectAdminMatch('${esc(m.id)}')">${esc(teamDisplayName(m,'home'))} ${scoreOf(m)[0]}–${scoreOf(m)[1]} ${esc(teamDisplayName(m,'away'))}<br><span class="muted">${fmtDate(matchDate(m),{month:'short',day:'numeric'})}</span></button>`).join(''):'<div class="empty">No matches.</div>'}<hr style="border-color:#202936;margin:12px 0"><button class="btn primary" onclick="showCreateMatch()">+ Create match</button></div><div id="adminPanel" class="card admin-panel"><div class="empty">Select a match to control it.</div></div></div>`;if(selectedMatchId)renderAdminPanel()}
function selectAdminMatch(id){selectedMatchId=id;renderAdminPanel()}
function renderAdminPanel(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));let el=document.getElementById('adminPanel');if(!m)return;let a=scoreOf(m);let compList=getCompetitionList();el.innerHTML=`<div class="admin-editor"><div class="row"><div><div class="eyebrow">Match editor</div><h2>${esc(teamDisplayName(m,'home'))} vs ${esc(teamDisplayName(m,'away'))}</h2><span class="save-state">ID ${esc(m.id)}</span></div><span class="pill ${isLive(m)?'live':isFinished(m)?'done':''}">${esc(m.status||'scheduled')}</span></div><div class="admin-section"><div class="admin-section-title"><h3>Fixture</h3><span>Teams, competition and location</span></div><div class="form-grid three"><label>Competition<select id="admCompetition" class="select"><option value="">No competition</option>${compList.map(c=>`<option value="${esc(c.id)}" ${String(c.id)===String(m.competition_id)?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Home team<select id="admHomeTeam" class="select">${teams.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(m.home_team_id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Away team<select id="admAwayTeam" class="select">${teams.map(t=>`<option value="${esc(t.id)}" ${String(t.id)===String(m.away_team_id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><label>Date<input id="admDate" class="input" type="date" value="${esc(matchDate(m))}"></label><label>Kickoff<input id="admTime" class="input" type="time" value="${esc(fmtTime(matchTime(m)))}"></label><label>Status<select id="admStatus" class="select"><option value="scheduled" ${m.status==='scheduled'?'selected':''}>Scheduled</option><option value="live" ${m.status==='live'?'selected':''}>Live</option><option value="halftime" ${m.status==='halftime'?'selected':''}>Half time</option><option value="finished" ${m.status==='finished'?'selected':''}>Finished</option><option value="postponed" ${m.status==='postponed'?'selected':''}>Postponed</option><option value="cancelled" ${m.status==='cancelled'?'selected':''}>Cancelled</option><option value="abandoned" ${m.status==='abandoned'?'selected':''}>Abandoned</option></select></label><label>Venue<input id="admVenue" class="input" value="${esc(m.venue||'')}"></label><label>City<input id="admCity" class="input" value="${esc(m.city||'')}"></label><label>Round / matchday<input id="admRound" class="input" value="${esc(m.round||m.matchday||'')}"></label></div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="saveAdminMatch()">Save fixture</button><button class="btn" onclick="openMatch('${esc(m.id)}')">View Match Centre</button></div></div><div class="admin-section"><div class="admin-section-title"><h3>Score & clock</h3><span>Live match control</span></div><div class="form-grid three"><label>Home score<input id="admHomeScore" class="input" type="number" value="${a[0]}" min="0"></label><label>Away score<input id="admAwayScore" class="input" type="number" value="${a[1]}" min="0"></label><label>Minute<input id="admMinute" class="input" type="number" value="${m.minute||0}" min="0"></label><label>Stoppage<input id="admStoppage" class="input" type="number" value="${m.stoppage||0}" min="0"></label></div><div class="actions" style="margin-top:13px"><button class="btn primary" onclick="saveScoreOnly()">Save score</button><button class="btn" onclick="startSelected()">▶ Start / Resume</button><button class="btn" onclick="pauseSelected()">Ⅱ Pause</button><button class="btn danger" onclick="finishSelected()">■ Finish</button></div></div><div class="admin-section"><div class="admin-section-title"><div><h3>Add match event</h3><div class="assist-hint">Assist is a separate event and has its own player selector.</div></div><span>Timeline</span></div><div class="form-grid three"><label>Team<select id="eventTeamSelect" class="select" onchange="refreshEventPlayers()"><option value="">Select team</option>${[m.home_team_id,m.away_team_id].filter(Boolean).map(id=>`<option value="${esc(id)}">${esc(teamName(id))}</option>`).join('')}</select></label><label>Player<select id="eventPlayerSelect" class="select"><option value="">Select player</option></select></label><label>Type<select id="eventType" class="select"><option value="goal">Goal</option><option value="assist">Assist</option><option value="yellow">Yellow card</option><option value="red">Red card</option><option value="substitution">Substitution</option><option value="var">VAR</option><option value="other">Other</option></select></label><label>Minute<input id="eventMinute" class="input" type="number" value="${m.minute||0}" min="0"></label><label>Stoppage<input id="eventStoppage" class="input" type="number" value="0" min="0"></label><label>Detail<input id="eventDetail" class="input" placeholder="Optional detail"></label></div><div class="quick-events" style="margin-top:12px"><button class="btn quick-event" onclick="quickEvent('goal')">⚽ Goal</button><button class="btn quick-event" onclick="quickEvent('assist')">A Assist</button><button class="btn quick-event" onclick="quickEvent('yellow')">Y Yellow</button><button class="btn quick-event" onclick="quickEvent('red')">R Red</button><button class="btn quick-event" onclick="quickEvent('substitution')">↕ Substitution</button></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="addEvent()">Add selected event</button></div></div><div class="admin-section"><div class="admin-section-title"><h3>Recent events</h3><span>${(m.events||[]).length} total</span></div><div class="log">${(m.events||[]).slice().sort((x,y)=>Number(y.minute||0)-Number(x.minute||0)).slice(0,12).map(e=>`<div class="log-item">${esc(e.minute||0)}${e.stoppage?`+${esc(e.stoppage)}`:''}' • ${esc(eventType(e))} • ${esc(eventPlayer(e)||e.team||'Event')}</div>`).join('')||'<div class="muted">No events.</div>'}</div></div></div>`;}

function refreshEventPlayers(){let teamId=document.getElementById('eventTeamSelect')?.value,sel=document.getElementById('eventPlayerSelect');if(!sel)return;let ps=players.filter(p=>String(p.team_id)===String(teamId));sel.innerHTML='<option value="">No player / team event</option>'+ps.map(p=>`<option value="${esc(p.id)}">${esc(p.short_name||p.name)}</option>`).join('')}
async function updateMatch(id,changes){let m=matches.find(x=>String(x.id)===String(id));if(!m)return false;let previous={};for(const k of Object.keys(changes))previous[k]=m[k];try{await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(changes)});Object.assign(m,changes);addLog(`Updated match ${id}`);showToast('Match saved');renderAll();return true}catch(e){console.error(e);Object.assign(m,previous);showToast('Could not save match');return false}}
function matchPatchValue(m,key,value){return Object.prototype.hasOwnProperty.call(m,key)?value:undefined}
async function saveAdminMatch(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let home=teamById(document.getElementById('admHomeTeam').value),away=teamById(document.getElementById('admAwayTeam').value);if(!home||!away||String(home.id)===String(away.id)){showToast('Choose two different teams');return}let cs=document.getElementById('admCompetition'),changes={home_team_id:home.id,away_team_id:away.id,home:home.name,away:away.name,match_date:document.getElementById('admDate').value,match_time:document.getElementById('admTime').value,status:document.getElementById('admStatus').value,competition_id:cs.value||null,competition:cs.options[cs.selectedIndex]?.textContent||''};const optional={venue:document.getElementById('admVenue').value.trim(),city:document.getElementById('admCity').value.trim(),round:document.getElementById('admRound').value.trim(),matchday:document.getElementById('admRound').value.trim()};for(const [k,v] of Object.entries(optional)){if(Object.prototype.hasOwnProperty.call(m,k))changes[k]=v}let hflag=teamFlag(home),aflag=teamFlag(away);if(Object.prototype.hasOwnProperty.call(m,'home_flag'))changes.home_flag=hflag;if(Object.prototype.hasOwnProperty.call(m,'away_flag'))changes.away_flag=aflag;await updateMatch(m.id,changes)}
async function saveScoreOnly(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;await updateMatch(m.id,{score_home:Math.max(0,Number(document.getElementById('admHomeScore').value)||0),score_away:Math.max(0,Number(document.getElementById('admAwayScore').value)||0),minute:Math.max(0,Number(document.getElementById('admMinute').value)||0),stoppage:Math.max(0,Number(document.getElementById('admStoppage').value)||0)})}
async function startSelected(){let ok=await updateMatch(selectedMatchId,{status:'live'});if(ok)startTimer()}
async function pauseSelected(){let ok=await updateMatch(selectedMatchId,{status:'halftime'});if(ok)stopTimer()}
async function finishSelected(){let ok=await updateMatch(selectedMatchId,{status:'finished'});if(ok)stopTimer()}
function startTimer(){stopTimer();timer=setInterval(async()=>{let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m||!isLive(m))return;let minute=Number(m.minute||0)+1;try{await supabaseFetch(MATCHES_URL+'?id=eq.'+encodeURIComponent(m.id),{method:'PATCH',body:JSON.stringify({minute})});m.minute=minute;renderAdminPanel();renderTicker();if(selectedMatchId)renderMatch()}catch(e){console.warn('Clock update failed',e)}},60000)}function stopTimer(){if(timer)clearInterval(timer);timer=null}
async function addEvent(){let m=matches.find(x=>String(x.id)===String(selectedMatchId));if(!m)return;let teamId=document.getElementById('eventTeamSelect').value,playerId=document.getElementById('eventPlayerSelect').value||null,type=document.getElementById('eventType').value;if(teamId&&![String(m.home_team_id),String(m.away_team_id)].includes(String(teamId))){showToast('Event team must be one of the match teams');return}if((type==='goal'||type==='assist'||type==='yellow'||type==='red'||type==='substitution')&&!playerId){showToast('Select a player for this event');return}let p=playerById(playerId);let event={match_id:m.id,minute:Math.max(0,Number(document.getElementById('eventMinute').value)||Number(m.minute)||0),stoppage:Math.max(0,Number(document.getElementById('eventStoppage').value)||0),type,player_id:playerId,team_id:teamId||null,player:p?.name||'',team:teamName(teamId,''),detail:document.getElementById('eventDetail').value.trim()};try{let result;try{result=await supabaseFetch(EVENTS_URL,{method:'POST',body:JSON.stringify(event)})}catch(first){let legacy={...event};delete legacy.player_id;delete legacy.team_id;result=await supabaseFetch(EVENTS_URL,{method:'POST',body:JSON.stringify(legacy)})}m.events=m.events||[];m.events.push(Array.isArray(result)?result[0]:result);if(type==='goal'&&teamId){let changes=String(teamId)===String(m.home_team_id)?{score_home:Number(m.score_home||0)+1}:{score_away:Number(m.score_away||0)+1};await updateMatch(m.id,changes)}else{renderAll();showToast(type==='assist'?'Assist added':'Event added')}}catch(e){console.error(e);showToast('Could not add event — check the matches-events columns')}}
function quickEvent(type){let s=document.getElementById('eventType');if(s)s.value=type;document.getElementById('eventPlayerSelect')?.focus();showToast(type==='assist'?'Select the assisting player, then press Add selected event.':`Select the player for ${type}, then press Add selected event.`)}
function openMatchEditor(id){if(!ADMIN_MODE){showToast('Admin mode is required');return}selectedMatchId=id;showPage('admin');renderAdminPanel()}

function showCreateMatch(){let el=document.getElementById('adminPanel');el.innerHTML=`<div class="eyebrow">New match</div><h2>Create fixture</h2><div class="form-grid" style="margin-top:15px"><label>Competition<select id="createCompetition" class="select"><option value="">Select competition</option>${getCompetitionList().map(c=>`<option value="${esc(c.id||c.name)}" data-name="${esc(c.name)}">${esc(c.name)}</option>`).join('')}</select></label><label>Date<input id="createDate" class="input" type="date" value="${todayISO()}"></label><label>Kickoff<input id="createKickoff" class="input" type="time" value="20:00"></label><label>Home team<select id="createHomeTeam" class="select" onchange="fillCreateFlags()"><option value="">Select home team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Away team<select id="createAwayTeam" class="select" onchange="fillCreateFlags()"><option value="">Select away team</option>${teams.map(t=>`<option value="${esc(t.id)}">${esc(t.name)}</option>`).join('')}</select></label><label>Home flag URL<input id="createHomeFlag" class="input"></label><label>Away flag URL<input id="createAwayFlag" class="input"></label></div><div class="actions" style="margin-top:14px"><button class="btn primary" onclick="createMatch()">Create Match</button></div>`}
function fillCreateFlags(){let h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(h)document.getElementById('createHomeFlag').value=h.flag_url||h.logo_url||'';if(a)document.getElementById('createAwayFlag').value=a.flag_url||a.logo_url||''}
async function createMatch(){let cs=document.getElementById('createCompetition'),h=teamById(document.getElementById('createHomeTeam').value),a=teamById(document.getElementById('createAwayTeam').value);if(!h||!a){showToast('Select both teams');return}let c=cs.options[cs.selectedIndex],name=c?.dataset.name||c?.textContent||'';let match={competition:name,competition_id:cs.value&&!String(cs.value).startsWith('legacy-')?cs.value:null,home:h.name,away:a.name,home_team_id:h.id,away_team_id:a.id,match_date:document.getElementById('createDate').value,match_time:document.getElementById('createKickoff').value,home_flag:document.getElementById('createHomeFlag').value.trim(),away_flag:document.getElementById('createAwayFlag').value.trim(),status:'scheduled',minute:0,score_home:0,score_away:0,stoppage:0,favorite:false};try{let result=await supabaseFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(match)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created');renderAll()}catch(e){let fallback={...match};delete fallback.competition_id;delete fallback.home_team_id;delete fallback.away_team_id;try{let result=await supabaseFetch(MATCHES_URL,{method:'POST',body:JSON.stringify(fallback)});matches.push(Array.isArray(result)?result[0]:result);showToast('Match created with legacy fields');renderAll()}catch(err){console.error(err);showToast('Could not create match')}}}
async function toggleFavorite(id){let m=matches.find(x=>String(x.id)===String(id));if(!m)return;await updateMatch(id,{favorite:!m.favorite})}
async function refreshData(){showToast('Refreshing MEFCO data…');try{await loadData();showToast('Data refreshed')}catch(e){console.error(e);showToast('Data refresh failed')}}
function startAutoRefresh(){if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadData()},30000)}
async function enableNotifications(){if(!('Notification'in window)){showToast('Notifications are not supported here');return}let p=await Notification.requestPermission();document.getElementById('notificationButton').textContent=p==='granted'?'Notifications Enabled':p==='denied'?'Notifications Blocked':'Enable Notifications';showToast(p==='granted'?'Notifications enabled':'Notification permission not granted')}
async function sendNotification(title,body,url='/'){try{let r=await fetch(NOTIFICATION_API+'/api/notify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,body,url})});if(!r.ok)throw new Error(await r.text());showToast('Notification sent')}catch(e){showToast('Notification service unavailable')}}
function addLog(msg){adminLog.unshift({time:new Date().toLocaleTimeString(),msg});if(adminLog.length>50)adminLog.pop()}
window.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();navFor('search');setTimeout(()=>document.getElementById('globalSearch')?.focus(),50)}if(e.key.toLowerCase()==='r'&&e.ctrlKey){e.preventDefault();refreshData()}});
window.addEventListener('focus',()=>{if(document.visibilityState==='visible')renderTicker()});
loadData().then(startAutoRefresh).catch(e=>{console.error('MEFCO startup:',e);showToast('MEFCO could not load data')});
</script>
</body>

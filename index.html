<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070a0f">
<meta name="description" content="MEFCO Watch — live football scores, national teams, competitions, news and statistics.">
<title>MEFCO Watch</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap');

:root{
  --bg:#050607;
  --bg2:#080b0e;
  --panel:#0b0f12;
  --panel2:#10151a;
  --panel3:#151b21;
  --line:rgba(255,255,255,.085);
  --line2:rgba(255,255,255,.14);
  --text:#f7f8f5;
  --muted:#89939b;
  --soft:#b7c0c5;
  --green:#b7ff2a;
  --green2:#76d900;
  --cyan:#63e6ff;
  --red:#ff5364;
  --amber:#ffd166;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 25px 80px rgba(0,0,0,.45);
  --shadow2:0 12px 40px rgba(0,0,0,.3);
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{
  min-height:100vh;
  color:var(--text);
  font-family:"DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 8% 0%,rgba(183,255,42,.08),transparent 23rem),
    radial-gradient(circle at 96% 12%,rgba(99,230,255,.055),transparent 27rem),
    linear-gradient(180deg,#080a0c 0,#050607 55%,#07090b 100%);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.26;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:42px 42px;
  mask-image:linear-gradient(to bottom,#000,transparent 78%);
}
body:after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.025;
  background:repeating-linear-gradient(0deg,#fff 0,#fff 1px,transparent 1px,transparent 4px);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.app{min-height:100vh}

/* HEADER / BROADCAST NAV */
header{
  position:sticky;top:0;z-index:30;min-height:76px;padding:11px 30px;
  display:flex;align-items:center;gap:24px;
  background:rgba(5,6,7,.78);border-bottom:1px solid var(--line);
  backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);
}
header:before{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),var(--cyan),transparent);
  opacity:.65
}
.logo{
  position:relative;display:flex;align-items:center;gap:9px;flex:0 0 auto;padding:5px 0;
  border:0;background:none;color:#fff;font-family:"Barlow Condensed",sans-serif;
  font-size:31px;font-weight:900;letter-spacing:-1.2px;text-transform:uppercase;
}
.logo:before{
  content:"";width:9px;height:27px;background:var(--green);
  transform:skewX(-15deg);box-shadow:0 0 20px rgba(183,255,42,.45)
}
.logo span{color:var(--green)}
nav{display:flex;align-items:center;justify-content:center;gap:5px;flex:1}
nav button,.ghost{
  position:relative;border:1px solid transparent;background:transparent;color:#7f898f;
  padding:10px 13px;border-radius:11px;font-size:11px;font-weight:800;
  letter-spacing:.7px;text-transform:uppercase;transition:.22s ease;
}
nav button:after{
  content:"";position:absolute;left:12px;right:12px;bottom:4px;height:2px;
  background:var(--green);transform:scaleX(0);transform-origin:center;transition:.22s
}
nav button:hover,.ghost:hover{color:#fff;background:rgba(255,255,255,.045);border-color:var(--line)}
nav button.active{color:#fff;background:rgba(183,255,42,.075);border-color:rgba(183,255,42,.16)}
nav button.active:after{transform:scaleX(1)}
.head-right{display:flex;align-items:center;gap:8px}
.notif{
  position:relative;overflow:hidden;border:1px solid var(--line2);background:#0b0f12;
  color:#e8eeeb;padding:9px 12px;border-radius:11px;font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.55px;transition:.2s;isolation:isolate;box-sizing:border-box
}
.notif:before{
  content:"";position:absolute;left:4px;top:4px;bottom:4px;width:58%;
  background:linear-gradient(90deg,rgba(183,255,42,.18) 0%,rgba(183,255,42,.28) 68%,rgba(183,255,42,.1) 100%);
  clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);
  -webkit-clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);
  z-index:-1;pointer-events:none
}
.notif:hover{border-color:rgba(183,255,42,.5);box-shadow:0 0 25px rgba(183,255,42,.1)}

/* TICKER */
.ticker{
  height:38px;display:flex;align-items:center;overflow:hidden;background:#090c0e;
  border-bottom:1px solid var(--line);box-shadow:0 10px 35px rgba(0,0,0,.2)
}
.ticker:before{
  content:"LIVE FEED";height:100%;display:flex;align-items:center;padding:0 15px;
  background:var(--green);color:#050607;font-size:10px;font-weight:1000;
  letter-spacing:1px;position:relative;z-index:2
}
.ticker-track{
  white-space:nowrap;animation:scroll 40s linear infinite;padding-left:25px;
  color:#a4adb2;font-size:10px;font-weight:700;letter-spacing:.2px
}
.ticker b{color:var(--green);font-weight:1000}
@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}

/* PAGE */
main{width:min(1560px,100%);margin:auto;padding:36px 30px 90px}
.page{display:none;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both}
.page.active{display:block}
@keyframes pageIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* UNIVERSAL CARDS */
.card,.hero-main{
  position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));box-shadow:var(--shadow2)
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.045),transparent 28%,transparent 72%,rgba(255,255,255,.018));
  opacity:.7
}
.card:hover{
  border-color:rgba(255,255,255,.15);box-shadow:0 18px 60px rgba(0,0,0,.42);
  transform:translateY(-2px)
}
.card{transition:border-color .22s,box-shadow .22s,transform .22s}
.section{margin-top:42px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:16px}
.section-head h2,h2{
  font-family:"Barlow Condensed",sans-serif;font-size:32px;line-height:.95;
  letter-spacing:-.5px;text-transform:uppercase
}
.section-head p,.muted{color:var(--muted);font-size:12px;margin-top:7px}
.eyebrow{color:var(--green);font-size:10px;font-weight:1000;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:8px}
.date{color:#748087;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}
.empty{
  border:1px dashed rgba(255,255,255,.13);border-radius:18px;padding:40px;
  text-align:center;color:#707a80;background:rgba(255,255,255,.015)
}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,.65fr);gap:16px;margin-bottom:32px}
.hero-main{
  min-height:390px;padding:42px;display:flex;flex-direction:column;justify-content:flex-end;
  background:
    radial-gradient(circle at 78% 18%,rgba(183,255,42,.19),transparent 22%),
    radial-gradient(circle at 90% 90%,rgba(99,230,255,.10),transparent 28%),
    linear-gradient(135deg,#151c20 0,#090c0f 68%)
}
.hero-main:before{
  content:"01";position:absolute;right:-10px;top:-45px;font-family:"Barlow Condensed";
  font-size:280px;font-weight:900;line-height:1;color:rgba(255,255,255,.025);font-style:italic
}
.hero-main:after{
  content:"";position:absolute;width:380px;height:380px;right:8%;top:8%;
  border:1px solid rgba(183,255,42,.12);border-radius:50%;
  box-shadow:0 0 0 30px rgba(183,255,42,.012),0 0 0 60px rgba(183,255,42,.008);
  pointer-events:none
}
.hero-main h1{
  position:relative;z-index:1;max-width:820px;font-family:"Barlow Condensed";
  font-size:clamp(54px,6vw,94px);line-height:.84;letter-spacing:-2.8px;
  text-transform:uppercase;font-weight:900
}
.hero-main p{
  position:relative;z-index:1;max-width:650px;color:#aeb8bc;font-size:14px;
  line-height:1.65;margin-top:20px
}
.hero-side{
  padding:26px;display:flex;flex-direction:column;justify-content:center;
  background:linear-gradient(155deg,#11171b,#090c0f)
}
.hero-side h3{
  font-family:"Barlow Condensed";font-size:30px;line-height:.95;
  text-transform:uppercase;margin-bottom:18px
}
.mini-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-stat{
  padding:16px;border:1px solid var(--line);background:rgba(255,255,255,.025);
  border-radius:14px
}
.mini-stat strong{display:block;font-family:"Barlow Condensed";font-size:30px;line-height:1}
.mini-stat span{
  display:block;margin-top:5px;color:#7f8a90;font-size:9px;font-weight:900;
  letter-spacing:1px;text-transform:uppercase
}

/* BUTTONS */
.actions{display:flex;flex-wrap:wrap;gap:9px}
.btn{
  border:1px solid var(--line2);background:rgba(255,255,255,.045);color:#eef2ef;
  padding:11px 15px;border-radius:11px;font-size:10px;font-weight:900;
  letter-spacing:.65px;text-transform:uppercase;transition:.2s;position:relative;z-index:2
}
.btn:hover{
  border-color:rgba(183,255,42,.45);background:rgba(183,255,42,.08);
  transform:translateY(-1px)
}
.btn.primary{
  color:#071000;background:var(--green);border-color:var(--green);
  box-shadow:0 8px 30px rgba(183,255,42,.16)
}
.btn.primary:hover{background:#c9ff5d;box-shadow:0 10px 40px rgba(183,255,42,.26)}
.btn.danger{color:#fff;background:rgba(255,83,100,.12);border-color:rgba(255,83,100,.35)}
.btn.small{padding:8px 10px;font-size:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* MATCH CARDS */
.match-card{padding:0;background:linear-gradient(160deg,#11171b,#090c0e)}
.match-card:after{
  content:"";position:absolute;inset:auto 0 0;height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  opacity:0;transition:.2s
}
.match-card:hover:after,.match-card.live:after{opacity:1}
.match-top{
  display:flex;align-items:center;justify-content:space-between;padding:13px 15px;
  border-bottom:1px solid var(--line);background:rgba(255,255,255,.018)
}
.competition-label{
  font-size:9px;color:#7f8a90;font-weight:900;text-transform:uppercase;
  letter-spacing:.9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%
}
.status{font-size:9px;color:#7f8a90;font-weight:900;letter-spacing:.6px}
.live-dot{
  color:var(--red);font-size:9px;font-weight:1000;letter-spacing:.7px;
  animation:pulse 1.6s infinite
}
.live-dot:before{
  content:"";display:inline-block;width:6px;height:6px;background:var(--red);
  border-radius:50%;margin-right:5px;box-shadow:0 0 10px rgba(255,83,100,.7)
}
@keyframes pulse{50%{opacity:.45}}
.teams{
  display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:24px 16px
}
.team{
  text-align:center;font-family:"Barlow Condensed";font-size:21px;font-weight:700;
  line-height:1.05;text-transform:uppercase
}
.team img{
  width:48px;height:48px;object-fit:contain;margin:0 auto 9px;
  filter:drop-shadow(0 7px 13px rgba(0,0,0,.4))
}
.score{
  font-family:"Barlow Condensed";font-size:34px;font-weight:900;
  text-align:center;letter-spacing:-1px
}
.teams>div:nth-child(2) .status{text-align:center;margin-top:3px}
.match-bottom{
  display:flex;align-items:center;justify-content:space-between;padding:12px 15px;
  border-top:1px solid var(--line);background:rgba(0,0,0,.13)
}

/* NEWS */
.news-card{
  min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;
  background:linear-gradient(180deg,#13191d,#090c0e)
}
.news-card .news-image{height:155px;overflow:hidden;background:linear-gradient(135deg,#151b1f,#080a0c)}
.news-card .news-image img{
  width:100%;height:100%;object-fit:cover;transition:.5s
}
.news-card:hover .news-image img{transform:scale(1.055)}
.news-body{padding:18px}
.news-body h3{
  font-family:"Barlow Condensed";font-size:25px;line-height:.98;
  text-transform:uppercase;margin:8px 0
}
.news-body p{font-size:12px;line-height:1.55;color:#929da3}
.news-card .btn{margin-top:13px}

/* TABLES */
.table-wrap{
  overflow:auto;border:1px solid var(--line);border-radius:15px;background:rgba(0,0,0,.12)
}
.table{width:100%;border-collapse:collapse;min-width:600px}
.table th{
  padding:12px 13px;color:#667279;font-size:9px;letter-spacing:1px;
  text-transform:uppercase;text-align:left;background:#0a0e11;border-bottom:1px solid var(--line)
}
.table td{
  padding:13px;border-bottom:1px solid rgba(255,255,255,.055);
  font-size:11px;color:#d8dedf
}
.table tr:hover td{background:rgba(183,255,42,.025)}
.table tr:last-child td{border-bottom:0}

/* COMPETITIONS */
.competition-card{
  min-height:230px;padding:24px;display:flex;flex-direction:column;
  justify-content:space-between;
  background:
    radial-gradient(circle at 90% 15%,rgba(183,255,42,.11),transparent 24%),
    linear-gradient(145deg,#141a1e,#090c0f)
}
.competition-card:before{
  content:"COMP";position:absolute;right:-10px;bottom:-35px;
  font-family:"Barlow Condensed";font-size:120px;font-weight:900;font-style:italic;
  color:rgba(255,255,255,.025)
}
.competition-card h3{
  font-family:"Barlow Condensed";font-size:34px;line-height:.9;
  text-transform:uppercase;max-width:80%
}
.competition-card p{color:#7e898f;font-size:11px;margin-top:8px}
.competition-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:18px}
.pill{
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  border-radius:99px;padding:6px 9px;color:#89949a;font-size:8px;
  font-weight:900;text-transform:uppercase;letter-spacing:.7px
}

/* PLAYER PROFILE — HERO-FIRST, IMAGE-DRIVEN */
.player-header{
  min-height:430px;padding:0;display:grid;
  grid-template-columns:minmax(280px,.72fr) minmax(0,1.28fr);align-items:stretch;
  background:
    radial-gradient(circle at 12% 45%,rgba(183,255,42,.18),transparent 24%),
    linear-gradient(115deg,#151b1f,#080b0e 70%);
  border-color:rgba(255,255,255,.11)
}
.player-header:after{
  content:"PLAYER";position:absolute;right:-25px;bottom:-62px;
  font-family:"Barlow Condensed";font-style:italic;font-size:180px;
  font-weight:900;color:rgba(255,255,255,.028);pointer-events:none
}
.player-avatar{
  min-height:430px;display:flex;align-items:end;justify-content:center;
  position:relative;overflow:hidden;font-family:"Barlow Condensed";font-size:180px;
  font-weight:900;color:rgba(255,255,255,.15);
  background:
    radial-gradient(circle at 50% 42%,rgba(183,255,42,.16),transparent 31%),
    linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.25))
}
.player-avatar:before{
  content:"";position:absolute;bottom:-120px;width:360px;height:360px;
  border-radius:50%;border:1px solid rgba(183,255,42,.15);
  box-shadow:0 0 0 35px rgba(183,255,42,.02),0 0 0 70px rgba(183,255,42,.012)
}
.player-avatar img{
  position:relative;z-index:2;width:100%;height:100%;object-fit:contain;
  object-position:center bottom;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));
  padding:20px 30px 0
}
.player-avatar.has-photo{
  font-size:0;background:linear-gradient(180deg,rgba(183,255,42,.08),rgba(0,0,0,.25))
}
.player-avatar.has-photo .player-initial{display:none}
.player-initial{position:relative;z-index:1}
.player-avatar.has-photo:after{
  content:"";position:absolute;inset:auto 0 0;height:42%;
  background:linear-gradient(transparent,rgba(0,0,0,.45));z-index:3;pointer-events:none
}
.profile-meta{
  position:relative;z-index:4;align-self:center;padding:48px 48px 48px 25px
}
.profile-meta .eyebrow{font-size:11px}
.profile-meta h1{
  font-family:"Barlow Condensed";font-size:clamp(58px,7vw,105px);
  font-weight:900;line-height:.78;letter-spacing:-2px;text-transform:uppercase;max-width:760px
}
.profile-meta p{margin-top:18px;color:#aab4b8;font-size:13px}
.profile-meta:before{
  content:"";position:absolute;left:0;top:52px;width:4px;height:110px;
  background:var(--green);box-shadow:0 0 25px rgba(183,255,42,.3)
}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.kpi{
  padding:17px;border:1px solid var(--line);border-radius:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));
  position:relative;overflow:hidden
}
.kpi:after{
  content:"";position:absolute;right:-10px;bottom:-20px;width:60px;height:60px;
  border-radius:50%;background:rgba(183,255,42,.05)
}
.kpi strong{display:block;font-family:"Barlow Condensed";font-size:31px;line-height:.9}
.kpi span{
  display:block;margin-top:6px;color:#747f85;font-size:8px;font-weight:900;
  letter-spacing:1px;text-transform:uppercase
}

/* TEAM PROFILE */
.team-header{
  padding:30px;display:flex;align-items:center;gap:25px;
  background:
    radial-gradient(circle at 15% 50%,rgba(183,255,42,.12),transparent 25%),
    linear-gradient(135deg,#141a1e,#090c0f)
}
.team-header img{
  width:110px;height:110px;object-fit:contain;
  filter:drop-shadow(0 15px 22px rgba(0,0,0,.45))
}
.team-header h1{
  font-family:"Barlow Condensed";font-size:65px;line-height:.85;text-transform:uppercase
}
.team-header p{margin-top:10px;color:#8e999e;font-size:12px}

/* MATCH CENTRE */
.match-hero{
  padding:28px;
  background:
    radial-gradient(circle at 50% 0,rgba(183,255,42,.11),transparent 35%),
    linear-gradient(145deg,#151b1f,#080b0e)
}
.match-hero .teams{padding:35px 25px}
.match-hero .team{font-size:28px}
.match-hero .team img{width:75px;height:75px}
.match-hero .score{font-size:64px}
.timeline,.log{display:flex;flex-direction:column;gap:8px}
.log-item{
  padding:12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.025);
  border-radius:12px;color:#b7c0c5;font-size:11px
}

/* FORMS / ADMIN */
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
label{
  display:flex;flex-direction:column;gap:7px;color:#818c92;font-size:9px;
  font-weight:900;text-transform:uppercase;letter-spacing:.8px
}
.input,.select,textarea{
  width:100%;border:1px solid var(--line2);outline:0;background:#090d10;color:#edf2ef;
  border-radius:11px;padding:11px 12px;font-size:11px
}
.input:focus,.select:focus,textarea:focus{
  border-color:rgba(183,255,42,.55);box-shadow:0 0 0 3px rgba(183,255,42,.07)
}

/* SEARCH */
.search-results{display:grid;gap:8px}
.search-result{
  padding:15px 16px;border:1px solid var(--line);border-radius:13px;
  background:rgba(255,255,255,.025);transition:.2s
}
.search-result:hover{
  border-color:rgba(183,255,42,.25);background:rgba(183,255,42,.035);
  transform:translateX(3px)
}

/* FOOTER / UTILITY */
.db-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;background:#ffbd45;
  margin-right:7px;box-shadow:0 0 10px rgba(255,189,69,.35)
}
.db-dot.ok{background:var(--green);box-shadow:0 0 12px rgba(183,255,42,.55)}
.hide{display:none!important}
.toast{
  position:fixed;right:22px;bottom:22px;z-index:100;padding:13px 16px;
  border:1px solid var(--line2);border-radius:13px;background:rgba(10,13,15,.94);
  box-shadow:var(--shadow);color:#edf2ef;font-size:11px;font-weight:800;
  backdrop-filter:blur(18px)
}

/* IMAGE SAFETY */
.news-card img,.team-header img,.team img,.player-avatar img{image-rendering:auto}
img[src=""],img:not([src]){display:none}

/* MATCH EVENT PAINT + RICH MATCH CENTRE */
.mc-event{
  position:relative;overflow:hidden;min-height:74px;display:grid;
  grid-template-columns:48px 34px minmax(0,1fr);gap:9px;align-items:center;
  padding:10px;border:1px solid var(--line);border-radius:13px;background:#080b0e;
  isolation:isolate;box-sizing:border-box
}
.mc-event-slab{
  position:absolute;top:4px;right:4px;bottom:4px;left:4px;display:block;
  overflow:hidden;border-radius:9px;background:#070a0c;z-index:0;
  pointer-events:none;box-sizing:border-box
}
.mc-event-paint{
  position:absolute;top:-8%;right:-8%;bottom:-8%;left:-8%;width:116%;height:116%;
  display:block;object-fit:cover;object-position:center;opacity:1;
  filter:saturate(1.35) contrast(1.08);
  -webkit-clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);
  clip-path:polygon(18% 0,100% 0,100% 100%,18% 100%,0 50%);z-index:0
}
.mc-event-slab:after{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;
  background:linear-gradient(90deg,rgba(5,8,10,.42) 0%,rgba(0,0,0,.18) 52%,rgba(0,0,0,.12) 100%);
  z-index:1;pointer-events:none
}
.mc-event-minute{
  position:relative;z-index:3;text-shadow:0 2px 10px rgba(0,0,0,.85);
  font-family:"Barlow Condensed";font-size:21px;font-weight:900;text-align:center
}
.mc-event-icon{
  position:relative;z-index:3;width:34px;height:34px;border-radius:10px;
  display:grid;place-items:center;background:rgba(0,0,0,.48);
  border:1px solid rgba(255,255,255,.13);font-size:16px
}
.mc-event-body{position:relative;z-index:3;min-width:0}
.mc-event-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}
.mc-event-detail{font-size:10px;color:#d5dddf;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-event.goal .mc-event-icon{background:rgba(183,255,42,.18);border-color:rgba(183,255,42,.35)}
.mc-event.assist .mc-event-icon{background:rgba(99,230,255,.15);border-color:rgba(99,230,255,.3)}
.mc-event.yellow .mc-event-icon{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.3)}
.mc-event.red .mc-event-icon{background:rgba(255,83,100,.18);border-color:rgba(255,83,100,.35)}
.mc-event.substitution .mc-event-icon{background:rgba(255,255,255,.09)}
.mc-event-side{font-size:8px;color:#dce4e5;margin-top:3px;text-transform:uppercase;letter-spacing:.5px}

/* LINEUPS */
.lineup-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lineup-panel{padding:18px}
.lineup-panel h3{font-family:"Barlow Condensed";font-size:25px;text-transform:uppercase}
.lineup-slots{display:grid;gap:8px;margin-top:14px}
.lineup-slot{display:grid;grid-template-columns:30px minmax(0,1fr);gap:9px;align-items:center}
.lineup-number{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(255,255,255,.03);
  font-family:"Barlow Condensed";font-weight:900
}
.lineup-slot .select{min-width:0}

/* NOTIFICATIONS */
.notify-panel{
  display:grid;
  gap:16px;
  margin-top:18px;
  padding:20px;
  border:1px solid var(--line);
  border-radius:18px;
  background:
    radial-gradient(circle at 0 0,rgba(183,255,42,.07),transparent 28%),
    linear-gradient(145deg,rgba(17,22,26,.96),rgba(8,11,13,.98));
}
.notify-panel-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:18px;flex-wrap:wrap
}
.notify-panel-title{
  font-family:"Barlow Condensed";font-size:28px;line-height:.95;
  text-transform:uppercase
}
.notify-panel-sub{font-size:10px;color:#7f8a90;line-height:1.5}
.notify-follow-grid{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px
}
.notify-pref{
  flex-direction:row;align-items:center;gap:8px;
  padding:10px 11px;border:1px solid var(--line);border-radius:11px;
  background:rgba(255,255,255,.025);color:#b7c0c5;font-size:9px;
  letter-spacing:.4px;text-transform:none
}
.notify-pref input{accent-color:var(--green)}
.notify-follow-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-top:2px
}
.notify-follow-list{display:flex;gap:7px;flex-wrap:wrap}
.notify-follow-chip{
  border:1px solid var(--line);border-radius:99px;padding:6px 9px;
  color:#9ca7ac;background:rgba(255,255,255,.025);font-size:8px;
  font-weight:800;text-transform:uppercase;letter-spacing:.5px
}
.follow-btn.following{
  color:#071000;background:var(--green);border-color:var(--green)
}

/* ADMIN */
.admin-shell{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px}
.admin-sidebar{padding:18px}
.admin-list{display:grid;gap:7px;margin-top:12px}
.admin-match{
  width:100%;text-align:left;border:1px solid var(--line);background:rgba(255,255,255,.02);
  border-radius:11px;padding:11px;color:#b7c0c5;transition:.2s
}
.admin-match:hover,.admin-match.active{
  border-color:rgba(183,255,42,.35);background:rgba(183,255,42,.06);color:#fff
}
.admin-main{padding:22px}
.admin-top{
  display:flex;align-items:center;justify-content:space-between;gap:15px;
  flex-wrap:wrap;margin-bottom:20px
}
.admin-top h2{font-size:34px}
.admin-section{
  margin-top:18px;padding-top:18px;border-top:1px solid var(--line)
}
.admin-event-grid{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px
}

/* MATCH CENTRE TABS */
.mc-tabs{
  display:flex;gap:5px;overflow:auto;padding:4px;border:1px solid var(--line);
  border-radius:13px;background:#080b0e;margin-top:16px
}
.mc-tabs button{
  flex:1;min-width:100px;border:0;background:transparent;color:#78848a;
  border-radius:9px;padding:10px 12px;font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.7px
}
.mc-tabs button.active{background:rgba(183,255,42,.1);color:#fff}
.mc-tab-panel{display:none;margin-top:14px}
.mc-tab-panel.active{display:block}

/* RESPONSIVE */
@media(max-width:1100px){
  header{padding:10px 18px;gap:14px}
  nav{overflow:auto;justify-content:flex-start}
  main{padding:28px 18px 70px}
  .hero{grid-template-columns:1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .notify-follow-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .admin-shell{grid-template-columns:1fr}
}
@media(max-width:760px){
  header{min-height:auto;flex-wrap:wrap;padding:10px 13px}
  .logo{font-size:26px}
  nav{order:3;flex-basis:100%;width:100%;padding-bottom:2px}
  nav button{padding:9px 10px;font-size:9px}
  .head-right{margin-left:auto}
  main{padding:20px 12px 60px}
  .hero-main{min-height:350px;padding:25px}
  .hero-main h1{font-size:58px}
  .hero-side{padding:20px}
  .grid,.grid.two,.lineup-grid,.form-grid,.form-grid.three{grid-template-columns:1fr}
  .teams{grid-template-columns:1fr 60px 1fr;padding:20px 9px}
  .team{font-size:17px}
  .team img{width:40px;height:40px}
  .score{font-size:28px}
  .player-header{grid-template-columns:1fr;min-height:0}
  .player-avatar{min-height:340px}
  .profile-meta{padding:30px 25px}
  .profile-meta h1{font-size:65px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .team-header{align-items:flex-start;flex-direction:column}
  .team-header h1{font-size:48px}
  .match-hero .team{font-size:20px}
  .match-hero .score{font-size:48px}
  .notify-follow-grid{grid-template-columns:1fr}
  .notify-panel-head{align-items:stretch}
  .notify-panel-head .btn{width:100%}
  .admin-event-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">
<header>
  <button class="logo" onclick="navFor('home')">MEFCO<span>WATCH</span></button>
  <nav id="mainNav">
    <button data-page="home" onclick="navFor('home')">Home</button>
    <button data-page="scores" onclick="navFor('scores')">Scores</button>
    <button data-page="news" onclick="navFor('news')">News</button>
    <button data-page="competitions" onclick="navFor('competitions')">Competitions</button>
    <button data-page="stats" onclick="navFor('stats')">Stats</button>
    <button data-page="search" onclick="navFor('search')">Search</button>
    <button id="adminNav" data-page="admin" onclick="navFor('admin')" class="hide">Admin</button>
  </nav>
  <div class="head-right">
    <button id="notificationButton" class="notif" onclick="enableNotifications()">Enable Notifications</button>
  </div>
</header>

<div class="ticker">
  <div class="ticker-track" id="tickerTrack">Loading MEFCO Watch…</div>
</div>

<main>
  <section class="page active" id="page-home">
    <div id="homeContent"></div>
  </section>

  <section class="page" id="page-scores">
    <div id="scoresContent"></div>
  </section>

  <section class="page" id="page-news">
    <div id="newsContent"></div>
  </section>

  <section class="page" id="page-competitions">
    <div id="competitionsContent"></div>
  </section>

  <section class="page" id="page-stats">
    <div id="statsContent"></div>
  </section>

  <section class="page" id="page-search">
    <div id="searchContent"></div>
  </section>

  <section class="page" id="page-admin">
    <div id="adminContent"></div>
  </section>
</main>

<div id="toast" class="toast hide"></div>
</div>

<script>
const SUPABASE_URL='https://qpokxolcdjxtmxrrqlgw.supabase.co';
const SUPABASE_KEY='sb_publishable_7hKSyu9jxd65IA7zfyZy2w_O0maaXdC';
const NOTIFICATION_API='https://mefco-notifications.drtwelveyt.workers.dev';

const MATCHES_URL=SUPABASE_URL+'/rest/v1/matches';
const EVENTS_URL=SUPABASE_URL+'/rest/v1/matches-events';
const NEWS_URL=SUPABASE_URL+'/rest/v1/news';
const TEAMS_URL=SUPABASE_URL+'/rest/v1/teams';
const PLAYERS_URL=SUPABASE_URL+'/rest/v1/players';
const COMPETITIONS_URL=SUPABASE_URL+'/rest/v1/competitions';

const ADMIN_MODE=new URLSearchParams(location.search).get('admin')==='1';

let matches=[];
let events=[];
let news=[];
let teams=[];
let players=[];
let competitions=[];
let communityPosts=[];
let selectedMatchId=null;
let selectedPlayerId=null;
let selectedTeamId=null;
let selectedCompetitionId=null;
let currentPage='home';
let adminLog=[];
let refreshTimer=null;
let toastTimer=null;
let renderTimer=null;

const esc=v=>String(v??'')
  .replace(/&/g,'&amp;')
  .replace(/</g,'&lt;')
  .replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;')
  .replace(/'/g,'&#39;');

function safeMediaUrl(v){
  const s=String(v??'').trim();
  if(!s)return '';
  try{
    const u=new URL(s,location.href);
    if(!['http:','https:','data:'].includes(u.protocol))return '';
    return u.href;
  }catch{return ''}
}

function showToast(msg){
  const el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg;
  el.classList.remove('hide');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.add('hide'),3200);
}

function scheduleRender(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(renderAll,0);
}

function navFor(page){
  currentPage=page;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+page)?.classList.add('active');
  document.querySelectorAll('#mainNav button[data-page]').forEach(x=>{
    x.classList.toggle('active',x.dataset.page===page)
  });
  if(page==='admin'&&!ADMIN_MODE){
    showToast('Admin mode is required');
    currentPage='home';
    document.getElementById('page-home')?.classList.add('active');
    document.getElementById('page-admin')?.classList.remove('active');
  }
  renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}

function todayISO(){
  const d=new Date();
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function parseDate(v){
  if(!v)return null;
  const d=new Date(v);
  return Number.isNaN(d.getTime())?null:d;
}

function formatDate(v){
  const d=parseDate(v);
  if(!d)return 'Date TBC';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}

function formatTime(v){
  if(!v)return 'TBC';
  const s=String(v);
  if(/^\d{1,2}:\d{2}/.test(s))return s.slice(0,5);
  const d=parseDate(s);
  return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):s;
}

function teamById(id){
  return teams.find(x=>String(x.id)===String(id));
}

function playerById(id){
  return players.find(x=>String(x.id)===String(id));
}

function competitionById(id){
  return competitions.find(x=>String(x.id)===String(id));
}

function teamName(id,fallback=''){
  const t=teamById(id);
  return t?.name||fallback||'Unknown team';
}

function playerName(id,fallback=''){
  const p=playerById(id);
  return p?.name||p?.short_name||fallback||'Unknown player';
}

function getCompetitionList(){
  return competitions.length?competitions:[...new Map(matches.map(m=>[
    String(m.competition_id||m.competition||''),
    {id:m.competition_id||`legacy-${m.competition}`,name:m.competition||'Competition'}
  ])).values()];
}

function eventType(e){
  return String(e?.type||e?.event_type||e?.kind||'').toLowerCase().trim();
}

function normalizePosition(p){
  const s=String(p||'').toLowerCase();
  if(/gk|goalkeeper/.test(s))return'gk';
  if(/def|cb|lb|rb|back/.test(s))return'def';
  if(/mid|cm|dm|am/.test(s))return'mid';
  return'fwd';
}

function isFinished(m){
  return ['finished','full-time','ft','completed'].includes(String(m?.status||'').toLowerCase());
}

function scoreOf(m){
  return [Number(m?.score_home||0),Number(m?.score_away||0)];
}

function matchMeta(m){
  if(!m)return {};
  if(m.metadata&&typeof m.metadata==='object')return m.metadata;
  if(typeof m.metadata==='string'){
    try{return JSON.parse(m.metadata)||{}}catch{}
  }
  return {};
}

function matchLineup(m,side){
  const meta=matchMeta(m);
  const value=meta.lineups?.[side]||meta[`${side}_lineup`]||m?.[`${side}_lineup`]||[];
  return Array.isArray(value)?value.map(String).filter(Boolean):[];
}

function matchSubstitutes(m,side){
  const meta=matchMeta(m);
  const value=meta.substitutes?.[side]||meta[`${side}_substitutes`]||[];
  return Array.isArray(value)?value.map(String).filter(Boolean):[];
}

async function supabaseFetch(url,options={}){
  const headers=new Headers(options.headers||{});
  headers.set('apikey',SUPABASE_KEY);
  headers.set('Authorization','Bearer '+SUPABASE_KEY);
  headers.set('Accept','application/json');
  if(options.body&&!headers.has('Content-Type'))headers.set('Content-Type','application/json');

  const response=await fetch(url,{...options,headers});
  if(!response.ok){
    const text=await response.text();
    throw new Error(`${response.status}: ${text}`);
  }
  if(response.status===204)return null;
  return response.json();
}

async function loadData(){
  const results=await Promise.allSettled([
    supabaseFetch(MATCHES_URL+'?select=*&order=match_date.desc,match_time.desc'),
    supabaseFetch(EVENTS_URL+'?select=*&order=minute.asc,created_at.asc'),
    supabaseFetch(NEWS_URL+'?select=*&order=created_at.desc'),
    supabaseFetch(TEAMS_URL+'?select=*'),
    supabaseFetch(PLAYERS_URL+'?select=*'),
    supabaseFetch(COMPETITIONS_URL+'?select=*')
  ]);

  matches=Array.isArray(results[0].value)?results[0].value:[];
  events=Array.isArray(results[1].value)?results[1].value:[];
  news=Array.isArray(results[2].value)?results[2].value:[];
  teams=Array.isArray(results[3].value)?results[3].value:[];
  players=Array.isArray(results[4].value)?results[4].value:[];
  competitions=Array.isArray(results[5].value)?results[5].value:[];

  const byMatch=new Map();
  events.forEach(e=>{
    const key=String(e.match_id||'');
    if(!byMatch.has(key))byMatch.set(key,[]);
    byMatch.get(key).push(e);
  });
  matches.forEach(m=>m.events=byMatch.get(String(m.id))||[]);

  renderAll();
}

function renderAll(){
  renderHome();
  renderScores();
  renderNews();
  renderCompetitions();
  renderStats();
  renderSearch();
  if(ADMIN_MODE)renderAdminPanel();
  renderTicker();
}

function renderTicker(){
  const el=document.getElementById('tickerTrack');
  if(!el)return;
  const live=matches.filter(m=>String(m.status||'').toLowerCase()==='live');
  const upcoming=matches.filter(m=>['scheduled','upcoming'].includes(String(m.status||'').toLowerCase())).slice(0,5);
  const pieces=[];
  live.forEach(m=>{
    const [h,a]=scoreOf(m);
    pieces.push(`<b>LIVE</b> ${esc(m.home||teamName(m.home_team_id))} ${h}-${a} ${esc(m.away||teamName(m.away_team_id))}`);
  });
  upcoming.forEach(m=>{
    pieces.push(`${esc(m.home||teamName(m.home_team_id))} vs ${esc(m.away||teamName(m.away_team_id))} • ${esc(formatDate(m.match_date))} ${esc(formatTime(m.match_time))}`);
  });
  el.innerHTML=pieces.length?pieces.join(' &nbsp;&nbsp; • &nbsp;&nbsp; '):'MEFCO WATCH • No live fixtures right now';
}

function renderHome(){
  const el=document.getElementById('homeContent');
  if(!el)return;
  const live=matches.filter(m=>String(m.status||'').toLowerCase()==='live');
  const upcoming=matches.filter(m=>['scheduled','upcoming'].includes(String(m.status||'').toLowerCase())).slice(0,6);
  const latestNews=news.slice(0,3);

  el.innerHTML=`
    <div class="hero">
      <div class="hero-main">
        <div class="eyebrow">MEFCO Football Network</div>
        <h1>Every match.<br>Every moment.</h1>
        <p>Live scores, match events, competitions, players and football stories — all in one place.</p>
        <div class="actions" style="margin-top:22px">
          <button class="btn primary" onclick="navFor('scores')">View scores</button>
          <button class="btn" onclick="navFor('competitions')">Explore competitions</button>
        </div>
      </div>
      <div class="hero-side card">
        <div class="eyebrow">At a glance</div>
        <h3>MEFCO today</h3>
        <div class="mini-grid">
          <div class="mini-stat"><strong>${live.length}</strong><span>Live</span></div>
          <div class="mini-stat"><strong>${upcoming.length}</strong><span>Upcoming</span></div>
          <div class="mini-stat"><strong>${teams.length}</strong><span>Teams</span></div>
          <div class="mini-stat"><strong>${players.length}</strong><span>Players</span></div>
        </div>
      </div>
    </div>

    ${notificationSettingsPanel()}

    <div class="section">
      <div class="section-head">
        <div><div class="eyebrow">On the pitch</div><h2>Live now</h2></div>
        <button class="ghost" onclick="navFor('scores')">All scores →</button>
      </div>
      ${live.length?`<div class="grid">${live.slice(0,3).map(matchCard).join('')}</div>`:`<div class="empty">No live matches right now.</div>`}
    </div>

    <div class="section">
      <div class="section-head">
        <div><div class="eyebrow">Next up</div><h2>Upcoming matches</h2></div>
      </div>
      ${upcoming.length?`<div class="grid">${upcoming.map(matchCard).join('')}</div>`:`<div class="empty">No upcoming matches.</div>`}
    </div>

    <div class="section">
      <div class="section-head">
        <div><div class="eyebrow">Latest</div><h2>MEFCO News</h2></div>
        <button class="ghost" onclick="navFor('news')">All news →</button>
      </div>
      ${latestNews.length?`<div class="grid">${latestNews.map(newsCard).join('')}</div>`:`<div class="empty">No news available.</div>`}
    </div>
  `;
}

function matchCard(m){
  const [h,a]=scoreOf(m);
  const live=String(m.status||'').toLowerCase()==='live';
  const home=m.home||teamName(m.home_team_id,'Home');
  const away=m.away||teamName(m.away_team_id,'Away');
  const ht=teamById(m.home_team_id),at=teamById(m.away_team_id);
  const hf=safeMediaUrl(m.home_flag||ht?.flag_url||ht?.logo_url||'');
  const af=safeMediaUrl(m.away_flag||at?.flag_url||at?.logo_url||'');
  return `<article class="card match-card ${live?'live':''}">
    <div class="match-top">
      <span class="competition-label">${esc(m.competition||'MEFCO')}</span>
      ${live?'<span class="live-dot">LIVE</span>':`<span class="status">${esc(formatDate(m.match_date))}</span>`}
    </div>
    <div class="teams">
      <div class="team">${hf?`<img src="${esc(hf)}" alt="">`:''}${esc(home)}</div>
      <div>
        <div class="score">${h} - ${a}</div>
        <div class="status">${live?`${Number(m.minute)||0}'`:esc(formatTime(m.match_time))}</div>
      </div>
      <div class="team">${af?`<img src="${esc(af)}" alt="">`:''}${esc(away)}</div>
    </div>
    <div class="match-bottom">
      <span class="date">${esc(formatDate(m.match_date))}</span>
      <div class="actions">
        ${followButton('match',m.id)}
        <button class="btn small" onclick="openMatch(${JSON.stringify(String(m.id))})">Match centre</button>
      </div>
    </div>
  </article>`;
}

function openMatch(id){
  selectedMatchId=id;
  showMatchCentre();
}

function showMatchCentre(){
  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  if(!m)return;
  const home=m.home||teamName(m.home_team_id,'Home');
  const away=m.away||teamName(m.away_team_id,'Away');
  const [h,a]=scoreOf(m);
  const ht=teamById(m.home_team_id),at=teamById(m.away_team_id);
  const hf=safeMediaUrl(m.home_flag||ht?.flag_url||ht?.logo_url||'');
  const af=safeMediaUrl(m.away_flag||at?.flag_url||at?.logo_url||'');
  const el=document.getElementById('homeContent');
  el.innerHTML=matchCentreHTML(m,home,away,h,a,hf,af);
  currentPage='home';
}

function matchCentreHTML(m,home,away,h,a,hf,af){
  const eventsFor=(m.events||[]).slice().sort((x,y)=>(Number(x.minute)||0)-(Number(y.minute)||0));
  const lineups=readMatchLineups(m);
  return `<div class="section-head">
      <div><div class="eyebrow">Match Centre</div><h2>${esc(home)} vs ${esc(away)}</h2></div>
      <button class="ghost" onclick="navFor('scores')">← Back to scores</button>
    </div>
    <div class="card match-hero">
      <div class="match-top">
        <span class="competition-label">${esc(m.competition||'MEFCO')}</span>
        <span class="${String(m.status||'').toLowerCase()==='live'?'live-dot':'status'}">${String(m.status||'').toLowerCase()==='live'?`LIVE ${Number(m.minute)||0}'`:esc(m.status||'Scheduled')}</span>
      </div>
      <div class="teams">
        <div class="team">${hf?`<img src="${esc(hf)}" alt="">`:''}${esc(home)}</div>
        <div><div class="score">${h} - ${a}</div><div class="status">${esc(formatDate(m.match_date))}<br>${esc(formatTime(m.match_time))}</div></div>
        <div class="team">${af?`<img src="${esc(af)}" alt="">`:''}${esc(away)}</div>
      </div>
      <div class="actions">
        ${followButton('match',m.id)}
      </div>
    </div>

    <div class="mc-tabs" data-match-tabs>
      <button class="active" data-tab="events" onclick="switchMatchTab('events')">Events</button>
      <button data-tab="lineups" onclick="switchMatchTab('lineups')">Lineups</button>
      <button data-tab="stats" onclick="switchMatchTab('stats')">Stats</button>
    </div>

      ${eventsFor.length?`<div class="timeline">${eventsFor.map(matchEventCard).join('')}</div>`:`<div class="empty">No events recorded.</div>`}
    </div>

    <div class="mc-tab-panel" id="mc-tab-lineups">
      ${lineups.home.length||lineups.away.length?`
      <div class="lineup-grid">
        ${renderMatchLineup(m,'home',home)}
        ${renderMatchLineup(m,'away',away)}
      </div>`:`<div class="empty">Lineups have not been published.</div>`}
    </div>

    <div class="mc-tab-panel" id="mc-tab-stats">
      ${renderMatchStats(m)}
    </div>`;
}

function switchMatchTab(tab){
  document.querySelectorAll('[data-match-tabs] button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  document.querySelectorAll('.mc-tab-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('mc-tab-'+tab)?.classList.add('active');
}

function matchEventCard(e){
  const type=eventType(e)||'event';
  const player=String(e.player||e.player_name||playerName(e.player_id,'Match event'));
  const team=String(e.team||teamName(e.team_id,''));
  const minute=Math.max(0,Number(e.minute)||0);
  const stoppage=Math.max(0,Number(e.stoppage)||0);
  const time=`${minute}${stoppage?`+${stoppage}`:''}'`;
  const icons={goal:'⚽',assist:'↗',yellow:'🟨',red:'🟥',substitution:'↕'};
  const labels={goal:'Goal',assist:'Assist',yellow:'Yellow card',red:'Red card',substitution:'Substitution'};
  return `<div class="mc-event ${esc(type)}">
    <div class="mc-event-slab"></div>
    <div class="mc-event-minute">${esc(time)}</div>
    <div class="mc-event-icon">${icons[type]||'•'}</div>
    <div class="mc-event-body">
      <div class="mc-event-title">${esc(labels[type]||type)}</div>
      <div class="mc-event-detail">${esc(player)}</div>
      ${team?`<div class="mc-event-side">${esc(team)}</div>`:''}
      ${e.detail?`<div class="mc-event-detail">${esc(String(e.detail))}</div>`:''}
    </div>
  </div>`;
}

function renderMatchLineup(m,side,label){
  const ids=matchLineup(m,side);
  const bench=matchSubstitutes(m,side);
  return `<div class="card lineup-panel">
    <div class="eyebrow">${side==='home'?'Home':'Away'}</div>
    <h3>${esc(label)}</h3>
    <div class="lineup-slots">
      ${ids.map((id,i)=>{
        const p=playerById(id);
        return `<div class="lineup-slot">
          <div class="lineup-number">${i+1}</div>
          <div>${esc(p?.name||id)}</div>
        </div>`;
      }).join('')}
    </div>
    ${bench.length?`<div class="admin-section"><div class="eyebrow">Bench</div><div class="lineup-slots">${bench.map(id=>`<div class="lineup-slot"><div class="lineup-number">—</div><div>${esc(playerName(id,id))}</div></div>`).join('')}</div></div>`:''}
  </div>`;
}

function renderMatchStats(m){
  const meta=matchMeta(m);
  const stats=meta.match_stats||{};
  const rows=[
    ['Possession',stats.home?.possession,stats.away?.possession,'%'],
    ['Shots',stats.home?.shots,stats.away?.shots,''],
    ['Shots on target',stats.home?.shots_on_target,stats.away?.shots_on_target,''],
    ['Corners',stats.home?.corners,stats.away?.corners,''],
    ['Fouls',stats.home?.fouls,stats.away?.fouls,'']
  ].filter(r=>r[1]!=null||r[2]!=null);
  if(!rows.length)return '<div class="empty">Match statistics have not been recorded.</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr><th>Statistic</th><th>${esc(m.home||teamName(m.home_team_id,'Home'))}</th><th>${esc(m.away||teamName(m.away_team_id,'Away'))}</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1]??'—')}${r[3]}</td><td>${esc(r[2]??'—')}${r[3]}</td></tr>`).join('')}</tbody></table></div>`;
}

function newsCard(n){
  const u=safeMediaUrl(n.image_url||n.cover_url||n.hero_image||n.thumbnail_url||n.image||'');

    <div class="news-body">

      <button class="btn small" onclick="openArticle('${esc(n.id)}')">Read story</button>

}

  </div>`;
}

function performSearch(q){
  const el=document.getElementById('searchResults');
  if(!el)return;
  const s=String(q||'').trim().toLowerCase();
  if(!s){el.innerHTML='<div class="empty">Start typing to search.</div>';return}
  const results=[];
  players.filter(p=>String(p.name||'').toLowerCase().includes(s)).slice(0,8).forEach(p=>{
    results.push(`<button class="search-result" onclick="openPlayer('${esc(p.id)}')"><b>${esc(p.name)}</b><br><span class="muted">Player</span></button>`);
  });
  teams.filter(t=>String(t.name||'').toLowerCase().includes(s)).slice(0,8).forEach(t=>{
    results.push(`<button class="search-result" onclick="openTeam('${esc(t.id)}')"><b>${esc(t.name)}</b><br><span class="muted">Team</span></button>`);
  });
  getCompetitionList().filter(c=>String(c.name||'').toLowerCase().includes(s)).slice(0,8).forEach(c=>{
    results.push(`<div class="search-result"><b>${esc(c.name)}</b><br><span class="muted">Competition</span></div>`);
  });
  el.innerHTML=results.length?results.join(''):'<div class="empty">No results found.</div>';
}

function adminLineupEditor(m){
  const homeTeam=teamById(m.home_team_id),awayTeam=teamById(m.away_team_id);
  const homePlayers=players.filter(p=>String(p.team_id)===String(m.home_team_id));
  const awayPlayers=players.filter(p=>String(p.team_id)===String(m.away_team_id));
  const home=matchLineup(m,'home'),away=matchLineup(m,'away');
  const hsub=matchSubstitutes(m,'home'),asub=matchSubstitutes(m,'away');

  const side=(name,teamId,arr,subs,cls)=>{
    const opts=players.filter(p=>String(p.team_id)===String(teamId));
    return `<div class="card lineup-panel">
      <div class="eyebrow">${esc(name)}</div>
      <h3>Starting XI</h3>
      <div class="lineup-slots">
        ${Array.from({length:11},(_,i)=>{
          const current=arr[i]||'';
          return `<div class="lineup-slot">
            <div class="lineup-number">${i+1}</div>
            <select class="select ${cls}-lineup" onchange="refreshAllLineupSelectors()">
              <option value="">Select player</option>
              ${opts.map(p=>`<option value="${esc(p.id)}" ${String(current)===String(p.id)?'selected':''}>${esc(p.name)}</option>`).join('')}

function eventPayload(match,type,playerId,minute,stoppage,detail=''){
  const p=playerById(playerId);
  const teamId=p?.team_id||null;
  return {
    match_id:match.id,
    type,
    minute:Math.max(0,Number(minute)||0),
    stoppage:Math.max(0,Number(stoppage)||0),
    player_id:playerId||null,
    team_id:teamId,
    player:p?.name||'',
    team:teamName(teamId,''),
    detail:String(detail||'')
  };
}

async function notifyRecordedEvent(match,event){
  if(!match||!event)return;
  const type=eventType(event);
  const supported=['goal','assist','yellow','red','substitution'];
  if(!supported.includes(type))return;

  const playerNameValue=String(
    event.player||event.player_name||event.name||''
  ).trim();

  const teamLabel=String(
    event.team||teamName(event.team_id,'')||''
  ).trim();

  const minute=Math.max(0,Number(event.minute)||0);
  const stoppage=Math.max(0,Number(event.stoppage)||0);
  const timeLabel=`${minute}${stoppage?`+${stoppage}`:''}'`;

  const titleMap={
    goal:'Goal',
    assist:'Assist',
    yellow:'Yellow card',
    red:'Red card',
    substitution:'Substitution'
  };

  let body=playerNameValue||'Match event';

  if(teamLabel)body+=`\n${teamLabel} • ${timeLabel}`;

  if(type==='goal'&&event.detail){
    const assist=String(event.detail)
      .replace(/^Assist:\s*/i,'')
      .trim();
    if(assist)body+=`\nAssist: ${assist}`;
  }

  if(type==='assist'&&event.detail){
    const scorer=String(event.detail)
      .replace(/^For\s*/i,'')
      .trim();
    if(scorer)body+=`\nFor: ${scorer}`;
  }

  if(type==='substitution'&&event.detail){
    const detail=String(event.detail).trim();
    if(detail)body+=`\n${detail}`;
  }

  const base={
    title:titleMap[type],
    body,
    url:'/MEFCOWatch/',
    tag:`mefco-event-${match.id}-${event.id||type}-${minute}-${stoppage}`,
    renotify:false
  };

  const targets=[];

  if(match.id!=null){
    targets.push({
      follow_type:'match',
      target_id:String(match.id),
      preference:'match_events'
    });
  }

  if(event.team_id!=null){
    targets.push({
      follow_type:'team',
      target_id:String(event.team_id),
      preference:'team_events'
    });
  }

  if(event.player_id!=null){
    targets.push({
      follow_type:'player',
      target_id:String(event.player_id),
      preference:'player_events'
    });
  }

  const seen=new Set();

  await Promise.allSettled(
    targets.filter(t=>{
      const k=t.follow_type+':'+t.target_id;
      if(seen.has(k))return false;
      seen.add(k);
      return true;
    }).map(t=>
      fetch(NOTIFICATION_API+'/api/notify',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          ...base,
          follow_type:t.follow_type,
          target_id:t.target_id,
          preference:t.preference
        })
      })
    )
  );
}

async function postEvent(event){
  const result=await supabaseFetch(EVENTS_URL,{
    method:'POST',
    headers:{Prefer:'return=representation'},
    body:JSON.stringify(event)
  });

  const row=Array.isArray(result)?result[0]:result;

  if(row){
    notifyRecordedEvent(event,row)
      .catch(e=>console.warn('MEFCO event notification failed',e));
  }

  return row;
}

async function addOtherEvent(matchId){
  const m=matches.find(x=>String(x.id)===String(matchId));
  if(!m)return;

  const type=document.getElementById('otherEventType')?.value;
  const playerId=document.getElementById('otherEventPlayer')?.value;
  const minute=document.getElementById('otherEventMinute')?.value;
  const stoppage=document.getElementById('otherEventStoppage')?.value;
  const detail=document.getElementById('otherEventDetail')?.value||'';

  if(!type||!playerId){
    showToast('Select the event type and player');
    return;
  }

  try{
    const event=eventPayload(m,type,playerId,minute,stoppage,detail);
    const row=await postEvent(event);

    if(row){
      m.events=m.events||[];
      m.events.push(row);

      if(type==='goal'){
        await adjustPlayerStat(playerId,'goals',1);
        const patch=String(event.team_id)===String(m.home_team_id)
          ?{score_home:Number(m.score_home||0)+1}
          :String(event.team_id)===String(m.away_team_id)
          ?{score_away:Number(m.score_away||0)+1}
          :null;
        if(patch){
          const updated=await updateMatch(m.id,patch);
          Object.assign(m,updated||patch);
        }
      }

      if(type==='assist')await adjustPlayerStat(playerId,'assists',1);
      if(type==='yellow')await adjustPlayerStat(playerId,'yellow_cards',1);
      if(type==='red')await adjustPlayerStat(playerId,'red_cards',1);

      renderAll();
      showToast('Event added');
    }
  }catch(e){
    console.error(e);
    showToast('Could not add event');
  }
}

async function addSubstitution(matchId){
  const m=matches.find(x=>String(x.id)===String(matchId));
  if(!m)return;

  const teamId=document.getElementById('subTeam')?.value;
  const outId=document.getElementById('subOut')?.value;
  const inId=document.getElementById('subIn')?.value;
  const minute=Math.max(0,Number(document.getElementById('subMinute')?.value)||0);
  const stoppage=Math.max(0,Number(document.getElementById('subStoppage')?.value)||0);

  if(!teamId||!outId||!inId){
    showToast('Select the team and both players');
    return;
  }

  const side=String(teamId)===String(m.home_team_id)?'home':'away';
  const outPlayer=playerById(outId);
  const inPlayer=playerById(inId);

  if(!outPlayer||!inPlayer){
    showToast('Players could not be found');
    return;
  }

  try{
    const detail=`${outPlayer.name} → ${inPlayer.name} | OFF_ID:${outId}`;
    const event={
      match_id:m.id,
      type:'substitution',
      minute,
      stoppage,
      player_id:inId,
      team_id:teamId,
      player:inPlayer.name,
      team:teamName(teamId,''),
      detail
    };

    const row=await postEvent(event);

    if(row){
      m.events=m.events||[];
      m.events.push(row);

      const meta=matchMeta(m);
      meta.lineups=meta.lineups||{home:[],away:[]};
      meta.substitutes=meta.substitutes||{home:[],away:[]};

      const lineup=(meta.lineups[side]||[]).map(String);
      const bench=(meta.substitutes[side]||[]).map(String);

      const index=lineup.indexOf(String(outId));
      if(index>=0)lineup[index]=String(inId);
      else lineup.push(String(inId));

      meta.lineups[side]=[...new Set(lineup)].slice(0,11);
      meta.substitutes[side]=bench.filter(id=>id!==String(inId));
      if(!meta.substitutes[side].includes(String(outId))){
        meta.substitutes[side].push(String(outId));
      }

      await updateMatch(m.id,{metadata:meta});
      m.metadata=meta;

      renderAll();
      showToast('Substitution recorded');
    }
  }catch(e){
    console.error(e);
    showToast('Could not record substitution');
  }
}

async function deleteEvent(id){
  if(!id){
    showToast('This event cannot be deleted because it has no database ID');
    return;
  }

  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  const e=m?.events?.find(x=>String(x.id)===String(id));
  if(!e)return;

  try{
    await supabaseFetch(
      EVENTS_URL+'?id=eq.'+encodeURIComponent(id),
      {method:'DELETE'}
    );

    if(e.type==='goal'){
      await adjustPlayerStat(e.player_id,'goals',-1);

      const changes=
        String(e.team_id)===String(m.home_team_id)
        ?{score_home:Math.max(0,Number(m.score_home||0)-1)}
        :String(e.team_id)===String(m.away_team_id)
        ?{score_away:Math.max(0,Number(m.score_away||0)-1)}
        :null;

      if(changes)await updateMatch(m.id,changes);
    }

    if(e.type==='assist')await adjustPlayerStat(e.player_id,'assists',-1);
    if(e.type==='yellow')await adjustPlayerStat(e.player_id,'yellow_cards',-1);
    if(e.type==='red')await adjustPlayerStat(e.player_id,'red_cards',-1);

    if(e.type==='substitution'){
      const side=
        String(e.team_id)===String(m.home_team_id)
        ?'home'
        :String(e.team_id)===String(m.away_team_id)
        ?'away'
        :'';

      const meta=matchMeta(m);
      const offId=(String(e.detail||'').match(/(?:OFF_ID|OUT_ID):\s*([^|•]+)/i)||[])[1]?.trim();
      const inId=String(e.player_id||'');

      if(side&&offId&&inId){
        let xi=(meta.lineups?.[side]||[])
          .map(String)
          .filter(id=>id!==inId);

        let pos=xi.length<11
          ?xi.length
          :Math.min(10,xi.indexOf(inId));

        xi.splice(Math.max(0,pos),0,String(offId));
        xi=[...new Set(xi)];

        let bench=(meta.substitutes?.[side]||[])
          .map(String)
          .filter(id=>id!==String(offId));

        if(!bench.includes(inId))bench.push(inId);

        meta.lineups=meta.lineups||{};
        meta.lineups[side]=xi;
        meta.substitutes=meta.substitutes||{};
        meta.substitutes[side]=bench;

        await updateMatch(m.id,{metadata:meta});
      }
    }

    if(m)m.events=(m.events||[]).filter(x=>String(x.id)!==String(id));

    renderAll();
    showToast('Event deleted');
  }catch(e2){
    console.error(e2);
    showToast('Could not delete event');
  }
}

function refreshLineupSelectors(side){
  const sels=[...document.querySelectorAll('.'+side+'-lineup')];
  const used=new Set(
    sels.map(s=>s.value).filter(Boolean).map(String)
  );

  sels.forEach(sel=>{
    const current=String(sel.value||'');
    [...sel.options].forEach(o=>{
      if(!o.value){
        o.hidden=false;
        return;
      }
      o.hidden=String(o.value)!==current&&used.has(String(o.value));
    });
  });

  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  const bench=[...document.querySelectorAll('.'+side+'-sub-lineup')];
  const xi=new Set(
    sels.map(s=>s.value).filter(Boolean).map(String)
  );

  bench.forEach(sel=>{
    const cur=String(sel.value||'');
    [...sel.options].forEach(o=>{
      if(!o.value){
        o.hidden=false;
        return;
      }
      o.hidden=String(o.value)!==cur&&xi.has(String(o.value));
    });
  });
}

async function saveLineups(){
  const m=matches.find(x=>String(x.id)===String(selectedMatchId));
  if(!m)return;

  const home=lineupIdsFromEditor('home');
  const away=lineupIdsFromEditor('away');
  const hsub=[...document.querySelectorAll('.home-sub-lineup')]
    .map(s=>s.value).filter(Boolean);
  const asub=[...document.querySelectorAll('.away-sub-lineup')]
    .map(s=>s.value).filter(Boolean);

  if(
    home.length!==new Set(home).size||
    away.length!==new Set(away).size||
    hsub.length!==new Set(hsub).size||
    asub.length!==new Set(asub).size
  ){
    showToast('A player cannot appear twice in a lineup or bench');
    return;
  }

  if(home.length!==11||away.length!==11){
    showToast('Select exactly 11 players for each starting XI');
    return;
  }

  if(hsub.some(id=>home.includes(id))||asub.some(id=>away.includes(id))){
    showToast('A starting player cannot also be on the same bench');
    return;
  }

  const meta=matchMeta(m);
  meta.lineups={home,away};
  meta.substitutes={home:hsub,away:asub};

  await updateMatch(m.id,{metadata:meta});
  m.metadata=meta;
  renderAll();
  showToast('Lineups saved');
}

  try{
    const result=await supabaseFetch(MATCHES_URL,{
      method:'POST',
      headers:{Prefer:'return=representation'},
      body:JSON.stringify(match)
    });

      });

      matches.push(Array.isArray(result)?result[0]:result);
      showToast('Match created with legacy fields');
      renderAll();

/* NOTIFICATION SYSTEM */
const MEFCO_NOTIFICATION_PREFS_KEY='mefco_notification_preferences_v2';
const MEFCO_FOLLOWS_KEY='mefco_notification_follows_v2';

let mefcoNotificationSubscription=null;

function mefcoReadJSON(key,fallback){
  try{
    const x=JSON.parse(localStorage.getItem(key)||'null');
    return x??fallback;
  }catch{
    return fallback;
  }
}

function mefcoWriteJSON(key,value){
  try{
    localStorage.setItem(key,JSON.stringify(value));
  }catch{}
}

function notificationPrefs(){
  return {
    ...{
      match_events:true,
      team_events:true,
      player_events:true,
      mefco_news:true,
      community:true
    },
    ...mefcoReadJSON(MEFCO_NOTIFICATION_PREFS_KEY,{})
  };
}

function notificationFollows(){
  return mefcoReadJSON(
    MEFCO_FOLLOWS_KEY,
    {match:[],team:[],player:[]}
  );
}

function saveNotificationFollows(x){
  mefcoWriteJSON(MEFCO_FOLLOWS_KEY,x);
}

function isFollowing(type,id){
  return (notificationFollows()[type]||[])
    .map(String)
    .includes(String(id));
}

async function followTarget(type,id){
  let f=notificationFollows();

  f[type]=Array.from(new Set([
    ...(f[type]||[]).map(String),
    String(id)
  ]));

  saveNotificationFollows(f);
  await syncNotificationFollow(type,id,true);
  scheduleRender();
  showToast('Followed — personalized notifications enabled');
}

function unfollowTarget(type,id){
  let f=notificationFollows();

  f[type]=(f[type]||[])
    .map(String)
    .filter(x=>x!==String(id));

  saveNotificationFollows(f);
  syncNotificationFollow(type,id,false);
  scheduleRender();
  showToast('Unfollowed');
}

function followButton(type,id,label){
  const on=isFollowing(type,id);

  return `<button class="btn small follow-btn ${on?'following':''}" onclick="toggleNotificationFollow('${esc(type)}','${esc(id)}')">
    ${on?'✓ Following':'＋ Follow'}${label?' '+esc(label):''}
  </button>`;
}

function toggleNotificationFollow(type,id){
  if(!['match','team','player'].includes(type))return;

  if(isFollowing(type,id)){
    unfollowTarget(type,id);
  }else{
    followTarget(type,id);

async function ensurePushSubscription(requestPermission=true){
  if(
    !('serviceWorker' in navigator)||
    !('PushManager' in window)||
    !('Notification' in window)
  )return null;

  if(requestPermission&&Notification.permission!=='granted'){
    const p=await Notification.requestPermission();
    if(p!=='granted')return null;
  }

  if(Notification.permission!=='granted')return null;

  try{
    const reg=await navigator.serviceWorker.register(
      '/MEFCOWatch/swnot.js',
      {scope:'/MEFCOWatch/'}
    );

    let sub=await reg.pushManager.getSubscription();

    if(!sub){
      const key=await fetch(
        NOTIFICATION_API+'/api/vapid-public-key'
      ).then(r=>{
        if(!r.ok)throw new Error('VAPID key unavailable');
        return r.text();
      });

      const raw=key.trim();
      const b64=raw.replace(/-/g,'+').replace(/_/g,'/');
      const pad='='.repeat((4-b64.length%4)%4);
      const bin=atob(b64+pad);
      const arr=Uint8Array.from(
        bin,
        c=>c.charCodeAt(0)
      );

      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:arr
      });
    }

    mefcoNotificationSubscription=sub;

    try{
      await fetch(NOTIFICATION_API+'/api/subscribe',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          subscription:sub.toJSON(),
          preferences:notificationPrefs()
        })
      });
    }catch(e){
      console.warn(
        'MEFCO subscription sync unavailable',
        e
      );
    }

    return sub.toJSON();
  }catch(e){
    console.warn('MEFCO push setup:',e);
    return null;
  }
}

async function adjustPlayerStat(id,column,delta){
  const p=playerById(id);
  if(!p)return;

  const current=Number(p[column]||0);
  const next=Math.max(0,current+Number(delta||0));

  try{
    const updated=await supabaseFetch(
      PLAYERS_URL+'?id=eq.'+encodeURIComponent(id),
      {
        method:'PATCH',
        headers:{Prefer:'return=representation'},
        body:JSON.stringify({[column]:next})
      }
    );

    const row=Array.isArray(updated)?updated[0]:updated;

    if(row){
      Object.assign(p,row);
    }else{
      p[column]=next;
    }
  }catch(e){
    console.warn('Could not adjust player stat',e);
  }
}

/* MATCH RATINGS */
function numericStat(obj,keys){
  for(const k of keys){
    const v=Number(obj?.[k]);
    if(Number.isFinite(v))return v;
  }
  return 0;
}

function matchParticipantIds(m){
  const ids=new Set(
    readMatchLineups(m).home
      .concat(readMatchLineups(m).away)
      .map(String)
  );

  for(const e of (m.events||[])){
    if(e.player_id)ids.add(String(e.player_id));

    const mm=String(e.detail||'')
      .match(/(?:OFF_ID|OUT_ID):\s*([^|•]+)/i);

    if(eventType(e)==='substitution'&&mm){
      ids.add(String(mm[1]).trim());
    }
  }

  return [...ids].filter(Boolean);
}

function initialLineupIds(m){
  const ids=new Set(
    readMatchLineups(m).home
      .concat(readMatchLineups(m).away)
      .map(String)
  );

  for(const e of (m.events||[])){
    if(eventType(e)==='substitution'){
      const mm=String(e.detail||'')
        .match(/(?:OFF_ID|OUT_ID):\s*([^|•]+)/i);

      if(mm)ids.add(String(mm[1]).trim());
    }
  }

  return ids;
}

function automaticMatchRating(p,m){
  const meta=matchMeta(m)||{};
  const stats=meta.match_stats||{};
  const events=m.events||[];
  const starting=initialLineupIds(m);
  const pid=String(p.id);
  const ev=events.filter(e=>String(e.player_id||'')===pid);
  const wasStarter=starting.has(pid);

  if(!wasStarter&&!ev.length)return null;
  if(!isFinished(m))return null;

  const group=normalizePosition(p.position);
  const isGK=group==='gk';

  let r=6.0;

  const n=(keys)=>numericStat(p,keys);
  const count=t=>ev.filter(e=>eventType(e)===t).length;

  const ps=
    stats.players?.[pid]||
    stats.player_stats?.[pid]||
    meta.player_metrics?.[pid]||
    meta.match_intelligence?.players?.[pid]||
    {};

  const stat=(keys)=>{
    const v=n(keys);
    if(v)return v;
    return numericStat(ps,keys);
  };

  const goals=count('goal');
  const assists=count('assist');
  const yellow=count('yellow');
  const red=count('red');

  r+=goals*1.0+assists*.7;
  r+=stat(['shots_on_target','shotsOnTarget','on_target'])*.25;
  r+=stat(['shots','total_shots','shot_attempts'])*.05;
  r+=stat(['key_passes','keyPasses','chance_created'])*.12;
  r+=stat(['passes_completed','completed_passes','accurate_passes'])*.006;
  r+=stat(['tackles','successful_tackles'])*.12;
  r+=stat(['interceptions'])*.12;
  r+=stat(['clearances'])*.04;
  r+=stat(['blocks','blocked_shots','shots_blocked'])*.07;
  r+=stat(['dribbles_completed','successful_dribbles','take_ons_won'])*.10;
  r+=stat(['fouls_won','foulsWon'])*.05;
  r+=stat(['recoveries','ball_recoveries'])*.02;
  r-=stat(['fouls_committed','fouls','foulsCommitted'])*.06;
  r-=stat(['offsides','offside'])*.08;
  r-=yellow*.2+red*.8;

  const saves=stat(['saves','save']);
  const penSaves=stat(['penalty_saves','penaltySaves']);

  if(isGK)r+=saves*.45+penSaves*.7;

  const team=String(p.team_id||'');
  const [hs,as]=scoreOf(m);

  const conceded=
    team===String(m.home_team_id)
    ?as
    :team===String(m.away_team_id)
    ?hs
    :0;

  if(isGK)r-=conceded*.45;
  else if(group==='def')r-=conceded*.05;

  const minutes=Number(
    ps.minutes??
    p.minutes_played??
    p.minutes??
    0
  )||0;

  if(minutes>0&&minutes<30)r-=.25;
  else if(minutes>=75)r+=.1;

  if(group==='def'){
    r+=stat(['tackles','successful_tackles'])*.04;
    r+=stat(['interceptions'])*.04;
    r+=stat(['clearances'])*.025;
  }

  if(group==='mid'){
    r+=stat(['key_passes','keyPasses'])*.04;
    r+=stat(['passes_completed','completed_passes'])*.002;
  }

  if(group==='fwd'){
    r+=stat(['shots_on_target','shotsOnTarget'])*.08;
    r+=goals*.1;
  }

  return Math.max(
    3,
    Math.min(
      10,
      Math.round(r*10)/10
    )
  );
}

function automaticMOTM(m){
  const ids=matchParticipantIds(m);

  const candidates=ids
    .map(id=>playerById(id))
    .filter(Boolean)
    .map(p=>({
      p,
      r:automaticMatchRating(p,m)
    }))
    .filter(x=>x.r!=null);

  candidates.sort(
    (a,b)=>
      b.r-a.r||
      String(a.p.name||'').localeCompare(
        String(b.p.name||'')
      )
  );

  return candidates[0]||null;
}
